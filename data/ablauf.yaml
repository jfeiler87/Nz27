32:
  "intro": "Farewell Spit und Wharariki Beach, beide tideabhängig, mit zwei Varianten."
  "text": |-
    Heute hängt alles an der Tide. Die Farewell Spit Tour dauert rund sechs Stunden und ist gezeitenabhängig, mit Dünen und Leuchtturm. Die Tourzeiten für April 2027 sind noch nicht veröffentlicht, deshalb gibt es zwei Varianten. Golden Bay ist als Puffer gedacht.

    Mit Tour startet ihr zur gebuchten Zeit am Büro in Collingwood. Ohne Tour könnt ihr Wharariki Beach morgens oder nachmittags besuchen. Der Weg vom Parkplatz dauert rund 20 Minuten durch Dünen, am Strand warten die Archway Islands und Robbenbabys in den Felspools. Je nach Ebbe oder Flut (Gezeitentabelle prüfen) ist früher oder später besser.

    Die Nacht verbringt ihr wieder im Collingwood Camping Ground. Sonnenuntergang ist um 17:54, das Licht am Nachmittag ist ideal für Fotos. Der Tag ist flexibel, wählt je nach Gezeiten und Wetter. Die Golden Bay ist am Ende der Straße, hier endet die Reise nach Norden. Mehrere Pufferstunden sind eingeplant, weil Tourzeiten sich nach den Gezeiten richten. Bleibt flexibel und entscheidet erst nach Blick in die Tabelle.
