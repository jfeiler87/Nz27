34:
  "intro": "Von den Weinbergen ans Meer nach Kaikōura, mit Ohau Point als Robbenstopp."
  "text": |-
    Heute fahrt ihr von Pelorus Bridge über Blenheim nach Kaikōura, 182 km und rund 3:10 h im Camper. Am Vormittag ist optional das Omaka Aviation Heritage Centre bei Blenheim möglich, mit Weta-Dioramen. In Blenheim gibt es Mittagessen und die Dump Station, deren Standort laut Plan unsicher ist.

    Ab dort folgt die SH1 der Küste. Am Ohau Point Lookout liegt eine Robbenkolonie direkt an der Straße. Das ist ein einfacher Stopp ohne Wanderung, mit Blick aufs Meer.

    Die Nacht verbringt ihr am Puhi Puhi DOC Campsite, erreichbar über 6 km Nebenstraße, teils Schotter. Alternativen sind der West End Car Park und der Kaikoura TOP 10 Holiday Park. Sonnenuntergang ist um 17:45. Am 21.04. ist Vollmond, das Meer liegt im Mondlicht. Die Fahrt entlang der Küste bei Kaikōura ist spektakulär: Meer links, Berge rechts. Die Straße ist schmal, fahrt entspannt und nutzt die Haltebuchten für Fotos. Am Abend kommt die Ruhe am Meer nach der langen Fahrt.
