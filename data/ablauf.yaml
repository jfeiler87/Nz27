12:
  "intro": "Von der Südküste nach Te Anau: Einkauf in Invercargill, Versorgung und ein Platz am See."
  "text": |-
    Heute lasst ihr die Catlins hinter euch. Die Fahrt führt über Invercargill nach Te Anau, 258 km und reine 3:30 h, im Camper rund 4:15 h. Es ist ein Versorgungstag vor der Milford Road, wo es keine Läden gibt. In Invercargill kauft ihr für drei Nächte ein.

    In Te Anau stehen Tanken (Caltex, Bowen St) und die Dump Station im Lakeview Holiday Park an, deren Standort laut Plan unsicher ist. Frisches gibt es bei Fresh Choice. Dazu bleibt Zeit für die Promenade am See, ein Kaffee und ein Ruhetag-Gefühl. Die Landschaft wird nach Norden hin gebirgiger, Fiordland kündigt sich an.

    Die Nacht verbringt ihr am Henry Creek DOC Campsite am Lake Te Anau, etwa 25 Minuten nördlich. Als Alternative gibt es den Te Anau Lakeview Holiday Park mit Wäsche, Strom und Dump, sinnvoll nach sechs Nächten seit Oamaru. Sonnenuntergang ist um 19:44. Der Tag hat keine Pflichtprogramme, nur die Strecke und die Versorgung. Wer das Fahren leid ist, legt in Invercargill eine längere Pause ein. Die Berge von Fiordland tauchen gegen Ende der Fahrt am Horizont auf und kündigen die kommenden Tage an.
  "schritte":
  - "zeit": "~08:30"
    "text": "Abfahrt in Curio Bay. Reine Fahrzeit 3:30 h, im Camper rund 4:15 h plus Stopps."
  - "zeit": "~10:00"
    "text": "Invercargill: Einkauf im Supermarkt für die drei Nächte an der Milford Road."
  - "zeit": "~11:30"
    "text": "Mittagspause unterwegs, danach Weiterfahrt nach Te Anau."
  - "zeit": "~14:00"
    "text": "Te Anau: Tanken bei Caltex (Bowen St) und Dump Station im Lakeview HP (Standort laut Plan unsicher). Frische Sachen bei Fresh Choice."
  - "zeit": "~15:00"
    "text": "Spaziergang an der See-Promenade, Kaffeepause."
  - "zeit": "~16:30"
    "text": "Zu Henry Creek am Lake Te Anau, ca. 25 Minuten. Alternativ Te Anau Lakeview Holiday Park für Wäsche und Strom (sechs Nächte seit Oamaru)."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:44."
13:
  "intro": "Kurze Fahrt in den Fiordland-Urwald zum Cascade Creek, mit Mirror Lakes und Lake Gunn."
  "text": |-
    Heute beginnt die Milford Road, eine der berühmtesten Straßen Neuseelands. Die Strecke ist mit 52 km und knapp 50 Minuten reiner Fahrzeit kurz, dafür gibt es viele Stopps. Die Landschaft ändert sich rasch: Urwald, Seen und steile Berge.

    Der erste Halt sind die Mirror Lakes, nur fünf Minuten vom Parkplatz. Bei Windstille spiegeln sich die Berge im Wasser. Danach geht es zum Cascade Creek DOC Campsite, wo ihr den Lake Gunn Nature Walk macht: 45 Minuten durch Urwald. Als Alternative gibt es den Knobs Flat Campsite, dessen Standort laut Plan unsicher ist.

    Auf der Milford Road gibt es keine Läden, also Mittagessen und Proviant vorher einpacken. Der Sonnenuntergang um 19:41 kommt früh genug, damit ihr zeitig zur Ruhe kommt. Morgen ist Milford Sound, ihr solltet früh aufstehen und das Wetter prüfen. Die Fahrt auf der Milford Road beginnt in offener Seenlandschaft und endet im dichten Wald. Fotostopps gibt es viele, lasst euch Zeit. Sandfliegen und Kühle sind im Fiordland normal, eine warme Jacke und Insektenschutz gehören in den Rucksack.
  "schritte":
  - "zeit": "~09:30"
    "text": "Aufbruch am Camp, Weg Richtung Te Anau Downs und Milford Road (reine Fahrzeit 0:43 h, im Camper gut 50 Minuten)."
  - "zeit": "~10:30"
    "text": "Mirror Lakes: 5 Minuten, bei Windstille spiegeln sich die Berge im Wasser."
  - "zeit": "~12:00"
    "text": "Mittagessen unterwegs. Auf der Milford Road gibt es keine Läden mehr."
  - "zeit": "~13:30"
    "text": "Ankunft am Cascade Creek DOC Campsite, Platz suchen. Alternative: Knobs Flat (Standort laut Plan unsicher)."
  - "zeit": "~14:30"
    "text": "Lake Gunn Nature Walk, 45 Minuten durch Urwald."
  - "zeit": "~16:30"
    "text": "Camp einrichten, Wetter für morgen prüfen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:41, früh essen und schlafen, damit die Milford-Fahrt morgen entspannt startet."
14:
  "intro": "Milford Sound vor den Tourbussen: früh los, Cruise und The Chasm."
  "text": |-
    Der Höhepunkt der Fiordland-Tage ist Milford Sound. Wer früh fährt, ist vor den Tourbussen am Fjord und hat am Homer Tunnel weniger Wartezeit an der Ampel. Von Cascade Creek bis zum Cruise Terminal ist es ein Stück, im Camper dauert die Fahrt länger als rechnerisch. Sonnenaufgang ist um 08:04.

    Die Cruise dauert rund zwei Stunden und führt am Mitre Peak, an Wasserfällen und an Robben vorbei. Sie sollte mit flexibler Umbuchung gebucht sein: Bei Regen oder Sperre wird sie auf morgen verschoben. Nach der Rückkehr lohnt The Chasm, ein kurzer Weg von 20 Minuten zu einem Wasserfall in einer Felsschlucht.

    Zurück am Cascade Creek bleibt Zeit zum Ausruhen am Lake Gunn. Sonnenuntergang ist um 19:39. Der Tag ist ein Fahrtag mit einem großen Programmpunkt, also plant Pausen ein. Morgen ist der Puffertag, der falls nötig die Cruise auffängt. Plant die Rückfahrt gelassen, denn auch am Homer Tunnel kann es zu Wartezeiten kommen. Wer früh startet, hat ruhigere Straßen und freie Parkplätze am Terminal. Mit dem Fjord im Rücken fühlt sich der Nachmittag am See entspannt an.
  "schritte":
  - "zeit": "~07:00"
    "text": "Aufbruch am Cascade Creek. Sonnenaufgang 08:04, die Strecke zum Fjord dauert im Camper länger als die rechnerische Fahrzeit."
  - "zeit": "~08:00"
    "text": "Homer Tunnel mit Ampel, ein paar Minuten Wartezeit einrechnen."
  - "zeit": "~08:45"
    "text": "Ankunft am Cruise Terminal Milford Sound, Parkplatz suchen."
  - "zeit": "~09:15"
    "text": "Milford Sound Cruise, ca. 2 Stunden mit Mitre Peak, Wasserfällen und Robben. Gebuchte Abfahrtszeit gilt, früh buchen lohnt sich."
  - "zeit": "~12:00"
    "text": "Mittagessen am Terminal oder am Camper."
  - "zeit": "~13:00"
    "text": "Rückfahrt, Stopp an The Chasm, 20 Minuten Waldweg zum Wasserfall."
  - "zeit": "~15:00"
    "text": "Zurück am Cascade Creek, Ruhe am Lake Gunn."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:39. Fällt die Cruise aus, wird sie auf Tag 15 geschoben."
15:
  "intro": "Pufferfenster an der Milford Road: Cruise nachholen oder ruhiger Tag mit Key Summit als Option."
  "text": |-
    Heute ist der Pufferplan für Milford. Hat die Cruise gestern geklappt, wird der Tag ruhig. War sie ausgefallen, wird sie nachgeholt, das kostet wieder die frühe Fahrt zum Fjord. Beide Varianten sind eingeplant, damit keine Hektik aufkommt.

    Für die ruhige Variante gibt es den Key Summit ab The Divide: 3 Stunden hin und zurück, rund 400 Höhenmeter, ein Grenzfall zu eurem Profil. Geht nur bei Lust und Sicht. Alternativ bleibt ein Scenic Flight, oder ihr genießt die Zeit am See. Die Landschaft an der Milford Road lädt auch zum einfachen Sitzen und Schauen ein.

    Die Nacht verbringt ihr am Henry Creek DOC Campsite, näher an Te Anau. Das macht die Fahrt morgen nach Queenstown kürzer. Die Strecke über Te Anau Downs ist mit 52 km kurz. Sonnenuntergang ist um 19:38. Prüft am Abend Wäsche und Vorräte für Queenstown. Egal welche Variante: Der Tag soll nicht stressen. Wetter in Fiordland wechselt schnell, deshalb wird erst am Morgen entschieden. Wer die Cruise nicht nachholen muss, hat einen freien Tag in einer der schönsten Gegenden der Reise.
  "schritte":
  - "zeit": "~08:30"
    "text": "Wetter und Cruise-Status prüfen. Variante A: Cruise gestern gemacht. Variante B: Cruise ausgefallen."
  - "zeit": "~09:00"
    "text": "Variante B: früh nach Milford Sound zur Ersatz-Cruise (Homer Tunnel Ampel, Abfahrtszeit nach Umbuchung). Variante A: Ruhiger Start, Frühstück am See."
  - "zeit": "~10:00"
    "text": "Variante A: Optional Key Summit ab The Divide, 3 Stunden hin und zurück, rund 400 Hm, Grenzfall und nur bei Lust und Sicht."
  - "zeit": "~13:00"
    "text": "Mittagessen am Camper oder am Divide."
  - "zeit": "~14:00"
    "text": "Variante A ohne Wanderung: Scenic Flight oder einfach Zeit am See. Variante B: nach der Cruise Rückfahrt."
  - "zeit": "~16:00"
    "text": "Rückfahrt über Te Anau Downs (reine Fahrzeit 0:43 h) zum Henry Creek DOC Campsite."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:38. Wäsche und Vorräte für Queenstown prüfen."
16:
  "intro": "Nach Queenstown mit Wäsche, Gondel im Abendlicht und Nacht am Moke Lake. Nachts werden die Uhren zurückgestellt."
  "text": |-
    Von Te Anau Downs führt die Straße über 209 km nach Queenstown, reine 2:48 h, im Camper rund 3:20 h. Am Mittag erreicht ihr den Lake Wakatipu, der Tag wird dann zum Stadttag. Zuerst stehen praktische Dinge an: Wäsche im Washatipu Laundry und die Dump Station, deren Standorte laut Plan unsicher sind.

    Am späten Nachmittag fahrt ihr mit der Skyline-Gondel hinauf, optional gibt es die Luge. Die Aussicht über den See im Abendlicht ist der Höhepunkt. Danach folgt das Fergburger, mit einer Schlange ist zu rechnen. Freedom Camping ist in Queenstown nur auf ausgewiesenen QLDC-Plätzen erlaubt, sonst droht eine Strafe von 400 NZD.

    Die Nacht verbringt ihr am Moke Lake DOC Campsite, ungefähr 6 km Zufahrt mit kurzem Schotter. Kommt vor dem Sonnenuntergang um 19:34 an. Nachts um 3:00 werden die Uhren auf 2:00 zurückgestellt, ihr gewinnt eine Stunde Schlaf. Die Fahrt führt am Ende am Lake Wakatipu entlang in die Stadt. Queenstown ist im Herbst belebt, wegen der Schulferien Mitte April sogar noch voller. Der Moke Lake ist dagegen ruhig, und der Abend dort bildet einen schönen Kontrast zum Trubel.
  "schritte":
  - "zeit": "~09:00"
    "text": "Abfahrt am Henry Creek. Reine Fahrzeit 2:48 h, im Camper rund 3:20 h."
  - "zeit": "~12:30"
    "text": "Ankunft in Queenstown, Mittagessen."
  - "zeit": "~13:30"
    "text": "Wäsche im Washatipu Laundry (Beach St, Selbstbedienung) und Dump Station (Standorte laut Plan unsicher). Freedom Camping nur auf ausgewiesenen QLDC-Plätzen."
  - "zeit": "~16:00"
    "text": "Skyline-Gondel am späten Nachmittag, optional Luge. Aussicht über den See im Abendlicht."
  - "zeit": "~18:00"
    "text": "Fergburger, rechne mit Schlange."
  - "zeit": "~19:00"
    "text": "Fahrt zum Moke Lake DOC Campsite, rund 6 km Zufahrt mit kurzem Schotterstück. Sonnenuntergang 19:34, vorher ankommen."
  - "zeit": "nachts"
    "text": "Nachts um 3:00 werden die Uhren auf 2:00 zurückgestellt, eine Stunde mehr Schlaf."
17:
  "intro": "Herbstfarben in Arrowtown, optional Dampfschiff oder Jetboat und Aussicht über Deer Park Heights."
  "text": |-
    Der Tag gehört Queenstown und Arrowtown, ohne Fahrtstress. Die Uhren sind seit der Nacht eine Stunde zurück, der Morgen beginnt später. Anfang April sind die Herbstfarben in Arrowtown auf dem Höhepunkt. Deshalb kommt der Ort früh am Tag, wenn es noch ruhig ist.

    Arrowtown ist ein Goldgräber-Städtchen mit historischen Häusern und dem Chinese Settlement. Parken könnt ihr an der Buckingham St. Danach bleibt Zeit für Kaffee und Läden. Am Nachmittag sind zwei Optionen möglich: das Dampfschiff TSS Earnslaw oder ein Adrenalin-Erlebnis wie Jetboat, beides nach Buchung. Deer Park Heights ist eine Mautstraße mit Aussicht und Drehorten, der Standort ist laut Plan unsicher.

    Die Nacht verbringt ihr wieder am Moke Lake DOC Campsite. Sonnenuntergang ist um 18:32. Der Tag ist ohne Pflichttermine, wählt nach Wetter und Laune. Am Morgen am Moke Lake lohnt ein kurzer Spaziergang am See, bevor es in die Stadt geht. Der Tag hat keine festen Zeiten, nur die optionalen Buchungen. Wählt nach Wetter, und lasst die Gondel oder das Schiff aus, wenn die Sicht schlecht ist.
  "schritte":
  - "zeit": "~09:00"
    "text": "Frühstück am Moke Lake, entspannter Start nach der Zeitumstellung."
  - "zeit": "~10:00"
    "text": "Fahrt nach Arrowtown, Parken an der Buckingham St."
  - "zeit": "~10:30"
    "text": "Arrowtown: Goldgräberhäuschen, Chinese Settlement, Herbstfarben. Zeit für Kaffee und Läden."
  - "zeit": "~13:00"
    "text": "Mittagessen in Arrowtown oder am Camper."
  - "zeit": "~14:30"
    "text": "Optional TSS Earnslaw (Dampfschiff) oder Jetboat, Abfahrt am Steamer Wharf. Zeit laut Buchung."
  - "zeit": "~16:00"
    "text": "Optional Deer Park Heights (Mautstraße, Standort unsicher), Aussicht und Drehorte."
  - "zeit": "abends"
    "text": "Zurück zum Moke Lake DOC Campsite, Sonnenuntergang 18:32."
18:
  "intro": "Kurze Fahrt zum Seekopf nach Glenorchy: Bennetts Bluff, Lagoon Walk und roter Bootsschuppen."
  "text": |-
    Von Queenstown nach Glenorchy sind es 47 km und knapp 45 Minuten im Camper. Die Straße verläuft am Lake Wakatipu entlang, und die Berge ragen steil auf. Es ist eine der schönsten Strecken der Reise, gerade weil sie so kurz ist. In Queenstown füllt ihr noch einmal Vorräte auf und tankt.

    Der Aussichtspunkt Bennetts Bluff liegt unterwegs. In Glenorchy erwarten euch der rote Bootsschuppen am Wharf und der Lagoon Walk. Der Abend am Seekopf ist stimmungsvoll. Paradise im Dart-Tal ist optional und nur sinnvoll, wenn der Schotter ab Asphaltende kürzer als 12 km ist; das müsst ihr vor Ort prüfen.

    Die Nacht verbringt ihr im Mrs Woolly's Campground. Als Alternative gibt es den Twelve Mile Delta DOC Campsite. Sonnenuntergang ist um 18:31. Der Neumond naht, die Nächte werden dunkler. Die Straße nach Glenorchy ist kurvig und eng, im Camper heißt das gemütliches Tempo. Wer nachmittags am Seekopf ist, erlebt das weiche Licht der Berge. Der rote Bootsschuppen ist ein beliebtes Fotomotiv, abends oft ohne Gedränge.
  "schritte":
  - "zeit": "~09:30"
    "text": "Abfahrt am Moke Lake, über Queenstown nach Glenorchy (reine Fahrzeit 0:37 h, im Camper rund 45 Minuten)."
  - "zeit": "~10:00"
    "text": "Letzte Einkäufe in Queenstown, Tanken. In Glenorchy gibt es nur wenig."
  - "zeit": "~11:00"
    "text": "Bennetts Bluff Lookout, Aussicht auf den See."
  - "zeit": "~12:00"
    "text": "Ankunft in Glenorchy, Mittagessen."
  - "zeit": "~13:30"
    "text": "Lagoon Walk und roter Bootsschuppen am Wharf."
  - "zeit": "~15:00"
    "text": "Optional Paradise im Dart-Tal, nur wenn der Schotter ab Asphaltende kürzer als 12 km ist (vor Ort prüfen)."
  - "zeit": "~17:00"
    "text": "Einchecken im Mrs Woolly's Campground. Alternative: Twelve Mile Delta DOC."
  - "zeit": "abends"
    "text": "Sonnenuntergang 18:31, Abend am Seekopf."
19:
  "intro": "Über die Kawarau Gorge nach Wanaka, weil die Crown Range für Britz verboten ist. Die Strecke ist länger als im Plan."
  "text": |-
    Die Crown Range ist für Britz gesperrt, daher geht es über Queenstown und die Kawarau Gorge nach Cromwell und weiter nach Wanaka. Die im Plan genannten 118 km passen dafür vermutlich nicht, rechnet mit rund drei Stunden reiner Fahrzeit im Camper. Es ist ein Fahrtag mit landschaftlicher Abwechslung.

    An der Kawarau Bridge könnt ihr beim Bungy zuschauen, das ist optional. In Cromwell lohnen sich das Heritage Precinct und die Obststände, ein guter Platz für die Mittagspause. In Wanaka tankt ihr bei BP Connect und checkt im Albert Town Campground ein.

    Am Abend fahrt ihr zum Roys Bay Parkplatz und zu That Wanaka Tree. Sonnenuntergang ist um 18:26, das Licht ist weich. Als Alternative zum Campground gibt es den Wanaka Holiday Park. Der Tag ist lang, aber der See entschädigt. Die Kawarau Gorge ist eine schmale Schlucht mit Fluss und Felswänden. Danach öffnet sich das Land zu Obstgärten und Weinbergen um Cromwell. Wer die Strecke ruhig angeht, hat am Ende noch Zeit für den Sonnenuntergang am Baum in Wanaka.
  "schritte":
  - "zeit": "~09:00"
    "text": "Abfahrt in Glenorchy, über Queenstown. Die Strecke über Cromwell ist länger als die rechnerischen 118 km, rechne mit rund 3 Stunden reiner Fahrzeit im Camper."
