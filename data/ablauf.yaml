42:
  "intro": "Der längste Fahrtag auf der Nordinsel: von Castlepoint bis Napier, mit Te Mata Peak als Abendlicht-Stopp."
  "text": |-
    Heute stehen fast fünf Stunden Fahrzeit im Camper an, die längste Etappe des Nordinsel-Abschnitts. Von der Küste bei Castlepoint geht es nach Westen und dann nach Norden durch die Wairarapa und weiter Richtung Hawke's Bay. Die Straße führt durch weite Farmlandschaft, die zum Ziel hin offener wird. Ein früher Aufbruch ist hier sinnvoll, damit am Ende noch Tageslicht für den Höhepunkt bleibt.

    Plant zwei längere Pausen ein: eine nach zwei Stunden und ein richtiges Mittagessen. Zum Tanken lieber vorher als erst bei Reserve anhalten. Der Te Mata Peak bei Havelock North liegt kurz vor Napier und gibt Weitblick über die Hawke's Bay. Die Auffahrt geht bis zum Gipfelparkplatz, es braucht also keine Wanderung.

    Die Nacht verbringt ihr am Perfume Point (Te Karaka) in Napier. Wenn ihr zu müde seid, ist der Napier Beach TOP 10 Holiday Park die bequemere Wahl. Morgen ist Napier-Tag mit Art Deco, deshalb heute nichts mehr erzwingen.
