43:
  "intro": "Ein ganzer Tag in Napier: Art-Deco-Rundgang und optional Cape Kidnappers, dazu Wäsche und Dump."
  "text": |-
    Nach dem langen Fahrtag ist Napier ein Ruhetag mit Kultur. Die Stadt wurde im Art-Deco-Stil neu aufgebaut, und der Rundgang vom Art Deco Centre aus führt an den Fassaden und der Promenade entlang. Das Wetter an der Küste entscheidet, ob man sich lange auf der Marine Parade aufhält, oder ins Café geht.

    Am Nachmittag steht Cape Kidnappers an, eine Tour zu den Klippen mit Tölpelkolonie. Sie ist optional, weil die Saison laut Plan am 30.04. endet und die Abfahrtszeit nach Buchung gilt. Wer nicht fährt, hat Zeit für den Strand oder einen weiteren Stadtbummel.

    Die Nacht ist wieder auf einem Holiday Park. Das passt, denn nach fast einer Woche unterwegs gibt es Strom, Wäsche und Dump. Nutzt die Gelegenheit, den Camper aufzuräumen, bevor es morgen nach Taupō geht. Napier liegt am Meer und hat ein mildes Klima. Der Tag verbindet Kultur, Strand und Natur. Wer die Tölpelkolonie sehen möchte, sollte die Tour vorab sichern, denn die Saison endet heute.
  "schritte":
