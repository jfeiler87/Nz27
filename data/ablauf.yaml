52:
  "intro": "Tide-Tag in Hahei: Hot Water Beach zur Ebbe und Cathedral Cove, die Reihenfolge richtet sich nach der Gezeitentabelle."
  "text": |-
    Heute steht alles unter dem Zeichen der Gezeiten. Hot Water Beach ist nur rund um die Ebbe besonders spannend: Dann könnt ihr im Sand eigene Pools graben, in die heißes Wasser aufsteigt. Das Zeitfenster beträgt etwa zwei Stunden um Ebbe. Eine Schaufel gehört ins Gepäck, die genaue Zeit steht in der Gezeitentabelle.

    Cathedral Cove ist das zweite Ziel. Der Weg ist in der Vergangenheit nach Erdrutschen zeitweise gesperrt gewesen, daher vorher den Wegstatus prüfen. Ist der Zugang gesperrt, gibt es die Alternative per Boot. Startpunkt ist der Hahei Visitor Car Park (Park & Ride).

    Wenn die Ebbe am Vormittag liegt, geht ihr zuerst zum Hot Water Beach. Liegt sie nachmittags, kommt Cathedral Cove zuerst dran. Das gibt einen entspannten Rhythmus mit Mittagspause im Ort. Am Abend nach dem Sonnenuntergang um 17:24 tut eine warme Dusche im Resort gut. Beide Ziele sind sehr beliebt und können voll sein, besonders in Schulferienzeiten. Kommt eher etwas früher. Nach dem Graben im heißen Sand tut ein warmes Getränk am Camper gut.
