    "text": "Kawarau Bridge: Bungy zuschauen (optional), Parkplatz AJ Hackett."
  - "zeit": "~12:00"
    "text": "Cromwell Heritage Precinct und Obststände, Mittagessen."
  - "zeit": "~14:00"
    "text": "Weiter nach Wanaka, Tanken (BP Connect) bei Ankunft."
  - "zeit": "~15:30"
    "text": "Einchecken im Albert Town Campground."
