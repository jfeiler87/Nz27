48:
  "intro": "Fixpunkt des Tages: Hobbiton Evening Banquet um 15:30. Davor noch ein kurzer Abstecher zur Natural Bridge, dann rechtzeitig nach Matamata."
  "text": |-
    Der Tag hat einen festen Termin: Um 15:30 beginnt das Hobbiton Evening Banquet, und dafür solltet ihr 15 Minuten früher am Shires Rest sein. Von Waitomo bis dorthin braucht ihr rund zwei Stunden. Am Vormittag bleibt nur wenig Spielraum, deshalb gibt es nur kurze Stopps, die ohne Hetze möglich sind. Die Mangapohue Natural Bridge ist in 20 Minuten besucht, die Marokopa Falls sind optional und nur etwas für einen frühen Aufbruch.

    Plant die Abfahrt aus der Gegend nicht später als 11:00 bis 11:30. Die ursprünglich notierte Abfahrt um 14:00 wäre zu spät. Unterwegs findet ihr eine Mittagspause in einem der Orte zwischen Waitomo und Matamata. Parken ist am Shires Rest möglich.

    Die Tour dauert etwa 4,5 Stunden und endet gegen 20:00, mit Laternenrundgang im Dunkeln. Nur das erste Getränk ist inklusive, der Fahrer sollte es bei diesem bleiben lassen. Zehn Minuten entfernt wartet der Opal Hot Springs Holiday Park mit Thermalbecken für den Abend.
