25:
  "intro": "Zum Hokitika Gorge und zum Treibholzstrand: türkises Wasser und Sonnenuntergang."
  "text": |-
    Von Franz Josef führt die SH6 nach Norden nach Hokitika, 112 km und reine 1:28 h, im Camper rund 1:45 h. Der Hokitika Gorge liegt abseits der Hauptstraße und verlängert die Fahrt. Er ist es wert: Türkisfarbener Fluss und eine Hängebrücke, rund eine Stunde Zeit.

    In Hokitika gibt es Mittagessen, Tanken bei Challenge und die Dump Station. Danach fahrt ihr zum Lake Māhinapua DOC Campsite und sichert euch einen Platz. Der Abend gehört dem Strand: Das Hokitika Beach Sign mit den Treibholz-Buchstaben ist ein beliebter Ort zum Sonnenuntergang.

    Sonnenuntergang ist um 18:10, also fahrt ihr früh genug zurück in den Ort. Der Campsite liegt etwas außerhalb am See, ruhig und grün. Der Tag ist gut machbar, wenn ihr nicht trödelt, aber ohne Eile. Der Weg verläuft an der Küste der West Coast, mit Regenwald, Seen und Flussmündungen. Der Hokitika Gorge ist der einzige größere Abstecher. Plant zwischen den Stopps Pausen ein, denn die Straßen sind kurvig und der Tag insgesamt gut gefüllt.
