  - "zeit": "~15:30"
    "text": "Tāne Mahuta, größter Kauri, kurzer Weg."
  - "zeit": "~16:15"
    "text": "Trounson Kauri Park DOC Campground beziehen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:28. Nachts Kiwi-Rufe."
60:
  "intro": "Letzte Fahrt nach Auckland: Muriwai optional, dann Dump, Tanken und die letzte Nacht am Ambury Regional Park."
  "text": |-
    Die letzte Fahrt führt aus dem Waipoua-Wald nach Süden bis Auckland. Mit rund vier Stunden im Camper ist der Tag gut machbar. Wer Lust hat, schaut bei Muriwai vorbei: schwarzer Surfstrand und Klippen laden zu einem kurzen Spaziergang ein, es ist aber optional.

    Wichtig ist das Timing in Auckland. Plant, vor dem Feierabendverkehr in der Stadt zu sein. Auf dem Weg zum Campground liegt die Dump Station Mobil Wiri, nahe der Britz-Station, und ihr tankt nahe Māngere voll, damit morgen alles bereit ist.

    Der Ambury Regional Park Campground ist ein Bauernhof-Campingplatz, etwa 15 Minuten von der Britz-Station entfernt. Er muss vorab gebucht sein. Am Abend packt ihr und putzt den Camper innen. Morgen ist Rückgabe, also lieber heute schon ordnen. Rushhour in Auckland vermeidet ihr durch frühe Ankunft. Die Fahrt endet in einem Stadtpark mit Bauernhof-Charakter. Der Abend dient dem Packen, damit die Rückgabe morgen reibungslos läuft. Der Camper sollte vorher leer und sauber sein.
