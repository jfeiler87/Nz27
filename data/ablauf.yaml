30:
  "intro": "Abel Tasman Nationalpark: Wassertaxi hin, zu Fuß zurück oder Kajaktour."
  "text": |-
    Heute steht der Abel Tasman Nationalpark auf dem Programm, ohne Fahrtstrecke. Ihr fahrt mit dem Wassertaxi nach Anchorage oder Bark Bay und lauft zurück nach Marahau. Der Abschnitt sollte höchstens 12 km lang sein, bei Bark Bay prüft ihr vorher die Länge. Alternativ gibt es eine geführte Kajaktour.

    Der Küstenpfad führt durch Wald und an goldenen Stränden entlang, mit Blick auf das türkisfarbene Wasser. Packt Wasser, Proviant und Regenjacke ein. Das Wassertaxi ist in den Schulferien vorab gebucht, die Abfahrtszeit richtet sich nach der Buchung.

    Am Nachmittag seid ihr zurück im Marahau Beach Camp. Sonnenuntergang ist um 17:56. Der Tag ist anstrengend, aber das Profil passt zu eurem Pensum, wenn ihr den Abschnitt klug wählt. Wählt den Wanderabschnitt nach Gezeiten und Boot, nicht nach Ehrgeiz. Ein Tag im Nationalpark soll ein Genuss sein, kein Marsch. Am Ende kehrt ihr mit müden Beinen und vielen Bildern zum Camper zurück. Ein früher Rückzug zum Camper ist ausdrücklich erlaubt.
