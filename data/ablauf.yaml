22:
  "intro": "Kurzer Fahrtag an der Küste nach Fox Glacier, Lake Matheson am Abend."
  "text": |-
    Heute geht es entlang der Westküste nach Norden bis Fox Glacier. Die Strecke ist mit 71 km und gut einer Stunde reiner Fahrzeit kurz; zwischen Regenwald und Weideland tauchen bei klarem Wetter erstmals die Gletscherberge auf. Ihr könnt den Morgen am Lake Paringa ruhig angehen lassen.

    In Fox Glacier checkt ihr im Fox Glacier TOP 10 Holiday Park ein, mit Wäsche und Strom. Der Platz liegt nah am Lake Matheson, was für den Morgen praktisch ist.

    Am späten Nachmittag fahrt ihr zum Lake Matheson. Die Spiegelung funktioniert bei Windstille, Sonnenuntergang ist um 18:18. Klappt es heute nicht, probiert ihr es morgen früh noch einmal. Der Tag ist leicht und lässt Zeit zum Ausruhen. Die Tage in Fox und Franz Josef drehen sich um die Gletscher. Heute ist es noch ruhig: ein kurzer Fahrtag, Wäsche und Strom im Holiday Park und am Abend der See. Der frühe Sonnenuntergang um 18:18 setzt dem Tag einen klaren Rahmen.
