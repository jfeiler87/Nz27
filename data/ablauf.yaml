  - "zeit": "abends"
    "text": "Neumond 06.05., dunkler Himmel, Sterne."
50:
  "intro": "Geothermie-Tag: Wai-O-Tapu mit dem Lady-Knox-Geysir um 10:15, optional Te Puia, am Nachmittag Wäsche und Dump."
  "text": |-
    Heute steht das Herz der Geothermie auf dem Programm. Der Tag beginnt mit der Fahrt zu Wai-O-Tapu, wo um 10:15 der Lady Knox Geysir ausbricht. Kommt rechtzeitig, damit ihr einen guten Platz bekommt. Danach geht es auf dem Rundweg durch den Park mit farbigen Becken und dem Champagne Pool, einem der Höhepunkte.

    Am frühen Nachmittag seid ihr zurück in Rotorua. Für die Versorgung gibt es einen 24/7 Waschsalon, und die Dump Station ist kostenlos. Das Organisatorische ist schnell erledigt. Wer noch Energie hat, besucht optional Te Puia mit dem Pōhutu-Geysir und Einblicken in die Māori-Kultur.

    Der Rückweg zum Campsite am Lake Ōkareka ist kurz. Bei der Sonnenuntergangszeit um 17:21 reicht es für einen letzten Spaziergang am Wasser. Morgen beginnt die lange Fahrt nach Coromandel, daher rechtzeitig Tank und Wasser prüfen. Die Wai-O-Tapu-Wege sind flach und gut zu gehen. Ein früher Start lohnt sich wegen des Geysirs. Der Nachmittag bleibt für Wäsche und Dump, damit der Camper für Coromandel bereit ist.
