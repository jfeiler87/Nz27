53:
  "intro": "Küstenstraße über Coromandel Town nach Thames. Der Plan nennt 85 km, realistisch ist es deutlich mehr."
  "text": |-
    Der Tag führt von Hahei in Richtung Westen nach Coromandel Town und dann an der Küste entlang nach Thames. Die im Plan genannten 85 km passen vermutlich nicht für die gesamte Route, rechnet daher mit mehr Fahrzeit. Die Straße SH25 an der Küste ist kurvig und sehr schön, das Wasser immer im Blick.

    In Coromandel Town ist die Driving Creek Railway der Höhepunkt des Tages, eine kleine Bergbahn durch den Wald. Der Ort selbst hat Cafés für die Mittagspause. Nördlich von Colville gilt für Britz ein Fahrverbot, das bleibt außen vor.

    In Thames erledigt ihr Dump und Einkauf, bevor ihr zum Kauaeranga Valley fahrt. Der Kahikatea DOC Campsite liegt im Tal und bietet eine ruhige Nacht. Wer Strom oder mehr Komfort möchte, wählt den Danby Field Freedom Camping Platz. Der Tag ist eine gute Mischung aus Fahrt und Entdecken. Die Küstenstraße SH25 ist eine der schönsten der Coromandel-Halbinsel. Sie ist kurvig und schmal, im Camper heißt das langsam fahren. Plant genug Zeit ein, auch für Fotostopps am Wasser.
