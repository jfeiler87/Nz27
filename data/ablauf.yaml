  - "zeit": "~17:00"
    "text": "Zurück zum Camp, Abendessen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 18:24, Neumond 07.04.: ab Albert Town oder Lake Hawea Sternenhimmel."
21:
  "intro": "Über den Haast Pass zur Küste: Blue Pools, Fantail Falls, Thunder Creek Falls und Nacht am Lake Paringa."
  "text": |-
    Der Haast Pass verbindet das Hochland mit der wilden Westküste. Die Strecke ist 186 km lang, reine 2:23 h, im Camper rund 2:50 h. In Wanaka muss der Tank voll sein, denn bis Haast gibt es keine Tankstelle. Der Weg führt durch Wald, entlang von Flüssen und über den Pass.

    Die Stopps sind kurz und lohnen sich: Blue Pools mit 1,5 km flachem Weg, Fantail Falls und Thunder Creek Falls mit je fünf Minuten. Hinter Haast erreicht ihr die Tasmansee; am Ship Creek führen zwei kurze Wege durch Dünen und urigen Kahikatea-Sumpfwald. Alles passt zu eurem Profil und ist ohne Wanderung machbar.

    Die Nacht verbringt ihr am Lake Paringa DOC Campsite, einem ruhigen Platz am See. Als Alternative gibt es Haast, Marks Road, dessen Standort laut Plan unsicher ist. Sonnenuntergang ist um 18:22. Sandfliegen sind an der Westküste üblich, Insektenschutz sollte griffbereit sein. Die Fahrt dauert mit Stopps einen ganzen Tag, aber ohne Eile. Nehmt euch Zeit für die Blue Pools und lasst die kurzen Wasserfälle nicht aus. Die Westküste ist regnerisch, Regenjacke und Insektenschutz sollten griffbereit sein.
  "schritte":
  - "zeit": "~08:45"
    "text": "In Wanaka volltanken und Proviant ergänzen, danach Abfahrt (reine Fahrzeit 2:23 h, im Camper rund 2:50 h)."
