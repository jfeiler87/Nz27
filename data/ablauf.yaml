57:
  "intro": "In den hohen Norden nach Karikari: weiße Strände und ein abgelegener DOC-Platz an der Maitai Bay."
  "text": |-
    Von Paihia aus geht es nach Norden, Richtung Karikari-Halbinsel. Die Fahrt dauert etwa zwei Stunden. Unterwegs liegt Kerikeri mit den Rainbow Falls, einem optionalen Fotostopp, und mit einem guten Platz für Einkauf und Tanken. Auf der Halbinsel selbst gibt es wenig Einkaufsmöglichkeiten.

    Die Karikari-Halbinsel ist bekannt für ihre weißen Strände. Der Maitai Bay DOC Campsite liegt in einer geschützten Bucht und bietet viel Ruhe. Am Nachmittag bleibt Zeit, die Strände zu erkunden und die Beine zu vertreten.

    Der Platz ist abgelegen, bringt also Wasser und Proviant mit. Der Sonnenuntergang um 17:33 kommt früh. Nutzt die verbleibende Tageszeit für Spaziergänge. Morgen geht es weiter nach Cape Reinga, dem nördlichen Ende der Reise. Kerikeri ist der letzte größere Ort vor der Halbinsel, nutzt ihn zum Auffüllen. Karikari ist abgelegen, die Straßen sind ruhiger. Strand und Wasser laden zu langen Spaziergängen ein. Wer mag, nimmt Badesachen und Handtuch für den Strand mit. Der Platz ist einfach, ruhig und weit von der Stadt entfernt.
