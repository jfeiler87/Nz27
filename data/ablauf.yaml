27:
  "intro": "Pufferfenster an der West Coast: Cape Foulwind mit Robbenkolonie, bei Regen Pancake Rocks nachholen."
  "text": |-
    Heute ist ein kurzer Tag an der West Coast. Er dient als Puffer: Hat es gestern geregnet, holt ihr Pancake Rocks und Truman Track nach. Sonst fahrt ihr die 58 km nach Westport in knapp einer Stunde im Camper.

    Die Cape Foulwind Walkway führt zur Robbenkolonie bei Tauranga Bay. Der Weg ist kurz und gut machbar, die Robben sind direkt am Meer zu sehen. In Westport kauft ihr ein und tankt, denn nach dem Buller Gorge gibt es weniger Möglichkeiten.

    Die Nacht verbringt ihr am Carters Beach. Der Freiplatz ist laut Plan nicht bestätigt, prüft Schild und Plakette. Alternativ gibt es den Seal Colony TOP 10 Holiday Park. Sonnenuntergang ist um 18:05. Der Tag lässt Raum zum Entspannen. Die Strecke ist kurz, deshalb ist der Tag flexibel. Wer gestern Regen hatte, holt das Verpasste nach, sonst genießt er die Küste ohne Programmdruck. Seerobben und Meer sind hier nah, bringt ein Fernglas mit, falls vorhanden.
  "schritte":
