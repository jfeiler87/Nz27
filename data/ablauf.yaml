35:
  "intro": "Whale Watch in Kaikōura, wetterabhängig, dazu Peninsula Walkway und Robben."
  "text": |-
    Heute steht die Whale Watch an, eine Tour von rund 3,5 Stunden zu den Pottwalen. Sie ist wetterabhängig, deshalb ist der morgige Tag als Ausweichtermin eingeplant. Prüft früh das Wetter und die Tourbestätigung. Die Abfahrt ist an der Whaleway Station, die Zeit richtet sich nach der Buchung.

    Nach der Tour bleibt Zeit für Mittagessen in Kaikōura und den Peninsula Walkway mit Robben am Point Kean. Der Weg ist gut machbar und führt an der Küste entlang. Wer noch Energie hat, bummelt durch den Ort.

    Die Nacht verbringt ihr am Puhi Puhi DOC Campsite. Alternativ nutzt ihr den Kaikoura TOP 10 Holiday Park für Wäsche und Strom, sieben Nächte seit Fox. Sonnenuntergang ist um 17:44. Der Tag ist ein Höhepunkt der Reise. Falls die Tour ausfällt, ist das kein Verlust. Der Ausweichtermin am Freitag fängt das auf. Warm anziehen: Auf dem Meer ist es kühl und windig, auch bei Sonne. Ein Reisetablett gegen Seekrankheit kann sinnvoll sein.
  "schritte":
