51:
  "intro": "Langer Fahrtag nach Hahei auf der Coromandel-Halbinsel, mit Mount Maunganui als Beinevertreten."
  "text": |-
    Von den heißen Quellen Rotoruas geht es an die Ostküste und dann auf die Coromandel-Halbinsel. Heute sitzt ihr rund vier Stunden im Camper, deshalb lohnt es sich, den Tag bewusst zu gliedern. Der Mount Maunganui bietet mit seinem flachen Base Track von 3,5 km eine schöne Gelegenheit, Beine zu vertreten und frische Luft zu atmen.

    Am Nachmittag erreicht ihr Hahei. Freedom Camping ist dort verboten, der Campingplatz Hahei Beach Resort liegt direkt am Strand. Das ist praktisch, weil morgen die Gezeiten über den Ablauf entscheiden: Hot Water Beach funktioniert nur um Ebbe, Cathedral Cove hängt vom Wegstatus ab.

    Schaut am Abend in die Gezeitentabelle, bevor ihr den nächsten Tag plant. Der Sonnenuntergang um 17:24 kommt früh, also nutzt das Licht für einen Spaziergang am Strand. Der Tag ist anstrengend, aber das Ziel ist einer der schönsten Plätze der Reise. Die Fahrt ist lang, deshalb teilt sie in zwei Hälften. Der Halt am Mount Maunganui bringt Bewegung und frische Luft. In Hahei angekommen, lohnt es, nichts mehr zu planen außer dem Blick auf die Gezeiten.
