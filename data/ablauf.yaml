44:
  "intro": "Napier nach Taupō über das Landesinnere, am Nachmittag Huka Falls und der heiße Bach im Spa Park."
  "text": |-
    Die Fahrt von Napier nach Taupō führt ins Landesinnere und dauert rund zweieinhalb Stunden. Die Küstenebene weicht bewaldeten Hügeln, bis sich irgendwann der große See öffnet. Mit der Mittagspause in Taupō bleibt genug Zeit für den Nachmittag, denn heute stehen nur zwei Stopps auf dem Programm.

    Die Huka Falls liegen am Waikato River, nahe dem Platz. Das Wasser rauscht kräftig durch eine enge Schlucht. Danach geht es zum Spa Thermal Park: Dort mündet ein warmer Bach in den Fluss, und man kann kostenlos darin baden. Badesachen und ein Handtuch gehören in den Rucksack.

    Der Freiplatz Hipapatua (Reid's Farm) liegt in der Nähe der Sehenswürdigkeiten. Schaut vor Ort nach Schild und Regeln. Als Alternative steht der Taupo TOP 10 Holiday Park bereit. Morgen ist ein ganzer Tag in Taupō, der Abend heute darf ruhig sein. Der Weg nach Taupō führt durch das Hochland der Nordinsel. Der große See ist das Zentrum der Region, sein Ufer bietet viele Aussichten. Nehmt Badesachen für den heißen Bach mit.
  "schritte":
  - "zeit": "~09:30"
    "text": "Abfahrt in Napier (reine Fahrzeit 2:05 h, im Camper rund 2:30 h)."
  - "zeit": "~11:00"
    "text": "Kaffeepause unterwegs, die Straße führt durch bewaldetes Hügelland."
  - "zeit": "~12:30"
    "text": "Ankunft in Taupō, Mittagessen und Einkauf."
  - "zeit": "~14:00"
    "text": "Huka Falls, kurzer Weg vom Parkplatz."
