55:
  "intro": "Von Te Ārai in die Bay of Islands: Whangārei Falls und Waitangi Treaty Grounds."
  "text": |-
    Die Fahrt von Te Ārai in die Bay of Islands führt durch Northland und dauert knapp drei Stunden im Camper. Der erste Stopp ist Whangārei mit den Whangārei Falls, einem schönen Wasserfall, der sich mit einem kurzen Spaziergang erreichen lässt. Danach bietet die Stadt ein gutes Mittagessen und Einkaufsmöglichkeiten.

    Am Nachmittag erreicht ihr die Bay of Islands. Die Waitangi Treaty Grounds sind ein historischer Ort, an dem der Vertrag von Waitangi unterzeichnet wurde. Prüft die Öffnungszeiten vorher, damit ihr genug Zeit habt.

    Übernachtet wird im Seaview Camper Van Park in Paihia, einem einfachen Camper-Park. Freedom Camping ist im Ort verboten. Als Alternativen gibt es den Paihia TOP 10 Holiday Park und den Russell TOP 10 Holiday Park. Der Sonnenuntergang um 17:31 lässt noch Zeit für einen Spaziergang am Wasser. Northland ist grün und hügelig, mit Blick auf Buchten. Die Waitangi Treaty Grounds sind ein historischer Ort, der Zeit verdient. Am Abend könnt ihr am Wasser in Paihia ausruhen.
