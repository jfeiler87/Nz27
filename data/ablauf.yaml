28:
  "intro": "Durch den Buller Gorge nach St Arnaud an den Lake Rotoiti."
  "text": |-
    Heute verlasst ihr die West Coast und fahrt durch den Buller Gorge ins Landesinnere. Die Strecke ist 160 km lang, reine 2:14 h, im Camper rund 2:40 h. Der Fluss begleitet euch lange, die Täler werden enger und waldiger.

    An der Buller Gorge Swingbridge könnt ihr optional anhalten: eine Hängebrücke über den Fluss. Mittags gibt es eine Pause unterwegs. Am Nachmittag erreicht ihr St Arnaud und den Kerr Bay DOC Campsite am Lake Rotoiti. Die Schulferien haben begonnen, der Platz sollte gebucht sein.

    Am Steg am Kerr Bay und auf dem Honeydew Walk, einem kurzen Weg im Wald, genießt ihr die Ruhe. Sonnenuntergang ist um 17:59. Tankt und kauft in Westport ein, denn St Arnaud hat wenig. Die Fahrt durch den Buller Gorge ist kurvig, aber landschaftlich reizvoll. Mit dem Wechsel von der Küste ins Gebirge ändert sich auch das Wetter. In den Schulferien sind Plätze knapp, deshalb ist die Vorbuchung am Lake Rotoiti wichtig.
