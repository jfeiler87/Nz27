    "text": "Spa Thermal Park: freier heißer Bach (Otumuheke) zum Baden."
  - "zeit": "~16:45"
    "text": "Zum Hipapatua / Reid's Farm Campsite, Schild prüfen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:28."
45:
  "intro": "Ein freier Tag am Lake Taupō mit Craters of the Moon, Bootsfahrt und Wäsche, bei klarer Sicht optional ein Rundflug."
  "text": |-
    Der zweite Tag in Taupō ist der entspannteste der Woche. Am Morgen werden die Alltagsaufgaben erledigt: Wäsche im Liquid Laundromat und Entleeren an der Dump Station am Marina, wo es auch Trinkwasser gibt. Danach wartet Craters of the Moon, ein Rundweg über dampfende Erde, den man in etwa 45 Minuten schafft.

    Am Nachmittag geht es auf den See. Die Bootsfahrt führt zu den Mine-Bay-Felsschnitzereien, die nur vom Wasser aus gut zu sehen sind. Wer Glück mit dem Wetter hat, kann zusätzlich einen Rundflug mit dem Wasserflugzeug buchen: Bei klarer Sicht sieht man Tongariro, Ngauruhoe und Ruapehu aus der Luft. Das ist optional und hängt von den Wolken ab.

    Der Abend gehört dem Camper am See. Ab dem 02.05. rückt der Neumond näher, der Himmel wird dunkler. Mit etwas Glück gibt es klare Sterne, ein guter Abschluss vor der Weiterfahrt in den Nationalpark. Sonntage in Taupō sind ruhig, die Läden haben meist offen. Der Rundflug ist nur bei klarer Sicht sinnvoll, entscheidet deshalb morgens nach dem Wetterbericht. Alles andere läuft ohne Zeitdruck.
  "schritte":
  - "zeit": "~08:30"
    "text": "Ausschlafen, Frühstück. Wetter prüfen für den Rundflug."
  - "zeit": "~09:30"
    "text": "Wäsche im Liquid Laundromat Taupō, Dump Station am Marina (mit Trinkwasser)."
  - "zeit": "~10:30"
    "text": "Craters of the Moon, rund 45 Minuten Rundweg über dampfende Erde."
  - "zeit": "~12:30"
    "text": "Mittagessen am Hafen."
