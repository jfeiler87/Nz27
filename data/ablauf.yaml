  - "zeit": "abends"
    "text": "Sonnenuntergang 17:56."
31:
  "intro": "Über den Takaka Hill in die Golden Bay: Te Waikoropupū Springs mit dem klarsten Quellwasser."
  "text": |-
    Von Marahau führt die Straße über den Takaka Hill in die Golden Bay, 84 km und gut 1:25 h im Camper. Oben bietet Hawkes Lookout eine optionale Aussicht. Die Straße ist kurvig, die Landschaft ändert sich von Küste zu Hügeln.

    In Takaka gibt es Mittagessen und Einkauf für Collingwood. Die Te Waikoropupū Springs sind das Highlight: Das klarste Quellwasser, ein 45-minütiger Weg. Wainui Falls sind optional, rund 1,5 Stunden Waldweg, aber etwas ab vom Weg.

    Die Nacht verbringt ihr im Collingwood Camping Ground, einem Gemeinde-Campingplatz nahe Farewell Spit und Wharariki. Als Alternative gibt es den Pōhara Beach Top 10 Holiday Park. Sonnenuntergang ist um 17:56. Der Tag bleibt entspannt. Die Golden Bay ist abgelegen und ruhig, die Straßen sind frei. Nach dem Takaka Hill fühlt sich die Landschaft anders an: weite Buchten, Hügel und kleine Orte. Kauft in Takaka ein, denn Collingwood ist klein. Die Fahrt selbst ist kurz, die Stopps machen den Tag.
