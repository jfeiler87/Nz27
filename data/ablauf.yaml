    "text": "Zum Roys Bay Parkplatz und That Wanaka Tree. Sonnenuntergang ist 18:26."
  - "zeit": "abends"
    "text": "Zurück zum Campground. Alternative: Wanaka Holiday Park."
20:
  "intro": "Wanaka-Tag mit Mt Iron, Lake Hawea und Neumond-Sternenhimmel."
  "text": |-
    Heute gibt es keine Fahrtstrecke, der Tag gehört Wanaka. Der Mt Iron Track ist ein 4,5 km langer Rundweg mit rund 240 Höhenmetern und bietet Blick über beide Seen. Das Profil passt gut, der Weg ist ohne Eile machbar.

    Am Nachmittag lohnt der Lake Hawea Lookout und eine kurze Fahrt am See entlang. Dazu stehen die Wanaka Public Dump Station und der Einkauf an, denn morgen führt der Weg über den Haast Pass, und danach gibt es kaum noch Läden. Vergesst nicht, volltanken am nächsten Morgen einzuplanen.

    Am 07.04. ist Neumond, die Nacht ist deshalb besonders dunkel. Ab Albert Town oder am Lake Hawea könnt ihr den Sternenhimmel sehen, wenn die Wolken mitspielen. Sonnenuntergang ist um 18:24. Der Albert Town Campground bleibt eure Basis. Mit Mt Iron und Lake Hawea sind zwei einfache Ziele geplant, beide passen zu eurem Profil. Der Rest des Tages ist frei für Wäsche, Einkauf und Pausen am See. Tanken und Proviant für die Haast-Pass-Fahrt nicht vergessen.
  "schritte":
