61:
  "intro": "Letzter Tag: Camper bei Britz Māngere abgeben, optional ein Tag in Auckland, 20:30 Abflug."
  "text": |-
    Der letzte Tag ist entspannt, aber mit klaren Terminen. Vormittags gebt ihr den Camper bei Britz in Māngere zurück. Die Station ist von 08:00 bis 16:30 geöffnet, Tank voll und Kassette leer sind Pflicht. Danach ist das Fahrzeug erledigt und ihr seid ohne Gepäck-Sorgen unterwegs.

    Mit der Gepäckaufbewahrung am Flughafen bleibt der Tag frei. Wer mag, besucht Auckland: Der Maungawhau / Mount Eden gibt einen Überblick über die Stadt, am Viaduct Harbour lässt sich gut zu Mittag essen, und optional gibt es eine Fähre nach Devonport. Plant genug Zeit ein, um bis etwa 17:30 wieder am Flughafen zu sein.

    Der Flug EK 449 geht um 20:30 nach Dubai, von dort weiter mit EK 55 nach Düsseldorf. Der Sonnenuntergang ist um 17:20, ihr verlasst Neuseeland also mit der Abenddämmerung. Nach 61 Tagen sind das letzte Stunden einer langen Reise. Behaltet die Uhr im Blick: Rückgabe, Stadtbesuch und Flughafen müssen zeitlich passen. Kleines Gepäck für den Stadtbesuch genügt. Ein entspannter Abschluss ist wichtiger als jede Sehenswürdigkeit.
