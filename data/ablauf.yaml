59:
  "intro": "Lange Etappe von Cape Reinga nach Süden bis Waipoua, mit Tāne Mahuta am späten Nachmittag."
  "text": |-
    Heute ist eine lange Etappe angesagt. Von Cape Reinga führt der Weg nach Süden, rechnerisch fast vier Stunden, im Camper eher knapp fünf. Plant Pausen ein und startet früh. In Kaitaia lohnt sich ein Einkauf, denn am Ziel gibt es wenig.

    Die Route verläuft über das Hokianga, bei Bedarf mit der Kohukohu-Fähre. Prüft vorher den Fahrplan, damit keine Wartezeiten entstehen. Am Nachmittag erreicht ihr den Waipoua-Wald, wo Tāne Mahuta steht, der größte Kauri. Der Weg vom Parkplatz ist kurz, der Baum beeindruckend.

    Zum Abschluss geht es zum Trounson Kauri Park DOC Campground. Der Platz liegt im Kauri-Wald, und nachts sind Kiwi-Rufe zu hören. Das ist ein besonderes Erlebnis, wenn es ruhig bleibt. Alternativ gibt es den Kai Iwi Lakes Campground. Der Tag ist anstrengend, aber der Wald belohnt. Der Tag ist anspruchsvoll und braucht Disziplin bei den Pausen. Dafür ist das Ziel ein Höhepunkt: uralte Kauri-Bäume im Dunkel des Waldes. Wer Kiwi-Rufe hören will, bleibt abends ruhig und lauscht.
