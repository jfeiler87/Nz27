    "text": "Wetter und Tourstatus prüfen, Anruf beim Anbieter falls nötig."
  - "zeit": "~08:30"
    "text": "Fahrt zur Whaleway Station (Check-in vor der Abfahrt). Abfahrtszeit laut Buchung."
  - "zeit": "~09:00"
    "text": "Whale Watch, ca. 3,5 Stunden, Pottwale. Bei schlechtem Wetter fällt die Tour aus, dann morgen."
  - "zeit": "~13:00"
    "text": "Mittagessen in Kaikōura."
  - "zeit": "~14:30"
    "text": "Peninsula Walkway und Robben am Point Kean."
  - "zeit": "~16:30"
    "text": "Wäsche und Strom im Kaikoura TOP 10 (sieben Nächte seit Fox) oder zurück zum Puhi Puhi."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:44."
36:
  "intro": "Puffertag in Kaikōura: Whale Watch nachholen oder Delfin- und Albatros-Tour und Crayfish."
  "text": |-
    Heute ist der Pufferplan für Kaikōura. Hat die Whale Watch gestern geklappt, wird der Tag frei. Ist sie ausgefallen, wird sie heute nachgeholt. Alternativ gibt es eine Delfin- oder Albatros-Tour.

    Der Rest des Tages gehört dem Meer. Ein Mittagessen mit Crayfish gehört zu Kaikōura, dazu ein Spaziergang am Strand und Robben an der Küste. Die Landschaft zwischen Bergen und Pazifik ist ein schöner Abschluss der Südinsel.

    Am Nachmittag kauft ihr ein und tankt für morgen. Morgen ist Fahrtag nach Picton, danach folgt ANZAC Day. Die Nacht verbringt ihr am Puhi Puhi DOC Campsite. Sonnenuntergang ist um 17:42. Früh essen und früh schlafen. Je nach Wetter und Stimmung ist der Tag voll oder ganz frei. Kaikōura ist ein Ort, an dem Meer und Berge dicht beieinander liegen. Ein Spaziergang am Wasser, gutes Essen und ein früher Abend passen zum Profil. Morgen ist die Fahrt nach Picton, ANZAC Day folgt. Prüft vorher kurz die Öffnungszeiten der Lokale.
  "schritte":
  - "zeit": "~08:00"
    "text": "Wetter prüfen. Gestern gefahren: Variante A. Gestern ausgefallen: Variante B."
  - "zeit": "~08:30"
    "text": "Variante B: Whale Watch nachholen (Zeit laut Umbuchung). Variante A: Delfin- oder Albatros-Tour, falls Lust."
  - "zeit": "~12:30"
    "text": "Mittagessen mit Crayfish am Meer."
  - "zeit": "~14:30"
    "text": "Spaziergang, Robben, Ruhe am Strand."
  - "zeit": "~16:30"
    "text": "Einkauf und Tanken für morgen. Morgen Fahrtag nach Picton, danach ANZAC Day."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:42. Früh essen, morgen früh abfahren."
37:
  "intro": "Letzter Südinsel-Tag: Einkauf und Versorgung vor ANZAC Day, Fahrt nach Picton."
  "text": |-
    Heute fahrt ihr von Kaikōura über Blenheim nach Picton, 163 km und gut drei Stunden im Camper. Der Tag ist wegen des morgigen ANZAC Day wichtig: Läden bleiben bis 13 Uhr zu. Deshalb kauft ihr heute ein, tankt und leert Toilette und Grauwasser.

    In Blenheim ist ein optionaler Weingut-Mittag bei Allan Scott möglich, der Fahrer trinkt natürlich nicht. In Picton erledigt ihr Tanken bei Z in der High St und die Dump Station an der Wairau Rd. Die Queen Charlotte Drive ist kurvig, mit Aussicht auf die Sounds, optional mit dem Cullen Point Lookout.

    Die Nacht verbringt ihr am Momorangi Bay DOC Campsite, rund 15 Minuten bis zur Fähre. Alternativ gibt es den Picton Holiday Park für Wäsche. Sonnenuntergang ist um 17:41. Macht den Camper reisefertig, morgen geht die Fähre. Der Tag ist mit Fahrt und Erledigungen gut gefüllt, aber nicht überladen. Die Reihenfolge zählt: erst Einkauf, dann Tanken, dann Dump. Danach bleibt der Abend am Momorangi Bay für Ruhe und Packen.
  "schritte":
  - "zeit": "~08:45"
    "text": "Abfahrt in Kaikōura (reine Fahrzeit 2:33 h, im Camper gut 3 Stunden)."
  - "zeit": "~11:30"
    "text": "Ankunft in Blenheim, Einkauf für Sonntag und Montag."
  - "zeit": "~12:30"
    "text": "Optional Weingut-Mittag bei Allan Scott (Cellar Door und Bistro). Fahrer trinkt nicht."
  - "zeit": "~14:30"
    "text": "Picton: Tanken (Z, High St) und Dump Station (Wairau Rd). Wäsche im Holiday Park, falls Zeit."
  - "zeit": "~15:30"
    "text": "Optional Cullen Point Lookout an der Queen Charlotte Drive, kurvig und Aussicht."
  - "zeit": "~16:30"
    "text": "Einchecken im Momorangi Bay DOC Campsite, ca. 15 Minuten bis zur Fähre."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:41. Camper reisefertig machen."
38:
  "intro": "Fährtag: Bluebridge von Picton nach Wellington, Check-in bis 12:00."
  "text": |-
    Heute überquert ihr die Cook Strait. Die Bluebridge-Fähre fährt um 13:00, Check-in ist bis 12:00 am Terminal in Picton. Vorher dreht ihr das Gas ab, das ist Vorschrift an Bord. Es ist ANZAC Day, Läden sind bis 13 Uhr zu, kauft also besser am Vortag.

    Vom Momorangi Bay Campsite fahrt ihr nach Picton, mit Puffer für den Check-in. Die Überfahrt dauert rund 3,5 Stunden, durch die Marlborough Sounds. Ankunft in Wellington ist gegen 16:30.

    Die Nacht verbringt ihr am Evans Bay Marina Freedom Camping, laut Plan nicht bestätigt. Sonst nutzt ihr den Wellington TOP 10 Holiday Park. Sonnenuntergang ist um 17:36, also seid ihr knapp vor der Dämmerung dort. Optional gibt es abends den Mt Victoria Lookout. Kommt mit Zeitpuffer zum Terminal und haltet Papiere bereit. Auf der Überfahrt habt ihr Zeit zum Ausruhen. Nach der Ankunft in Wellington ist es nur ein kurzes Stück zum Platz am Evans Bay.
  "schritte":
  - "zeit": "~08:30"
    "text": "Frühstück am Momorangi Bay, Camper aufräumen. Gas abdrehen, das ist Pflicht an Bord."
  - "zeit": "~09:30"
    "text": "Fahrt nach Picton, Café, letzte Einkäufe. ANZAC Day: Läden bis 13 Uhr zu."
  - "zeit": "~11:00"
    "text": "Zum Bluebridge Terminal, Check-in, Zeitpuffer einplanen (Check-in bis 12:00)."
  - "zeit": "~13:00"
    "text": "Abfahrt der Fähre, ca. 3,5 Stunden. Auf dem Deck die Marlborough Sounds sehen."
  - "zeit": "~16:30"
    "text": "Ankunft in Wellington."
  - "zeit": "~17:15"
    "text": "Zum Evans Bay Marina Freedom Camping, Schild und SC-Plakette prüfen. Falls nicht erlaubt: Wellington TOP 10 Hutt Park."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:36. Optional Mt Victoria Lookout bei Nacht."
39:
  "intro": "Ein ganzer Tag Wellington: Te Papa, Cable Car, Botanischer Garten und Weta Cave."
  "text": |-
    Der Tag in Wellington ist ein Stadttag, ohne Fahrtstrecke. Der 26.04. ist ANZAC-Ersatzfeiertag, die Museen sind trotzdem offen. Ihr startet mit Dump Station am Evans Bay (kostenlos) und Wäsche in der Janice Laundry in Newtown.

    Te Papa ist das Highlight: Das Nationalmuseum hat freien Eintritt, euer Camper kann am Barnett Street Car Park stehen. Danach gibt es Mittagessen in der Stadt. Am Nachmittag fahrt ihr mit dem Cable Car ab Lambton Quay hinauf zum Botanischen Garten.

    Zum Schluss ist Weta Cave in Miramar möglich, die Öffnungszeiten prüft ihr vorher. Die Nacht verbringt ihr wieder am Evans Bay Marina. Sonnenuntergang ist um 17:35. Der Tag hat viele Optionen, wählt nach Laune. Wellington ist kompakt, vieles liegt nah beieinander. Plant die Reihenfolge so, dass der Camper möglichst wenig bewegt werden muss. Te Papa allein kann einen halben Tag füllen, der Rest ist optional. Zwischen den Zielen sind Wege kurz, lasst euch Zeit für Pausen.
  "schritte":
  - "zeit": "~08:30"
    "text": "Frühstück, danach Dump Station Evans Bay (kostenlos)."
  - "zeit": "~09:30"
    "text": "Wäsche in der Janice Laundry Newtown abgeben oder starten."
  - "zeit": "~10:30"
    "text": "Te Papa, Eintritt frei, Camper am Barnett Street Car Park."
  - "zeit": "~13:00"
    "text": "Mittagessen in der Stadt."
  - "zeit": "~14:00"
    "text": "Cable Car ab Lambton Quay und Botanischer Garten."
  - "zeit": "~16:00"
    "text": "Weta Cave in Miramar, Öffnungszeiten vorher prüfen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:35, Rückfahrt zum Evans Bay Marina."
40:
  "intro": "Raue Küste im Süden der Nordinsel: Pūtangirua Pinnacles und Cape Palliser."
  "text": |-
    Heute verlasst ihr Wellington und fahrt an die wilde Küste der Wairarapa. Die Strecke ist 130 km lang, rund zwei Stunden im Camper. Kaitoke (Bruchtal) ist ein optionaler Umweg über die SH2, den ihr nur bei früher Abfahrt nehmt.

    Die Pūtangirua Pinnacles erreicht ihr durch ein Flussbett, 1,5 bis 3 Stunden. Die Felsnadeln sind eine der Kulissen aus Der Herr der Ringe. Danach geht es zum Cape Palliser mit Robbenkolonie an der Straße und einem Leuchtturm mit 250 Stufen.

    Die Nacht verbringt ihr am Pūtangirua Pinnacles DOC Campsite. Sonnenuntergang ist um 17:32, also plant die Zeit gut. Im Gebiet gibt es kaum Läden, kauft vorher ein. Die Tage werden kürzer, achtet auf das Licht. Am Pūtangirua Pinnacles Campsite startet auch der Weg zu den Felsnadeln, ihr schlaft also direkt am Ziel. Das ist praktisch für den Morgen. Beachtet die Tageslichtzeit, denn die Sonne geht um 17:32 unter. Nehmt Wasser und feste Schuhe für das Flussbett mit.
  "schritte":
  - "zeit": "~08:45"
    "text": "Abfahrt in Wellington (reine Fahrzeit 1:50 h, im Camper gut 2 Stunden)."
  - "zeit": "~09:30"
    "text": "Optional Kaitoke Regional Park (Rivendell), kleiner Umweg über SH2. Bei späterer Abfahrt streichen."
  - "zeit": "~11:30"
    "text": "Mittagspause unterwegs, Einkauf vor der Küstenstraße."
  - "zeit": "~12:30"
    "text": "Pūtangirua Pinnacles: 1,5 bis 3 Stunden im Flussbett."
  - "zeit": "~15:30"
    "text": "Cape Palliser: Robbenkolonie an der Straße und Leuchtturm mit 250 Stufen."
  - "zeit": "~16:45"
    "text": "Zurück zum Pūtangirua Pinnacles DOC Campsite."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:32."
41:
  "intro": "Von der Wildküste ins Weinland und weiter an die Ostküste nach Castlepoint. Ein entspannter Fahrtag mit Mittag in Martinborough."
  "text": |-
    Der Tag beginnt an der rauen Südküste der Wairarapa und führt Schritt für Schritt in sanftere Landschaft. Vom Pūtangirua Pinnacles Campsite geht es zurück ins Landesinnere nach Martinborough, einem kleinen Weinort mit Platz, Cafés und Ruhe. Dort lohnt sich eine lange Mittagspause, denn die Strecke danach ist leicht und führt durch offenes Farmland nach Osten.

    Die Fahrt dauert rechnerisch gut zwei Stunden, im Camper eher zweieinhalb. Wer unterwegs einkaufen will, tut das auf dem Weg, denn Castlepoint ist ein kleiner Ort am Meer. Gegen Nachmittag taucht der Leuchtturm auf dem Riff auf, das Wahrzeichen der Gegend. Daneben liegen Deliverance Cove und der Castle Rock, die man zu Fuß erkunden kann.

    Der Platz ist ein Freedom-Camping-Gelände nur für Self-Contained-Fahrzeuge. Prüft vor Ort Schild und grüne Plakette. Bei klarem Himmel ist der Sonnenuntergang um 17:27 über dem Riff ein schöner Abschluss. Die Fahrt am nächsten Tag nach Napier ist lang, deshalb früh schlafen.
  "schritte":
