58:
  "intro": "Zum nördlichsten Punkt: Te Paki Sanddünen und das Cape Reinga, wo Tasman Sea und Pazifik aufeinandertreffen."
  "text": |-
    Der Tag führt zum nördlichen Ende der Reise. Die Fahrt von Karikari nach Cape Reinga dauert im Camper rund drei Stunden, durch eine immer einsamere Landschaft. Die Te Paki Sanddünen sind der erste Stopp. Dort gibt es einen Sandboarding-Verleih vor Ort. Der Ninety Mile Beach ist für Britz verboten, ihr schaut ihn nur von den Dünen aus an.

    Weiter geht es zum Cape Reinga Leuchtturm. Hier treffen Tasman Sea und Pazifik aufeinander, ein besonderer Ort. Plant genug Zeit für den Weg zum Leuchtturm und für Fotos ein.

    Die Nacht verbringt ihr am Tapotupotu DOC Campsite. Auch hier gilt: Nehmt Wasser und Proviant mit. Der Sonnenuntergang um 17:35 gibt noch Licht für die Ankunft. Morgen steht die längste Fahrt der Nordinsel an, deshalb heute früh zur Ruhe kommen. Die Straße nach Norden wird einsamer, Landschaft und Wetter wechseln. Cape Reinga hat eine besondere Stimmung, mit Wind und Weite. Zieht warme Kleidung an, auch wenn die Sonne scheint, und vergesst die Kamera nicht.
  "schritte":
