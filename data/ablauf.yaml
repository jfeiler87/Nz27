26:
  "intro": "Pancake Rocks und Blowholes zur Flut, danach der Truman Track und Nacht direkt am Strand."
  "text": |-
    Heute geht die Fahrt von Hokitika nach Punakaiki, 95 km und rund 1:40 h im Camper. Die Straße verläuft an der Küste, mit Meerblick und Regenwald. Es ist ein kurzer Tag mit viel Zeit für die Highlights.

    Die Pancake Rocks am Dolomite Point sind bei Flut am besten, dann spritzen die Blowholes. Die Gezeitentabelle bestimmt, ob ihr zuerst die Felsen oder den Truman Track lauft. Der Truman Track dauert 30 Minuten und führt durch Küstenwald zum Strand und Wasserfall.

    Die Nacht verbringt ihr im Punakaiki Beach Camp direkt am Strand. Als Alternative gibt es den McMillan Rd Self-Contained Campsite. Sonnenuntergang ist um 18:08. Nehmt euch Zeit für den Abend am Meer, die Wellen sind hier eindrucksvoll. Die Küstenstraße SH6 ist hier besonders schön, mit Meerblick. Zwischen den beiden Wegen am Dolomite Point und am Truman Track liegt nur eine kurze Fahrt. Danach bleibt der Abend entspannt am Strand. Gezeitentabelle vorher prüfen.
