56:
  "intro": "Ein ganzer Tag in der Bay of Islands: Hole in the Rock Bootstour und Fähre nach Russell."
  "text": |-
    Heute bleibt der Camper stehen, die Bay of Islands wird vom Wasser aus erkundet. Die Bootstour zum Hole in the Rock fährt von Paihia Wharf ab, mit etwas Glück zeigen sich Delfine. Die Abfahrtszeit richtet sich nach der Buchung, der Rest des Tages ist locker.

    Am Nachmittag setzt ihr mit der Personenfähre ab Paihia Wharf nach Russell über. Der Ort ist ruhig und eignet sich für einen Spaziergang und einen Kaffee. Die Fähre bringt euch am Ende zurück nach Paihia.

    Praktisches wie Wäsche erledigt ihr im Holiday Park, den Dump gibt es in Kawakawa. Das ist die nächste Station zu Paihia. Der Sonnenuntergang um 17:30 passt für einen ruhigen Abend im Camper Van Park. Morgen beginnt die Fahrt zur Halbinsel Karikari. Der Tag ist bewusst frei von Fahrt, sodass ihr Zeit auf dem Wasser habt. Bei schlechtem Wetter fallen Bootstouren aus, dann bleibt Zeit für den Ort. Russell ist von Paihia aus leicht erreichbar.
