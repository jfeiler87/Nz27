    "text": "Ausgiebiges Frühstück am Albert Town Campground."
  - "zeit": "~10:00"
    "text": "Mt Iron Track, 4,5 km Rundweg, rund 240 Hm, Blick über beide Seen."
  - "zeit": "~12:30"
    "text": "Mittagessen in Wanaka, Spaziergang am See."
