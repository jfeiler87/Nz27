1:
  "intro": "Ankommen statt Programm: Camper übernehmen, einkaufen, früh schlafen."
  "text": |-
    Der erste Tag bleibt bewusst klein. Nach dem langen Flug ist nichts weiter geplant, als den Camper zu übernehmen und sich in Christchurch einzurichten. Vom Hotel Lylo am Flughafen sind es nur wenige Minuten zum Britz-Depot in Harewood, das um 08:00 öffnet. Der Hotel-Check-out ist bis 10:00 möglich, es besteht also keine Eile.

    Bei der Übergabe lohnt es sich, in Ruhe nachzufragen: grüne SC-Plakette, Kettenregel, späteste Rückgabezeit, dazu Gas, Toilette und Wasser. Danach geht es zum Großeinkauf in den Supermarkt Northlands/Papanui, SIM oder eSIM werden aktiviert und die Offline-Karten geladen. Wer Kleidung waschen möchte, nutzt die Wäscherei, deren Standort laut Plan unsicher ist.

    Die Strecke ist mit 7 km und rund zehn Minuten reiner Fahrzeit minimal. Die erste Nacht verbringt ihr auf einem Holiday Park mit Strom, damit der Camper zur Ruhe kommt und ihr den Jetlag ausschlafen könnt. Sonnenuntergang ist um 19:45, den Abend lässt ihr einfach ausklingen. Morgen geht es zum ersten Mal wirklich los, in Richtung Akaroa.
  "schritte":
  - "zeit": "08:30"
    "text": "Ausschlafen und in Ruhe frühstücken, Gepäck packen. Das Britz-Depot öffnet zwar um 08:00, aber niemand muss als Erster dort sein."
  - "zeit": "09:45"
    "text": "Hotel-Check-out (spätestens 10:00) und die paar Minuten zum Britz-Depot Harewood fahren."
  - "zeit": "~10:00"
    "text": "Camper übernehmen: grüne SC-Plakette, Kettenregel und späteste Rückgabezeit erfragen, Gas, Toilette und Wasser erklären lassen. Eine gute Stunde einplanen."
  - "zeit": "~11:30"
    "text": "SIM/eSIM aktivieren und Offline-Karten laden, am besten bei einem Kaffee, bevor es losgeht."
  - "zeit": "~12:30"
    "text": "Mittagessen, dann Großeinkauf im Supermarkt Northlands/Papanui: Grundausstattung für die ersten Tage."
  - "zeit": "~14:30"
    "text": "Wer die Flugkleidung waschen will, nutzt die Wäscherei (Standort laut Plan unsicher, vorher kurz prüfen). Sonst direkt zum Holiday Park."
  - "zeit": "~15:30"
    "text": "Einchecken auf dem Christchurch TOP 10 Holiday Park, an den Strom, Betten machen, Camper einräumen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:45. Früh essen und früh schlafen, damit der Jetlag morgen nicht die Fahrt nach Akaroa trübt."
2:
  "intro": "Über die Port Hills zum Hafenstädtchen Akaroa, mit Delfin-Cruise als Tageshöhepunkt."
  "text": |-
    Von Christchurch führt die Straße über die Port Hills hinauf zum Hilltop Lookout. Von dort blickt man in den Krater des erloschenen Vulkans, in dem Akaroa Harbour liegt. Es ist ein schöner Auftakt für die Reise, und der Fotostopp lohnt sich. Die reine Fahrzeit von 1:29 h verlängert sich im Camper auf rund 1:45 h.

    In Akaroa selbst bestimmt die Delfin-Cruise den Rhythmus. Die Hafenrundfahrt mit Black Cat zeigt Hector-Delfine, die Saison dauert bis etwa April. Die Uhrzeit richtet sich nach der Buchung, die zwei bis vier Wochen vorher erfolgen sollte. Der Ort hat französische Wurzeln, mit Cafés, einem Leuchtturm und kleinen Straßen zum Bummeln.

    Übernachtet wird am Childrens Bay Freedom Camping, nur mit grüner SC-Plakette und nach Prüfung der Schilder vor Ort. Falls der Platz nicht passt, ist der Akaroa Top 10 Holiday Park die Alternative. Am Wochenende kann der Parkplatz im Ort knapp sein, plant also etwas Zeit zum Suchen ein.
  "schritte":
  - "zeit": "~09:00"
    "text": "Abfahrt in Christchurch. Reine Fahrzeit 1:29 h, im Camper realistisch rund 1:45 h."
  - "zeit": "~10:30"
    "text": "Fotostopp am Hilltop Lookout (Hilltop Tavern, Akaroa Rd) mit Blick über den Akaroa-Krater."
  - "zeit": "~11:15"
    "text": "Ankunft in Akaroa, Camper am Wharf oder in der Nähe abstellen. Wochenende: etwas Parkplatzsuche einplanen."
  - "zeit": "~12:00"
    "text": "Delfin-Cruise ab Akaroa Wharf (Black Cat). Die genaue Uhrzeit richtet sich nach der gebuchten Abfahrt, den Rest des Tages darum herum legen."
  - "zeit": "~14:00"
    "text": "Mittagessen in einem Café im französisch angehauchten Dörfchen."
  - "zeit": "~15:30"
    "text": "Bummel durch den Ort und zum Leuchtturm."
  - "zeit": "~17:00"
    "text": "Zum Freedom-Camping-Platz Childrens Bay, Schild und SC-Plakette prüfen. Ist er voll oder unklar: Akaroa Top 10 Holiday Park."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:42, Abendessen mit Blick auf die Bucht."
3:
  "intro": "Zurück durch Christchurch und auf der Inland Scenic Route 72 nach Peel Forest."
  "text": |-
    Heute geht es vom Meer ins Landesinnere. Von Akaroa fahrt ihr zurück durch Christchurch und folgt dann der Inland Scenic Route 72 über Mt Somers und Geraldine nach Süden. Die reine Fahrzeit beträgt knapp drei Stunden, im Camper sind es eher dreieinhalb. Der Tag ist ein Fahrtag mit ruhigen Pausen, die Landschaft wird allmählich weiter.

    Mount Sunday, die Kulisse von Edoras, bleibt eine Option. Die Zufahrt über die Hakatere-Potts Rd hat aber mehr als 12 km Schotter und ist nur mit schriftlicher Britz-Freigabe erlaubt. Ohne diese Freigabe lasst ihr den Abstecher aus. Mit Freigabe wird die Nacht am Lake Clearwater verbracht, rund 10 km Schotter, und nicht in Peel Forest.

    In Peel Forest wartet der DOC Campground mit kurzen Waldwegen ab Te Wanahu Flat. Ihr besucht die Big Tōtara und die Emily Falls, beides ohne großen Aufwand. Der Sonnenuntergang um 19:47 gibt genug Zeit. Morgen ist Vollmond, die Nacht wird hell.
  "schritte":
  - "zeit": "~08:45"
    "text": "Abfahrt in Akaroa, zurück durch Christchurch (reine Fahrzeit 2:58 h, im Camper rund 3:30 h bis Peel Forest)."
  - "zeit": "~10:30"
    "text": "Kurzer Stopp in Christchurch oder an der Strecke für Tanken und Nachkaufen. Sonntag, die Läden sind offen."
  - "zeit": "~11:30"
    "text": "Auf die Route 72 Richtung Mt Somers und Geraldine, Landschaft genießen, Picknick-Pause."
  - "zeit": "~12:30"
    "text": "Optional Mount Sunday: nur mit schriftlicher Britz-Freigabe. Dann geht die Nacht an den Lake Clearwater statt nach Peel Forest, der Schotter (~10 km) ist laut Plan knapp unter der 12-km-Grenze."
  - "zeit": "~14:30"
    "text": "Ankunft in Peel Forest, Platz auf dem DOC Campground sichern."
  - "zeit": "~15:30"
    "text": "Kurze Waldwege ab Te Wanahu Flat zur Big Tōtara und zu den Emily Falls."
  - "zeit": "~17:30"
    "text": "Kaffee und Ruhe am Camper, Abendessen kochen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:47, danach früh schlafen. Morgen ist Vollmond, die Nacht wird hell."
4:
  "intro": "Der türkise Lake Tekapo mit Kirche, Aussichtsberg und optional heißen Becken."
  "text": |-
    Von Peel Forest geht die Fahrt über Geraldine und Fairlie in Richtung Burkes Pass und hinauf ins Mackenzie-Becken. Mit 105 km und knapp zwei Stunden im Camper ist der Tag kurz. Das Licht ist die Hauptsache: Der See ist am schönsten bei tiefstehender Sonne, deshalb bleibt am Nachmittag Zeit.

    Die Church of the Good Shepherd steht am Ufer des türkisfarbenen Sees. Um die Mittagszeit sind oft Busse da, daher am besten kurz schauen und in Ruhe fotografieren. Danach führt die Mt John Summit Road zum Astro Café, von wo der Blick über das gesamte Becken reicht. Optional gibt es Tekapo Springs mit heißen Becken und Seeblick.

    Freedom Camping im Ort Tekapo ist verboten. Die Nacht verbringt ihr deshalb am Edwards Stream Overnight, ungefähr 6 km östlich, nur mit SC-Plakette. Alternativ steht der Lakes Edge Holiday Park direkt am See bereit. Am 22.03. ist Vollmond, Sterne gibt es erst in den späteren Nächten, etwa um den 7.4. in Wanaka und Haast.
  "schritte":
  - "zeit": "~09:30"
    "text": "Abfahrt in Peel Forest über Geraldine und Fairlie, reine Fahrzeit 1:27 h, im Camper gut 1:45 h."
  - "zeit": "~11:30"
    "text": "Ankunft in Tekapo. Church of the Good Shepherd: um die Mittagszeit sind Busse da, also kurz schauen und die Fotos in Ruhe machen."
  - "zeit": "~12:30"
    "text": "Mittagessen am See oder im Ort."
  - "zeit": "~14:00"
    "text": "Mt John Summit Road hinauf, Astro Café, Rundumblick über das Becken."
  - "zeit": "~16:00"
    "text": "Optional Tekapo Springs: heiße Becken mit Seeblick, schön bei Kälte und tiefer Sonne."
  - "zeit": "~17:30"
    "text": "Einkauf oder Wasser auffüllen, dann Fahrt zum Platz Edwards Stream Overnight, ca. 6 km östlich. SC-Plakette und Schild prüfen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:48, Vollmond steigt auf. Fällt der Platz aus: Lakes Edge Holiday Park direkt am See."
5:
  "intro": "Peters Lookout am Pukaki und der Hooker Valley Track unter Mt Cook."
  "text": |-
    Zwischen Tekapo und Aoraki/Mt Cook liegt eine der schönsten Strecken der Südinsel. Der erste Stopp ist Peters Lookout am Lake Pukaki, der klassische Fotopunkt über dem türkisfarbenen See. Bei klarem Wetter steht Mt Cook am Horizont. Die Fahrt dauert reine 1:31 h, im Camper knapp zwei Stunden.

    Am White Horse Hill Campsite checkt ihr ein, den Platz habt ihr für zwei Nächte vorab online gebucht. Am frühen Nachmittag geht ihr den Hooker Valley Track: 10 km hin und zurück, rund 100 Höhenmeter und etwa drei Stunden mit Fotopausen. Hängebrücken führen über den Fluss, am Ende liegt ein Gletschersee mit dem Berg vor euch.

    Packt Wasser, Proviant und Regenjacke ein, denn das Wetter im Hochgebirge wechselt schnell. Sonnenuntergang ist um 19:48. Wenn die Wolken weg sind, färbt sich der Berg zum Abend. Der Platz ist der ideale Ausgangspunkt für den Pufferplan von morgen. Praktisch gedacht: Der DOC Campsite ist online vorgebucht, es gibt also keinen Stress bei der Platzsuche. Kocht am Camper, genießt den Blick auf die Berge und legt euch rechtzeitig hin, denn der Puffertag morgen hängt vom Wetter ab.
  "schritte":
  - "zeit": "~09:00"
    "text": "Abfahrt in Tekapo (reine Fahrzeit 1:31 h)."
  - "zeit": "~09:45"
    "text": "Peters Lookout am Lake Pukaki, der klassische Fotostopp. Mt Cook am Horizont, wenn das Wetter mitspielt."
  - "zeit": "~11:00"
    "text": "Weiter am See entlang nach Mt Cook Village, Camper am DOC Campsite einchecken."
  - "zeit": "~12:00"
    "text": "Mittagessen am Camper, Proviant und Wasser für die Wanderung packen."
  - "zeit": "~13:00"
    "text": "Hooker Valley Track ab dem White Horse Hill Parkplatz, 10 km hin und zurück, rund 3 h inklusive Fotopausen."
  - "zeit": "~16:30"
    "text": "Zurück am Camper, Pause, Kaffee, Füße hoch."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:48. Wenn die Wolken weg sind, färbt sich Mt Cook zum Abend rosa."
6:
  "intro": "Pufferfenster am Mt Cook: Gletscherblick, Kea Point oder Skiflug, je nach Wetter."
  "text": |-
    Der zweite Tag am White Horse Hill ist ein Puffertag. Die Idee ist einfach: Hat gestern der Hooker Valley Track geklappt, ist heute entspannt angesagt. War das Wetter schlecht, holt ihr die Wanderung nach. Das erspart Stress und Entscheidungen im letzten Moment.

    Zur ruhigen Variante gehören der Tasman Glacier View und die Blue Lakes, beides mit kurzen Wegen und ein paar Treppen. Danach folgt der Kea Point, rund zwei Stunden Wanderung mit Blick auf Gletscher und Berg. Der Skiflug mit Gletscherlandung am Tasman Glacier ist optional, braucht klares Wetter und lässt sich spontan buchen.

    Der Abend bleibt ruhig am DOC Campsite. Der Sonnenuntergang um 19:46 kommt auf der Ostseite des Berges mit weichem Licht. Morgen steht die längste Fahrt der Südinsel an, deshalb früh essen und schlafen gehen. Tankstand und Vorräte vorher prüfen. Die Route des Tages ist kurz und bleibt im Tal rund um White Horse Hill. Das ist Absicht: Ein Puffertag soll Luft lassen, damit ihr nicht kaskadiert, sondern gelassen entscheidet. Fällt ein Highlight aus, wird nichts erzwungen.
  "schritte":
  - "zeit": "~09:00"
    "text": "Wetter prüfen und Plan wählen. Gestern gelaufen: Variante A. Gestern verregnet: Variante B."
  - "zeit": "~09:30"
    "text": "Variante A: Tasman Glacier View mit kurzen Treppen und Blick auf die Blue Lakes. Variante B: Hooker Valley Track nachholen, 10 km, ca. 3 h."
  - "zeit": "~11:30"
    "text": "Optional Skiflugzeug ab Mount Cook Airport, nur bei klarem Himmel, spontan buchbar. Bei Wolken lieber am Boden bleiben."
  - "zeit": "~13:00"
    "text": "Mittagessen am Camper."
  - "zeit": "~14:30"
    "text": "Variante A: Kea Point (ca. 2 h), Blick auf Mueller-Gletscher und Mt Cook. Variante B: Tasman Glacier View, wenn noch Lust und Sicht."
  - "zeit": "~17:00"
    "text": "Zurück am DOC Campsite, ausruhen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:46. Klare Nacht, früh schlafen, morgen wartet eine lange Fahrt."
7:
  "intro": "Langer Fahrtag durchs Waitaki-Tal nach Oamaru, mit Clay Cliffs, Elephant Rocks und Pinguinen am Abend."
  "text": |-
    Der Tag führt vom Hochgebirge ans Meer, rund 228 km und reine 3:13 h Fahrzeit, im Camper eher 3:50 h plus Stopps. Es ist der längste Fahrtag der Südinsel, der Weg durch das Waitaki-Tal ist aber abwechslungsreich. Das Tal wird nach unten hin weiter und trockener, mit kahlen Hügeln und Seen.

    Die Clay Cliffs bei Omarama sind ein kurzer Spaziergang an eine Landschaft aus erodierten Lehmwänden, mit Maut für die Zufahrt. Danach folgen die Elephant Rocks bei Duntroon, bekannt als Kulisse für Narnia. Kommt ihr am Nachmittag in Oamaru an, steht ein Großeinkauf für Ostern an, denn am Karfreitag und Ostersonntag bleiben die Läden zu. Tankt bei BP Oamaru.

    Abends kommen die Zwergpinguine der Blue Penguin Colony an Land, ganzjährig jeden Abend. Das Abendticket ist vorgebucht, die Zeit steht darauf. Danach fahrt ihr im Dunkeln nach All Day Bay. Wenn ihr zu müde seid, steht als Alternative der Oamaru TOP 10 Holiday Park bereit.
  "schritte":
  - "zeit": "~08:30"
    "text": "Abfahrt in Mt Cook. Reine Fahrzeit 3:13 h, im Camper rund 3:50 h plus Stopps."
  - "zeit": "~10:30"
    "text": "Clay Cliffs bei Omarama (kurzer Weg, Mautstraße)."
  - "zeit": "~12:00"
    "text": "Mittagspause unterwegs, Picknick oder Café."
  - "zeit": "~14:00"
    "text": "Elephant Rocks bei Duntroon, die Kulisse aus Narnia."
  - "zeit": "~15:30"
    "text": "Ankunft in Oamaru: Großeinkauf für die Ostertage und Tanken bei BP Oamaru, Thames St."
  - "zeit": "~17:00"
    "text": "Kleine Pause im Hafen, dann Abendessen."
  - "zeit": "~19:45"
    "text": "Blue Penguin Colony mit Abendticket. Eintrittszeit laut Ticket, die Pinguine kommen nach Sonnenuntergang (19:41) an Land."
  - "zeit": "nachts"
    "text": "Fahrt nach All Day Bay (Kakanui), Ankunft im Dunkeln. Schild und SC-Plakette prüfen, notfalls Holiday Park."
8:
  "intro": "Karfreitag an der Küste: Moeraki Boulders nach der Tide, Tunnel Beach und Ankunft auf der Otago Peninsula."
  "text": |-
    Am Karfreitag sind die Supermärkte geschlossen, Tankstellen aber offen. Der Einkauf von gestern macht sich jetzt bezahlt. Die Küstenstraße führt von All Day Bay südwärts, zuerst zu den Moeraki Boulders. Die runden Steine sind bei Ebbe am schönsten, die Gezeitentabelle bestimmt deshalb den Zeitpunkt.

    Ist die Ebbe am Vormittag, kommt ihr direkt hin. Liegt sie später, nehmt euch Zeit am Strand und kommt am Mittag. Weiter geht es Richtung Dunedin zum Tunnel Beach: 2 km Weg, der Rückweg ist steil mit rund 150 Höhenmetern. Plant ausreichend Zeit ein, auch wenn die Sonne erst um 19:40 untergeht.

    Zum Schluss fahrt ihr über die Otago Peninsula nach Portobello und checkt im Portobello Village Tourist Park ein. Freedom Camping ist hier sehr eingeschränkt, deshalb gibt es den Holiday Park. Die Dump Station in St Kilda (Standort laut Plan unsicher) liegt unterwegs, falls ihr sie braucht. Reine Fahrzeit insgesamt: 1:51 h. Die Fahrt folgt der SH1 entlang der Ostküste, mit Meer auf der einen und Weideland auf der anderen Seite. Am Karfreitag ist wenig Verkehr in den Orten, Cafés können aber geschlossen sein. Ein Picknick aus den Vorräten ist die sichere Lösung.
  "schritte":
  - "zeit": "~09:30"
    "text": "Ruhiger Start in All Day Bay, Frühstück am Strand. Gezeitentabelle für Moeraki Boulders prüfen."
  - "zeit": "~10:30"
    "text": "Moeraki Boulders je nach Ebbe/Flut (Gezeitentabelle prüfen). Ebbe am Vormittag: direkt hierher, Boulders liegen frei. Ebbe erst mittags/nachmittags: etwas später kommen und vorher in Ruhe am Strand verweilen."
  - "zeit": "~12:00"
    "text": "Mittagessen unterwegs (Karfreitag: vorher eingekauft oder Café). Weiter nach Süden Richtung Dunedin, reine Fahrzeit gesamt 1:51 h, im Camper plus ca. 20 %."
  - "zeit": "~14:30"
    "text": "Tunnel Beach: 2 km, steiler Rückweg mit rund 150 Hm. Genug Zeit einplanen, Sonnenuntergang ist 19:40."
  - "zeit": "~16:30"
    "text": "Optional Dump Station Dunedin (Dunedin Holiday Park, St Kilda), Standort unsicher, vor Ort prüfen. Tankstellen haben heute offen."
  - "zeit": "~17:30"
    "text": "Fahrt über die Otago Peninsula nach Portobello, Check-in im Portobello Village Tourist Park."
  - "zeit": "abends"
    "text": "Abendessen aus dem eigenen Vorrat, Karfreitag sind Läden zu."
9:
  "intro": "Ein Halbinseltag mit Seelöwen, Albatrossen und Pinguinen, dazu Wäsche in Dunedin."
  "text": |-
    Der zweite Tag auf der Otago Peninsula ist ein gemütlicher Tag ohne Fahrtstrecke. Am Morgen fahrt ihr zum Liquid Laundromat in Dunedin und gebt die Wäsche ab. Währenddessen gibt es Kaffee in der Nähe. Der Sonnenuntergang um 19:38 lässt dem Nachmittag viel Licht.

    Sandfly Bay ist das landschaftliche Highlight: Dünen und Seelöwen am Strand, der Abstieg ist steil, der Rückweg entsprechend anstrengend. Am Nachmittag wartet das Royal Albatross Centre am Taiaroa Head. Die Albatrosse haben rund 3 m Spannweite, und der März gilt als gute Zeit. Das Zentrum ist optional und hängt von der Buchung ab.

    Penguin Place mit Gelbaugenpinguinen ist ebenfalls optional und nur sinnvoll, wenn die Touren Ende März bestätigt sind. Prüft vorher telefonisch. Am Ende des Tages seid ihr zurück im Portobello Village Tourist Park. Der Tag hat keinen Druck, nehmt nur mit, worauf ihr Lust habt. Die Halbinsel hat schmale Straßen mit Meerblick, das Fahren ist ruhig, aber langsam. Seid ihr mit Albatros und Pinguinen fertig, bleibt noch Zeit für einen Spaziergang am Wasser in Portobello, bevor der Abend am Camper beginnt.
  "schritte":
  - "zeit": "~08:30"
    "text": "Fahrt zum Liquid Laundromat Dunedin (28 Prince Albert Rd), Wäsche einwerfen. Während des Waschens Frühstückscafé in der Nähe."
  - "zeit": "~10:30"
    "text": "Auf der Rückfahrt Sandfly Bay: Dünen und Seelöwen. Der Abstieg ist steil, Rückweg entsprechend. Sonnenuntergang ist 19:38, der Nachmittag bleibt hell."
  - "zeit": "~12:30"
    "text": "Mittagessen am Camper oder im Café Portobello."
  - "zeit": "~14:00"
    "text": "Optional Royal Albatross Centre am Taiaroa Head: Albatrosse mit rund 3 m Spannweite, gute Zeit im März. Abfahrtszeit nach Buchung."
  - "zeit": "~16:00"
    "text": "Optional Penguin Place (Gelbaugenpinguine), nur wenn Touren Ende März bestätigt sind."
  - "zeit": "~17:30"
    "text": "Zurück im Holiday Park, Wäsche verstauen, Zeit am Wasser."
  - "zeit": "abends"
    "text": "Zweite Nacht in Portobello. Kein Fahrtag mehr heute, einfach gemütlich kochen."
10:
  "intro": "Ostersonntag in die Catlins: Volltanken in Balclutha, Nugget Point und die Purakaunui Falls."
  "text": |-
    Der Ostersonntag bringt euch von der Otago Peninsula in die Catlins. Die reine Fahrzeit von 2:21 h wird im Camper zu rund drei Stunden. Läden sind teils zu, deshalb tankt ihr in Balclutha voll, bevor die einsame Küstenregion beginnt. Danach gibt es kaum noch Tankstellen.

    Der erste große Stopp ist Nugget Point mit dem Leuchtturm auf einem schmalen Felsgrat und Robben in der Tiefe. Der Weg vom Parkplatz ist kurz, die Aussicht beeindruckend. Danach folgen die Purakaunui Falls, ein Wasserfall in 20 Minuten Gehzeit, eingebettet in Wald.

    Der Purākaunui Bay DOC Campsite ist über Ostern schnell voll, also nicht zu spät eintreffen. Als Alternative steht die Papatowai Campsite bereit. Der Sonnenuntergang um 19:40 färbt die Bucht, und das Abendessen gelingt mit den Vorräten aus Oamaru. Morgen ist ein Tide-Tag, darum Gezeitentabelle bereithalten. Die Strecke führt von Dunedin zunächst über die SH1 nach Balclutha und dann in die Catlins, wo die Straßen schmaler und kurviger werden. Die Landschaft aus Wald, Weiden und Küste ist abwechslungsreich. Plant Pausen ein und fahrt nicht in Eile.
  "schritte":
  - "zeit": "~08:45"
    "text": "Abfahrt in Portobello. Reine Fahrzeit 2:21 h, im Camper rund 2:50 h."
  - "zeit": "~10:45"
    "text": "Volltanken in Balclutha (Z). Vor den Catlins gibt es kaum Tankstellen, Ostersonntag trotzdem Läden teils zu."
  - "zeit": "~11:45"
    "text": "Nugget Point: Leuchtturm auf dem Felsgrat, unten Robben. Kurzer Weg vom Parkplatz."
  - "zeit": "~13:00"
    "text": "Picknick am Camper oder in einer Bucht."
  - "zeit": "~14:45"
    "text": "Purakaunui Falls, 20 Minuten vom Parkplatz."
  - "zeit": "~15:30"
    "text": "Zum Purākaunui Bay DOC Campsite, Platz sichern. Ist er voll: Papatowai Campsite."
  - "zeit": "abends"
    "text": "Sonnenuntergang 19:40 an der Bucht. Abendessen aus den Ostervorräten."
11:
  "intro": "Ein Tag nach der Tide: McLean Falls, Cathedral Caves, Curio Bay und Slope Point."
  "text": |-
    Heute entscheidet die Tide über die Reihenfolge. Cathedral Caves sind nur bei Ebbe zugänglich und nur, wenn geöffnet; Saison und Gezeiten solltet ihr vorher prüfen. Auch der versteinerte Wald in Curio Bay ist bei Ebbe am besten sichtbar. Die Strecke ist mit 69 km kurz, ihr habt viel Zeit.

    Der Tag beginnt mit den McLean Falls, ein rund 40-minütiger Weg durch den Wald. Die Höhlen kommen dran, wenn Ebbe am Vormittag liegt, sonst zieht ihr Curio Bay vor. In der Porpoise Bay zeigen sich oft Hector-Delfine. Zum Abschluss ist Slope Point optional, 20 Minuten über Weideland zum südlichsten Punkt der Südinsel.

    Die Nacht verbringt ihr auf dem Curioscape Campground in Curio Bay. Der Sonnenuntergang um 19:40 lädt zu einem Strandspaziergang ein. Morgen steht eine längere Fahrt nach Te Anau an, Tank und Vorräte prüfen. Die Catlins sind ein Landstrich mit Wasserfällen, Wald und rauer Südküste. Zwischen den Stopps liegen nur kurze Strecken, es bleibt also Raum für Pausen. Wer in Porpoise Bay Delfine sieht, hat Glück, planen lässt es sich nicht.
  "schritte":
  - "zeit": "~09:30"
