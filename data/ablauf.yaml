49:
  "intro": "Matamata nach Rotorua: Schlammlöcher, Redwoods und ein ruhiger Abend am See Ōkareka."
  "text": |-
    Von Matamata nach Rotorua ist es nur eine knappe Stunde Fahrt, ein Fahrtag mit viel Luft. Der Vormittag gehört den Becken des Holiday Parks, danach geht es los in die geothermale Welt der Stadt. Schon beim Hereinfahren liegt der typische Schwefelgeruch in der Luft.

    Im Kuirau Park gibt es Schlammlöcher, dampfende Teiche und ein kostenloses Fußbad mitten in der Stadt. Danach führt der Weg in den Redwoods Whakarewarewa Forest mit hohen Bäumen und Rundwegen. Abends ist der Treewalk beleuchtet. Wer ihn besuchen will, kommt erst im Dunkeln zum Campsite, deshalb ist der Treewalk nur optional.

    Der Lake Ōkareka DOC Campsite liegt etwas außerhalb am See. Rund um Neumond am 06.05. ist es auf dem Campsite angenehm dunkel. Als Alternative steht der Government Gardens Parkplatz zentral in Rotorua bereit. Wäsche und Dump werden morgen erledigt. Rotorua riecht nach Schwefel, das gehört dazu. Die Stadt ist zentral für die Geothermie. Wer mag, nimmt ein Bad in den Thermalbecken am Morgen. Der Rest des Tages ist locker und ohne Druck.
  "schritte":
