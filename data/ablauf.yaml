33:
  "intro": "Zurück über den Takaka Hill nach Marlborough: Fahrtag zum Pelorus Bridge."
  "text": |-
    Der Tag ist ein Fahrtag: 184 km und reine 2:48 h, im Camper rund 3:20 h. Von Collingwood geht es über Takaka und den Takaka Hill nach Nelson und weiter nach Pelorus Bridge. Die Landschaft wechselt von Küste zu Wald.

    Unterwegs gibt es eine Mittagspause in Nelson oder Richmond und die Möglichkeit zum Tanken. Am Nachmittag erreicht ihr den Pelorus Bridge DOC Campground, der wegen der Schulferien gebucht sein sollte. Die Badestelle gilt als Drehort der Fässer-Szene aus dem Hobbit, dazu gibt es kurze Waldwege.

    Der Abend am Fluss ist ruhig. Sonnenuntergang ist um 17:49. Der Tag ist ohne Programmdruck, nutzt die Zeit zum Entspannen und für Wäsche oder Aufräumen im Camper. Die Strecke ist lang, aber bekannt: Ihr fahrt dieselbe Straße über den Hügel zurück. Das macht es einfacher, die Pausen zu planen. Am Pelorus Bridge wartet danach ein Platz am Fluss, der die Fahrt belohnt. Wer früh losfährt, hat am Nachmittag genug Zeit für den Fluss.
