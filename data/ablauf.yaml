54:
  "intro": "Um Auckland herum nach Norden: Goat Island und Matakana, die Stadt zur Rushhour meiden."
  "text": |-
    Heute geht es um Auckland herum nach Norden, und das gelingt am besten außerhalb der Stoßzeiten. Wer um 08:30 im Kauaeranga Valley startet, kommt gegen 10:15 an der Stadt vorbei, nach dem Morgenverkehr. Die Fahrt dauert insgesamt knapp vier Stunden, mit Mittagspause in Matakana Village.

    Das Dorf ist klein und hat Cafés und Märkte. Danach geht es zum Goat Island Marine Reserve, einem Meeresschutzgebiet. Ob Schnorcheln oder Glasbodenboot möglich ist, hängt vom Wetter ab. Informiert euch vor Ort über die Bedingungen.

    Die Nacht verbringt ihr am Te Ārai Self-Contained Campground, der Auckland Council gehört. Prüft auch hier Schild und Plakette. Falls der Platz nicht passt, ist der Uretiti Beach DOC Campsite die Alternative. Der Sonnenuntergang um 17:28 lässt noch genug Zeit zum Einrichten. Morgen geht es weiter in die Bay of Islands. Der Tag ist lang, aber ohne Programmdruck. Die Umfahrung von Auckland ist der kritische Teil, deshalb der Start vor 08:30. Danach wird die Landschaft ruhiger und ländlicher bis zum Platz am Strand.
