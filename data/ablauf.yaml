  - "zeit": "abends"
    "text": "Sonnenuntergang 17:27. Neumond naht, gute Sterne am Reid's Farm Campsite."
46:
  "intro": "Taupō nach Tongariro: Wasserfälle am Fuß der Vulkane, keine hohen Pässe zu Fuß."
  "text": |-
    Von Taupō geht es nach Süden in den Tongariro-Nationalpark. Die Fahrt dauert unter zwei Stunden und bringt die Vulkankegel allmählich ins Blickfeld. Das Tongariro Alpine Crossing ist für diese Reise bewusst gestrichen, stattdessen gibt es kürzere Wege, die zum Profil passen.

    Der Taranaki Falls Loop startet am Whakapapa Visitor Centre und ist rund 6 km lang mit etwa 150 Höhenmetern. Er führt durch alpines Gelände zu einem Wasserfall, der Weg ist gut machbar. Danach geht es zu den Tawhai Falls, auch Gollum's Pool genannt, was nur 20 Minuten dauert und für Herr-der-Ringe-Fans ein Fotostopp ist.

    Die Nacht verbringt ihr am Mangahuia DOC Campsite. Im Park gibt es nur wenig Einkaufsmöglichkeiten, packt also vorher alles ein. Mit dem Neumond in der Nähe ist der Himmel dunkel, der Abend am Camper kann sternenklar werden. Wärmere Kleidung nicht vergessen, es wird in der Höhe kühl. Auch ohne Gipfelwanderung ist die Nähe der Vulkane eindrucksvoll. Die Wege sind gut ausgebaut und leicht zu gehen. Wolken können die Gipfel verhüllen, dann bleiben die Wasserfälle das Hauptziel.
  "schritte":
  - "zeit": "~09:30"
    "text": "Abfahrt in Taupō (reine Fahrzeit 1:33 h, im Camper rund 1:50 h). Vorher Einkauf, im Park gibt es wenig."
  - "zeit": "~11:30"
    "text": "Ankunft am Whakapapa Visitor Centre."
  - "zeit": "~12:00"
    "text": "Taranaki Falls Loop: 6 km, rund 2 Stunden, ca. 150 Hm."
  - "zeit": "~14:30"
    "text": "Picknick am Camper."
  - "zeit": "~15:00"
    "text": "Tawhai Falls (Gollum's Pool), 20 Minuten."
  - "zeit": "~15:45"
    "text": "Einchecken am Mangahuia DOC Campsite. Alternative: Whakapapa Holiday Park."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:27. Dunkle Nacht, Sterne."
47:
  "intro": "Vom Vulkanland ins Höhlenland: Waitomo Glowworm Caves am Nachmittag, Glühwürmchen-Weg am Abend."
  "text": |-
    Heute wechselt die Landschaft vom rauen Vulkanland zu grünen Hügeln und Kalksteinhöhlen. Die Fahrt nach Waitomo dauert rund zweieinhalb Stunden im Camper. Man fährt durch Farmland und kleine Orte, bis die Höhlenregion beginnt. Der Holiday Park im Ort ist ein bequemer Standort, der Check-in klappt gut zur Mittagszeit.

    Die Waitomo Glowworm Caves besucht ihr auf einer geführten Tour mit Bootsfahrt durch die Grotte, wo tausende Glühwürmchen die Decke beleuchten. Die Tour ist ein Monat vorher gebucht, die Uhrzeit richtet sich nach der Buchung. Der Rest des Tages bleibt locker.

    Am Abend bietet der Ruakuri Bush Walk eine kostenlose Alternative: Nach Einbruch der Dunkelheit leuchten dort wilde Glühwürmchen im Wald. Nehmt eine Taschenlampe mit und geht vorsichtig. Rund um Neumond ist es besonders dunkel, das ist ideal. Morgen ist der große Hobbiton-Tag, also früh schlafen. Waitomo ist klein und touristisch, aber die Höhlen sind einzigartig. Plant die Tour so, dass ihr vorher in Ruhe ankommt. Der gratis Weg am Abend zeigt, dass Glühwürmchen auch ohne Eintritt zu erleben sind.
