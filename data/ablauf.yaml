    "text": "Einchecken im Fox Glacier TOP 10 Holiday Park, Wäsche und Strom."
  - "zeit": "~16:30"
    "text": "Zum Lake Matheson Parkplatz, Spiegelung bei Windstille am späten Nachmittag. Sonnenuntergang 18:18."
  - "zeit": "abends"
    "text": "Morgen früh nochmal, falls die Spiegelung heute ausgefallen ist."
23:
  "intro": "Frühaufsteher-Tag: Lake Matheson zum Sonnenaufgang, danach der Heli-Hike in Franz Josef."
  "text": |-
    Heute lohnt es sich ausnahmsweise, früh aufzustehen. Lake Matheson spiegelt am besten am windstillen Morgen, Sonnenaufgang ist um 07:05. Danach geht es zurück zum Camper, Frühstück und Check-out im Holiday Park.

    Von Fox Glacier nach Franz Josef sind es 37 km, im Camper rund 45 Minuten. Der Heli-Hike auf dem Franz Josef Glacier dauert zwei bis drei Stunden auf dem Eis, in gemütlichem Tempo. Die Zeit richtet sich nach der Buchung. Der Ausweichtermin ist morgen, falls Wetter oder Wolken den Flug verhindern.

    Nach dem Hike gibt es Mittagessen im Ort, dann fahrt ihr zum Otto/MacDonalds DOC Campsite am Lake Mapourika. Sonnenuntergang ist um 18:16. Der Tag ist das Highlight der West Coast, plant ihn ohne weitere Verpflichtungen. Der Heli-Hike ist wetterabhängig und eines der Highlights der West Coast. Packt feste Schuhe, warme Kleidung und Handschuhe ein. Wenn der Flug ausfällt, ist das kein Drama: Morgen steht der Ausweichtermin bereit. Danach reicht ein ruhiger Nachmittag am See völlig aus.
