24:
  "intro": "Puffertag in Franz Josef: Heli-Hike nachholen oder Gletschertal-Spaziergang und Okarito."
  "text": |-
    Heute ist der Ausweichtermin für den Heli-Hike. Hat der Flug gestern geklappt, bleibt der Tag ruhig. Wenn nicht, geht es heute auf das Eis. Beide Varianten sind eingeplant, damit keine Hektik entsteht.

    Bei der ruhigen Variante gibt es den Glacier Valley Walk, rund 1,5 Stunden, und optional einen Ausflug nach Okarito mit Lagune und Trig-Walk. Die Wäsche erledigt ihr im Laundromat Franz Josef in der Cron St, in der Wartezeit passt ein Kaffee. Die Landschaft der Gegend ist regenwaldig, mit Blick auf die Berge.

    Die Nacht verbringt ihr wieder am Lake Mapourika. Sonnenuntergang ist um 18:14. Prüft am Abend das Wetter und den nächsten Tag, denn es geht weiter nach Hokitika, mit dem Abstecher zum Hokitika Gorge. Die Strecke ist an diesem Tag minimal oder entfällt ganz. Das gibt euch die Möglichkeit, ohne Zeitdruck zu entscheiden. Auch das Laundromat in der Cron St passt gut in einen Tag ohne feste Termine, bevor es nach Hokitika weitergeht.
