  - "zeit": "~17:00"
    "text": "Kaffee am Wasser, Abendessen."
  - "zeit": "abends"
    "text": "Sonnenuntergang 17:59."
29:
  "intro": "Nelson als Versorgungsstopp, dann weiter nach Marahau am Abel Tasman."
  "text": |-
    Von St Arnaud geht es nach Nelson und weiter nach Marahau, 115 km und rund zwei Stunden im Camper. Der Tag ist ein Versorgungstag: Wäsche, Einkauf und Dump stehen an, bevor ihr in den Nationalpark kommt.

    In Nelson wascht ihr im Public Laundry am Montgomery Square, kauft im Supermarkt ein und fahrt zur Dump Station in Richmond (Fittal St). Danach geht es über Motueka weiter, optional zum Kaiteriteri Strand. Die Landschaft wird zur Küstenlandschaft mit Buchten und Hügeln.

    Die Nacht verbringt ihr im Marahau Beach Camp. Freedom Camping ist in Marahau und Kaiteriteri verboten, der Platz ist wegen der Schulferien reserviert. Am Abend bestätigt ihr Wassertaxi oder Kajak für morgen. Sonnenuntergang ist um 17:57. Nelson ist eine der sonnigeren Städte Neuseelands, ideal für Erledigungen. Danach beginnt die Küstenlandschaft des Abel Tasman. In den Schulferien ist es voll, deshalb ist die Reservierung im Marahau Beach Camp wichtig. Packt Einkäufe und Wäsche sinnvoll zusammen, damit die Wartezeiten kurz bleiben.
