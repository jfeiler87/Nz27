christchurch-top10: |
  Der Holiday Park liegt im Stadtteil Papanui im Norden Christchurchs, nicht direkt am Flughafen, aber nur eine kurze Fahrt von Britz und den großen Supermärkten entfernt. Für die erste Nacht ist er ideal: Strom, warme Duschen, Küche, Waschmaschinen und ebene Stellplätze helfen nach dem langen Flug, den Camper in Ruhe kennenzulernen. Der Park firmiert inzwischen als Tasman Holiday Parks Christchurch (früher Meadow Park). Preise für einen Powered Site liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; online vorab buchen, besonders vor Ostern und in den Schulferien.
hilltop-lookout: |
  Auf der Summit Road bzw. am SH75 öffnet sich bei der Hilltop Tavern der erste große Blick hinab in den Akaroa Harbour, einen halb im Meer versunkenen Vulkankrater mit steilen, grünen Hängen. Bei klarem Wetter erkennt man die Buchten und das winzige Städtchen ganz unten am Wasser. Der Halt dauert nur 10–15 Minuten und eignet sich gut für Fotos am Vormittag, wenn das Licht seitlich einfällt. Parken ist am Straßenrand bzw. bei der Tavern möglich; die Abfahrt nach Akaroa ist kurvig und steil, also im niedrigen Gang fahren. Bei Nebel oder tiefer Wolke lohnt sich der Stopp kaum.
akaroa-wharf: |
  Vom Akaroa Town Wharf starten die Hafenrundfahrten zu den Hector-Delfinen, den kleinsten und seltensten Delfinen der Welt. Sie leben im geschützten Akaroa Harbour und kommen oft neugierig ans Boot; mit etwas Glück sieht man auch Zwergpinguine und Robben. Die Fahrt dauert etwa 2 Stunden; der Anbieter (z. B. Black Cat) bietet eine Sichtungsgarantie bzw. teilweise Erstattung, Details laut Anbieter prüfen. Früh am Tag ist das Wasser meist ruhiger. Vorab online buchen, besonders in den Schulferien. Parken ist in Akaroa nahe dem Wharf begrenzt; für Camper gibt es größere Parkflächen etwas außerhalb des Zentrums.
akaroa-freedom-childrens-bay: |
  Der kleine Freedom-Camping-Parkplatz an der Childrens Bay liegt direkt am Wasser, nur wenige Gehminuten vom französisch angehauchten Dorfkern. Abends ziehen Licht und Stille über den Hafen, morgens kann man vor dem Frühstück am Ufer spazieren. Es gibt nur rund 19 Stellplätze, ausschließlich für zertifiziert self-contained Fahrzeuge (grüne Plakette, Pflicht seit 7.6.2026). Toiletten stehen in der Nähe, Duschen gibt es nicht. Die Nächte pro Aufenthalt sind begrenzt; Beschilderung und Council-Regeln vor Ort prüfen. In der Hochsaison früh am Nachmittag ankommen, sonst ist der Platz voll.
akaroa-top10: |
  Der Akaroa Top 10 Holiday Park liegt an der Morgans Rd, etwas oberhalb des Ortes, mit schönem Blick auf Hafen und Hügel. Er bietet Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner, ist daher die komfortable Alternative zum begrenzten Freedom-Platz. Der Fußweg ins Zentrum dauert rund 10–15 Minuten. Powered Sites kosten erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; online vorab buchen, vor allem in den Schulferien (10.–26.4.) und am Osterwochenende.
mount-sunday-edoras: |
  Mount Sunday erhebt sich als einzelner Hügel mitten in einem weiten, von Schneebergen gerahmten Flusstal und diente in Der Herr der Ringe als Edoras. Vom Parkplatz am Ende der Mt Potts Rd sind es etwa 1,5 km (rund 20–30 Minuten) über ebenes Gelände zum Fuß des Hügels, der kurze Aufstieg dauert noch einmal rund 15 Minuten. Die Anfahrt über die Hakatere Potts Rd ist größtenteils Schotter mit Furten und länger als die Britz-Grenze von 12 km. Daher nur mit schriftlicher Vermieterfreigabe fahren, bei Regen nicht. Am besten morgens oder abends wegen Licht und wenig Wind.
peel-forest: |
  Peel Forest ist einer der letzten Reste des einst riesigen Podocarp-Urwalds der Canterbury-Ebene. Vom Parkplatz Te Wanahu Flat führt ein kurzer Weg in ca. 10–15 Minuten zum Big Tree, einem mehrere Hundert Jahre alten Tōtara mit gewaltigem Stamm. Zum Emily Falls (separater Parkplatz an der Blandswood/Lookout Rd) geht man etwa 20–30 Minuten über einen leicht begehbaren Waldweg. Beide Wege sind flach bis leicht hügelig und gut kurz zu gehen. Der Picknickplatz hat Toiletten; die Zufahrt über die Rangitata Gorge Rd ist asphaltiert und campertauglich. Sandflies kann es geben, Repellent mitnehmen.
peel-forest-campground: |
  Der Campingplatz liegt mitten im Peel Forest am Fuß der Berge, umgeben von hohen Bäumen und mit guter Chance auf Vogelrufe im Morgengrauen. Es gibt Stellplätze für Zelte und Camper (teils mit Strom), Toiletten, Duschen und eine Gemeinschaftsküche; die Gebühren liegen laut Betreiber im üblichen Bereich eines einfachen Campingplatzes, aktuelle Preise vor Ort bzw. online prüfen. In den Schulferien und an Wochenenden ist Reservierung ratsam. Als Alternative liegt der DOC-Platz Clarkes Flat in der Nähe. Die Zufahrt ist asphaltiert; kurze Abendspaziergänge im Wald sind direkt ab dem Platz möglich.
lake-clearwater: |
  Der Lake Clearwater im Hakatere Conservation Park liegt in einer rauen, tussockbedeckten Hochebene mit Bergen rundum, ein stilles Ziel abseits der Hauptrouten. Der Campingplatz des Ashburton District Council ist einfach: Toiletten, kein Strom, bezahlt wird laut Quellen per Honesty Box; die genaue Gebühr vor Ort prüfen. Die Zufahrt führt rund 10 km über Schotter (Ashburton Gorge Rd / Hakatere Potts Rd) und liegt damit gerade noch unter der Britz-Grenze von 12 km. Abends kann es empfindlich kalt werden. Hunde sind nicht erlaubt. Bei Regen die Furten und die Piste vorher prüfen.
tekapo-church: |
  Die Church of the Good Shepherd von 1935 steht auf einer kleinen Landzunge am türkisblauen Lake Tekapo, im Hintergrund die Südalpen. Das Altarfenster rahmt den See, doch Innenfotos sind nicht erlaubt und die Kirche ist sehr klein. Am besten kommt man früh am Morgen oder spät am Abend, dann sind weniger Reisebusse da und das Licht ist weicher. Im Frühjahr/Herbst blüht oder leuchtet je nach Saison das Ufer. Parken ist am Straßenrand der Pioneer Dr möglich; Ordnung halten, nicht auf Privatgelände. Im Sommer wird es mittags richtig voll.
mt-john-observatory: |
  Auf dem Mt John oberhalb von Tekapo liegt das Observatorium im Aoraki Mackenzie Dark Sky Reserve; der Gipfel bietet ein Rundum-Panorama auf den türkisen See, das Mackenzie-Becken und die Alpen. Die Straße ist private, mautpflichtige Schotterpiste; Camper dürfen laut Hinweis oft nicht hinauf. Alternativ gehen Dark-Sky-Project-Touren per Bus zum Gipfel (Sternenbeobachtung nach Einbruch der Dunkelheit, vorab buchen, wetterabhängig). Der Mt John Summit Track von der Basis ist ein Rundweg von etwa 1,5–2 Stunden mit moderatem Anstieg. Der Astro Café oben hat nur tagsüber geöffnet.
tekapo-springs: |
  Tekapo Springs ist eine Thermalanlage am Seeufer mit mehreren beheizten Becken, von denen man auf den Lake Tekapo und die Berge blickt. Besonders schön ist es abends oder in kühlen Morgenstunden, wenn Dampf über dem Wasser liegt. Es gibt Duschen und Umkleiden; Eintritt wird pro Person erhoben, Preise und ggf. Zeitslots laut Betreiber online prüfen. Der Kundenparkplatz am Lakeside Drive ist für Camper geeignet. Handtuch kann man leihen oder selbst mitbringen. In der Hochsaison vorab buchen.
tekapo-edwards-stream: |
  Dieser Freedom-Platz liegt abseits vom Ort Tekapo am SH8, wo Freedom Camping verboten ist, und eignet sich mit weiter Sicht über die Ebene und viel Himmel gut für Sterne. Er ist nur für zertifiziert self-contained Fahrzeuge (grüne Plakette) zugelassen; Toiletten und Wasser gibt es nicht bzw. nur sehr einfach. Kostenlos, ohne Reservierung, es gilt first come, first served. Die erlaubte Nächtezahl ist begrenzt (laut Beschilderung prüfen). Nachts kann es schon im April nahe 0 °C kalt werden. Straßenlärm vom SH8 ist möglich.
lakes-edge-tekapo: |
  Der Lakes Edge Holiday Park liegt in Station Bay direkt am Seeufer des Lake Tekapo, mit Blick auf Wasser und Berge, nur einige Kilometer vom Ortskern. Er bietet Stellplätze mit Strom, Duschen, Küche und Aufenthaltsraum. Besonders gefragt sind Plätze mit Seeblick, deshalb früh reservieren; im Hochsommer und in den Schulferien (10.–26.4.) ist der Platz oft ausgebucht. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich für zwei Personen. Nachts ist es oft sehr klar und kalt, ein gutes Fotofenster für den Sternenhimmel.
peters-lookout-pukaki: |
  Peters Lookout ist der klassische Fotostopp am Lake Pukaki: Der Gletschersee leuchtet in intensivem Türkisblau, dahinter ragt bei klarer Sicht der Mount Cook auf. Vom kleinen Parkplatz geht man über einen kurzen Fußweg zum Aussichtspunkt, nur wenige Minuten. Am besten morgens, wenn der Wind noch ruht und das Licht weich ist; mittags wirkt die Farbe am stärksten, aber die Berge verschwinden oft im Dunst. Im Sommer ist der Parkplatz früh voll; die Zufahrt ist asphaltiert und campertauglich. In der Nähe gibt es einen Imbiss und Toiletten am Seeufer.
hooker-valley: |
  Der Hooker Valley Track ist der beliebteste Spaziergang im Aoraki/Mt Cook National Park: etwa 10 km hin und zurück, rund 3 Stunden, ca. 100 Hm und überwiegend breiter, gut ausgebauter Weg mit drei Hängebrücken über den Hooker River. Am Ende liegt der Hooker Lake mit treibenden Eisschollen vor dem Mount Cook. Morgens ist es meist ruhiger und windstiller; später kann der Wind stark sein, warm anziehen. Der Parkplatz White Horse Hill hat Toiletten; die Straße ist asphaltiert. Auch der kürzere Kea Point Track (ca. 1–1,5 h hin und zurück, leicht) startet hier und eignet sich für den Nachholtag.
white-horse-hill-doc: |
  Der DOC-Campingplatz White Horse Hill liegt im Hooker Valley direkt unterhalb der Gletscher und Gipfel des Mount Cook. Du wachst mit Blick auf schneebedeckte Berge auf, ein echtes Highlight der Reise. Es gibt Toiletten und Wasser, aber keinen Strom und keine Duschen; kein Handyempfang ist möglich. Die Plätze sind sehr gefragt, daher unbedingt online bei DOC vorab buchen, die Gebühr liegt laut DOC im üblichen Bereich für Campsites in Nationalparks (aktuell prüfen). Die Aufenthaltsdauer ist begrenzt (laut DOC auf wenige Nächte). Nachts wird es kalt; Decken und Heizung einplanen.
tasman-glacier-viewpoint: |
  Von der Tasman Valley Rd führt ein kurzer, aber steiler Weg mit Treppen (ca. 15–20 Minuten) zum Aussichtspunkt über den Tasman Glacier und seinen Gletschersee mit Eisbergen. Der Gletscher ist mit rund 27 km der längste Neuseelands und ist hier vor allem von Moränen überdeckt. Die Blue Lakes sind kleine Teiche in der Nähe, deren Farbe je nach Jahreszeit schwankt. Die Straße ist teilweise Schotter, aber kurz, in der Regel mit Camper machbar; bei Regen langsam fahren. Wichtig: Wetter und Sicht prüfen, sonst sieht man wenig.
mt-cook-airport: |
  Vom Mount Cook Airport am SH80 starten Ski-Flugzeuge und Helikopter zu Rundflügen über den Tasman Glacier und die höchsten Gipfel Neuseelands. Die Landung auf dem Gletscher gehört zu den eindrücklichsten Erlebnissen der Südinsel, vorausgesetzt das Wetter spielt mit. Flüge dauern je nach Programm 20 Minuten bis eine Stunde; spontane Buchungen sind am Vortag oft möglich, ansonsten vorher online reservieren. Frühmorgens sind Sicht und Luft meist am besten. Der Flugplatz liegt etwa 5 km südlich vom Mt Cook Village, nicht beim Glentanner Park. Preise sind hoch, Wetterabsagen mit Umbuchung bzw. Erstattung laut Anbieter.
clay-cliffs: |
  Die Clay Cliffs bei Omarama sind ein Labyrinth aus hoch aufragenden, scharfkantigen Lehm- und Kiesgraten, die durch Erosion wie Orgelpfeifen wirken. Man geht vom Parkplatz nur wenige Minuten zu den ersten Formationen, zusätzlich sind kurze Pfade zwischen den Graten möglich; Gesamtdauer 30–60 Minuten. Das Gelände ist Privatland und verlangt eine kleine Eintrittsgebühr (Honesty Box bzw. Kasse am Eingang). Die Zufahrt über die Clay Cliffs Lane ist Schotter, aber kurz (rund 7 km von der Teerstraße) und in der Regel für Camper machbar; bei Nässe vorsichtig. Warme Mittagshitze und kaum Schatten, Hut und Wasser mitnehmen.
elephant-rocks: |
  Elephant Rocks sind runde Kalksteinblöcke, die auf einer Weide bei Duntroon wie eine versteinerte Elefantenherde stehen und als Kulisse für Narnia dienten. Der Weg über Weideland ist kurz und flach, etwa 10–20 Minuten pro Strecke. Beim Betreten der Weide Tore schließen und Schafe nicht stören. Am schönsten im weichen Licht am Morgen oder späten Nachmittag, wenn die Schatten die Rundungen betonen. Der Parkplatz an der Island Cliff–Duntroon Rd ist klein, die Straße teilweise Schotter, aber kurz.
oamaru-blue-penguin: |
  In der Blue Penguin Colony am Hafen von Ōamaru kommen die kleinsten Pinguine der Welt (rund 25 cm groß) nach Sonnenuntergang aus dem Meer zurück zu ihren Nestern. Von Tribünen aus sieht man sie in Trupps über den Kai watscheln und in Nisthöhlen verschwinden. Der Besuch dauert etwa 1,5 Stunden, Fotografieren mit Blitz ist verboten. Eintritt wird pro Person erhoben und die Plätze sind begrenzt, deshalb vorab online buchen; die Ankunftszeit ändert sich mit dem Sonnenuntergang. Im Frühjahr/Sommer sind oft viele Tiere zu sehen, im Herbst kann die Mauser Auswirkungen haben. Warme Kleidung mitnehmen.
all-day-bay-kakanui: |
  All Day Bay ist eine kleine Strandbucht an der Küste nördlich von Kakanui, mit Kieselstrand und Blick aufs Meer. Ob hier Freedom Camping erlaubt ist, ist nicht bestätigt; Schilder und die Regeln des Waitaki District Council vor Ort prüfen, notfalls auf den Campingplatz Kakanui ausweichen. Es gibt allenfalls einfache Toiletten, keine Duschen und keinen Strom. Der Platz ist ruhig, abends zeigen Meer und Himmel schöne Farben. Wenn Camping nicht erlaubt ist, bleibt der Oamaru Top 10 als sichere Alternative.
oamaru-top10: |
  Der Oamaru Top 10 Holiday Park liegt in der Chelmer St, ruhig und nicht weit von der Hafenzeile und der Blue Penguin Colony entfernt. Es gibt Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Ideal, wenn du nach den Pinguinen am Abend nicht mehr weit fahren möchtest. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; in Schulferien (10.–26.4.) und am Wochenende frühzeitig reservieren. Das viktorianische Stadtzentrum ist in wenigen Minuten erreichbar.
moeraki-boulders: |
  Am Koekohe Beach liegen die kugelrunden, bis zu zwei Meter großen Moeraki Boulders, Konkretionen, die vor rund 60 Millionen Jahren im Meeresschlamm gewachsen sind. Vom Parkplatz geht man etwa 10 Minuten über einen kurzen Pfad zum Strand. Die Steine sind bei Ebbe am besten zugänglich und besonders fotogen, bei Flut stehen manche im Wasser. Morgens und abends ist es ruhiger, Sonnenaufgang bringt schönes Licht. Der Eintritt ist laut Anbieter frei bzw. ein kleiner Betrag, aktuell prüfen. In der Nähe leben gelegentlich Gelbaugenpinguine; Abstand halten.
tunnel-beach: |
  Der Tunnel Beach südlich von Dunedin ist ein Weg von etwa 2 km hin und zurück (rund 1 Stunde) über Weideland zu einem handgegrabenen Tunnel aus den 1870ern, der zu einem Sandstrand zwischen Klippen führt. Der Rückweg ist steil und kostet etwa 100–150 Hm; feste Schuhe und Pausen einplanen. An der Küste stehen markante Sandsteinfelsen mit Torbogen. Der Zugang erfolgt durch privates Land und kann bei hoher Flut, starkem Seegang oder Wind eingeschränkt sein; Hinweisschilder beachten. Der Parkplatz ist für Camper geeignet. Am schönsten bei Sonnenuntergang oder Ebbe.
portobello-campground: |
  Der Portobello Village Tourist Park liegt mitten auf der Otago Peninsula im Dorf Portobello, nur Minuten von der Küstenstraße und den Wildlife-Zielen entfernt. Es gibt Stellplätze mit Strom, Duschen, Küche und Waschmaschinen; die Plätze sind überschaubar, daher früh buchen. Freedom Camping ist auf der Halbinsel stark eingeschränkt, deshalb ist dieser Platz eine sichere Wahl. Der Preis liegt erfahrungsgemäß im mittleren zweistelligen NZD-Bereich. Ruhig, mit Blick auf den Hafen; Abendessen kann im Dorf eingenommen werden.
harwood-domain: |
  Harwood ist ein kleines Dorf am Hafen der Otago Peninsula; die Domain war als freier Stellplatz vorgesehen. Ob dort Camping noch erlaubt ist, ist nicht bestätigt (kein Eintrag in OSM gefunden). Vor Ort Schilder sowie CamperMate/Rankers prüfen und Regeln des Dunedin City Council beachten. Ist Camping nicht möglich, ist der Portobello Village Tourist Park die einfache Alternative. Falls erlaubt: nur self-contained mit grüner Plakette, wenig Infrastruktur, ruhig und mit Wasserblick.
royal-albatross-centre: |
  Am Taiaroa Head, an der Spitze der Otago Peninsula, brütet die einzige Festlands-Kolonie der Königsalbatrosse, deren Flügelspannweite bis zu 3 m erreicht. Ein Besucherzentrum bietet Touren mit Beobachtungshaus, teils mit Blick auf Nester, außerdem Führungen zu den historischen Befestigungsanlagen. Albatrosse sind Vögel, daher nur optional; auf demselben Gelände sieht man oft Seehunde und Gelbaugenpinguine. Touren vorab online buchen, da sie begrenzte Plätze haben. Die Straße entlang der Halbinsel ist eng, kurvig und am Wasser; mit Camper langsam fahren.
penguin-place: |
  Penguin Place ist ein privates Schutzgebiet für Gelbaugenpinguine (Hoiho) auf der Otago Peninsula. Geführte Touren (rund 90 Minuten) führen über getarnte Gräben und Tunnel nah an Nester und Strand, ohne die Tiere zu stören. Die Einnahmen finanzieren das Schutzprogramm. Ob und wann Pinguine zu sehen sind, hängt von der Saison ab: Während der Mauser (Februar bis April) sind weniger Tiere an Land. Vorab online buchen und Zeit bestätigen lassen. Das Fahren zum Gelände ist über eine enge Küstenstraße möglich; im Camper vorsichtig. Preis laut Wiederverkäufer-Listings sehr unterschiedlich (grob 40–70 NZD pro Person), beim Anbieter The OPERA prüfen.
sandfly-bay: |
  Sandfly Bay ist ein wilder Strand mit hohen Sanddünen, Klippen und starkem Wind, an dem oft Seelöwen und Seebären ruhen. Vom Parkplatz führt ein Pfad etwa 20–30 Minuten hinab zum Strand, der Rückweg über die Düne ist steil (~100 Hm) und anstrengend. Seelöwen bitte nur aus mindestens 10 m Abstand betrachten, Gelbaugenpinguine sind scheu und nicht zu stören. Die Zufahrt ist am Ende ein kurzes Stück Schotter, für Camper möglich, aber langsam fahren. Am besten bei Ebbe und ruhigerem Wind.
nugget-point: |
  Der Nugget Point Leuchtturm steht auf einem schmalen Kamm über einer Reihe zerklüfteter Felsinseln, den Nuggets, die aus dem Südpazifik ragen. Vom Parkplatz geht man etwa 20 Minuten (rund 1 km) auf einem festen Weg zum Leuchtturm; unterwegs gibt es kleine Aussichtspunkte und oft Robben und Seebären an den Felsen. Besonders schön ist es bei Sonnenaufgang oder Sonnenuntergang. Der Wind ist stark, warm anziehen. Die Zufahrt ist asphaltiert, aber die letzten Kilometer sind schmal und kurvig; Camper sollten langsam fahren. Seebären und Seelöwen nicht stören.
purakaunui-falls: |
  Der Purakaunui Falls ist ein mehrstufiger Wasserfall im Catlins-Wald, einer der meistfotografierten in Neuseeland. Vom Parkplatz geht man etwa 10–15 Minuten über einen gut ausgebauten Weg durch Wald zur Aussichtsplattform. Der Weg ist leicht und kurz, ideal für eine kleine Pause. Morgens ist es meist ruhiger. Die Zufahrt führt über kurze Schotterstrecken, aber normalerweise campertauglich; nach Regen kann es rutschig sein.
purakaunui-bay-doc: |
  Der DOC-Platz Purākaunui Bay liegt in einer abgelegenen Bucht der Catlins, auf einer grünen Wiese über einem Strand mit Klippen und Wellen. Es gibt Toiletten und Wasser (nach Aufbereitung), aber keinen Strom und keine Duschen. Die Gebühr liegt laut DOC im üblichen Bereich für Standard-Campsites; Details auf der DOC-Website prüfen. Die letzte Strecke ist Schotter, mit Camper meist machbar. Der Platz ist ein Favorit und zu Ostern schnell voll; frühzeitig ankommen. Plätze werden meist nach first come, first served vergeben; Seelöwen können am Strand liegen.
papatowai-campsite: |
  Der Papatowai Campsite liegt in der Mitte der Catlins, nahe dem Strand von Papatowai und dem Tautuku-Wald. Es gibt einfache Einrichtungen mit Toiletten und Wasser; Strom und Duschen sind eingeschränkt oder nur gegen Gebühr. Der Platz ist ruhig, ideal, wenn man Wanderungen wie Lake Tautuku oder den Strand erkunden möchte. Preis laut Betreiber im üblichen Bereich eines einfachen Campingplatzes, vor Ort prüfen. Vor Ostern früh reservieren oder rechtzeitig ankommen.
mclean-falls: |
  Der McLean Falls ist ein breiter, gestufter Wasserfall in der Catlins-Waldlandschaft. Vom Parkplatz führt ein Weg von etwa 40 Minuten hin und zurück (ca. 2,4 km) durch Farnwald und über Brücken, überwiegend flach mit einigen Stufen. Der Weg ist gut ausgebaut und kurz. Besonders schön ist er nach Regen, wenn der Fall mehr Wasser führt; dann kann der Boden aber schlammig sein. Die Zufahrt ist teilweise Schotter, aber kurz und für Camper geeignet.
cathedral-caves: |
  Die Cathedral Caves sind hohe Meereshöhlen in einer Küstenwand, die nur bei Niedrigwasser zugänglich sind. Vom Parkplatz geht man rund 30 Minuten über Wald und Strand zum Eingang. Laut Betreiber ist der Zutritt nur etwa 2 Stunden vor bis 1 Stunde nach Niedrigwasser möglich, außerdem abhängig von Seegang und Wetter; es gibt laut offizieller Seite Tage ohne Öffnung. Der Eintritt beträgt laut Betreiber ca. 15 NZD pro Erwachsenen, nur Kartenzahlung. Die Saison ist laut Quellen etwa Oktober bis Mai. Aktuelle Öffnung unbedingt vorab auf cathedralcaves.co.nz prüfen.
curio-bay: |
  Bei Ebbe zeigt Curio Bay Reste eines 170 Millionen Jahre alten versteinerten Waldes, dessen Baumstämme noch auf der Felsplattform liegen. Außerdem leben in Porpoise Bay Hector-Delfine, die man mit Glück vom Strand aus sehen oder beim Schwimmen treffen kann. Am späten Nachmittag und in der Dämmerung kommen Gelbaugenpinguine an Land; vom Beobachtungsunterstand aus sieht man sie ohne zu stören. Der Day Visitor Car Park hat Toiletten und ein Besucherzentrum; Gezeiten vorab prüfen. Mindestens 20 m Abstand zu Robben und Pinguinen halten.
slope-point: |
  Slope Point ist der südlichste Punkt der Südinsel, markiert durch ein Schild, das 4.803 km bis zum Äquator und 4.862 km bis zum Südpol anzeigt. Vom Parkplatz geht ein Pfad über Weideland etwa 20 Minuten hin zu den Klippen; er ist flach, aber oft sehr windig und kann bei Regen matschig sein. Die Zufahrt über die Slope Point Rd ist Schotter, relativ kurz, mit Camper in der Regel machbar. Der Weg führt über Privatland; Zäune und Schafe respektieren. Zum Fotografieren ist das Licht am Abend am schönsten.
curio-bay-curioscape: |
  Das Curioscape Campground liegt an der Waikawa Curio Bay Rd nahe Curio Bay und Porpoise Bay und ist ein einfacher Campingplatz mit Blick aufs Meer. Es gibt Stellplätze, Toiletten, Duschen und Wasser; Strom und weitere Ausstattung je nach Platz und Betreiber. Vom Platz erreicht man zu Fuß den Versteinerten Wald und die Delfinbucht. Preise liegen erfahrungsgemäß im niedrigen bis mittleren zweistelligen NZD-Bereich; Verfügbarkeit und Buchung im Voraus prüfen, besonders in den Ferien.
henry-creek-doc: |
  Der DOC-Platz Henry Creek liegt am Ufer des Lake Te Anau, ein ruhiger Platz mit Blick auf Wasser und Berge, etwa 25 Minuten vom Ort Te Anau entfernt. Es gibt Toiletten und Wasser (ggf. abkochen), aber keine Duschen und keinen Strom. Die Gebühr liegt laut DOC im üblichen Bereich für Standard-Campsites; aktuell auf der DOC-Seite prüfen. Plätze werden meist ohne Reservierung vergeben (first come, first served). Sandflies sind möglich; Repellent einpacken. Von hier aus sind es gut 100 km bis Milford Sound.
te-anau-lakeview-hp: |
  Der Te Anau Lakeview Holiday Park liegt am Rand von Te Anau und bietet Stellplätze mit Strom, Duschen, Küche sowie Waschmaschine und Trockner. Er ist die praktische Alternative, um vor der Milford Road Wäsche zu waschen, Wasser aufzufüllen und die Toilette zu entleeren. Preis liegt erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen, vor allem in den Schulferien. Das Zentrum und die Seepromenade sind zu Fuß erreichbar.
mirror-lakes: |
  Mirror Lakes sind kleine Tümpel an der Milford Road, in denen sich die Eyre Mountains bei Windstille wie in einem Spiegel zeigen. Vom Parkplatz geht man etwa 5–10 Minuten über einen Holzsteg. Am besten am frühen Morgen oder bei ruhigem Wetter. Der Parkplatz am Straßenrand ist klein; der Halt dauert nur kurz. Ein schneller Stopp auf dem Weg zum Milford Sound, die Straße ist asphaltiert.
cascade-creek-doc: |
  Der DOC-Campsite Cascade Creek liegt im Fiordland-Wald an der Milford Road mit Blick auf Berge und den Cascade Creek, kurz vor dem Lake Gunn. Von hier startet der Lake Gunn Nature Walk, etwa 45 Minuten durch Urwald mit Südbuchen und Moosen. Der Platz hat Toiletten, aber keinen Strom und keine Duschen. Laut DOC ist Buchung online erforderlich; die Gebühr beträgt laut Listing 18 NZD pro Erwachsenen und Nacht. Vor Ort gibt es oft keinen Handyempfang, deshalb Buchung vorab erledigen. Sandflies sind aktiv, Repellent mitnehmen.
knobs-flat: |
  Knobs Flat ist eine Wiesenlandschaft am Eglinton Valley, ein Stopp mit Weitblick, an dem die Berge von Fiordland aufragen. Es ist kein klassischer DOC-Platz; in der Nähe liegt das DOC-Campsite Kiosk Creek (Toiletten, Wasser, kein Strom). Vor Ort die aktuellen Regeln und Buchung beim DOC prüfen, da sich Bestimmungen ändern. Plätze sind begrenzt, im April und besonders in den Schulferien früh reservieren. Nachts kalt, daher warme Kleidung einplanen.
milford-sound-terminal: |
  Am Cruise Terminal in Milford Sound beginnen die Bootsfahrten durch den Fjord zu Mitre Peak, Wasserfällen wie Stirling und Lady Bowen und zu Robbenfelsen. Eine Fahrt dauert etwa 1,5–2 Stunden, bei Regen sind die Wasserfälle besonders spektakulär. Früh am Tag fahren, denn der Homer Tunnel hat Ampelphasen und Wartezeiten, und Mittagsfahrten sind voller. Der Parkplatz am Terminal ist gebührenpflichtig, Camper sind erlaubt. Vorab buchen, besonders in den Ferien; bei Lawinen- oder Sturmwarnung kann die Straße gesperrt sein.
the-chasm: |
  The Chasm ist ein kurzer Spaziergang von etwa 10 Minuten (ca. 20 Minuten hin und zurück) durch Wald zu einer Brücke über den Cleddau River, der hier durch ausgewaschenen Fels stürzt. Der Weg ist flach und gut ausgebaut. Bei Regen ist der Wasserfall besonders eindrucksvoll, aber auch rutschig. Der Parkplatz ist klein; der Halt gut auf der Rückfahrt von Milford.
key-summit-divide: |
  Der Key Summit ab The Divide ist ein Weg von etwa 3,4 km einfach (ca. 3 Stunden hin und zurück) und rund 400 Hm Anstieg, großteils durch Wald und über Stufen. Oben liegt ein alpines Moorplateau mit Blick auf Fiordland-Gipfel und Täler. Wetter und Sicht entscheiden, ob der Aufstieg lohnt; bei Wolken lieber überspringen. Der Parkplatz am Divide ist gebührenfrei, Toiletten vorhanden. Der Weg ist ein Teil des Routeburn Tracks und gut markiert, aber am Grenzwert deiner Tageslimits (≤400 Hm).
skyline-queenstown: |
  Die Skyline-Gondel bringt dich in wenigen Minuten auf den Bob’s Peak über Queenstown mit Blick auf den Lake Wakatipu, die Remarkables und die Stadt. Abends ist es besonders schön, wenn die Sonne die Berge färbt; auf der Terrasse und im Restaurant lässt sich der Sonnenuntergang genießen. Optional kann man die Luge-Bahn oder Bungee probieren. Tickets gibt es online, teils günstiger bei Vorabbuchung. Parken in Queenstown ist teuer und für Camper begrenzt; öffentliche Parkplätze mit Höhenbegrenzung meiden und stattdessen am Stadtrand parken.
moke-lake-doc: |
  Der DOC-Platz am Moke Lake liegt etwa 6 km von Queenstown entfernt an einem ruhigen Bergsee, umgeben von Tussockhügeln, ideal für Spaziergänge und Spiegelungen. Es gibt Toiletten und Wasser, aber keinen Strom und keine Duschen. Die Zufahrt führt über ein kurzes Schotterstück, für Camper meist machbar. Plätze werden laut DOC meist ohne Reservierung vergeben, im Sommer und bei Ferien früh kommen. Die Gebühr liegt laut DOC im üblichen Bereich; aktuelle Preise prüfen. Der Rundweg um den See ist ca. 5–6 km und leicht.
queenstown-top10: |
  Der Queenstown Holiday Park Creeksyde (früher Top 10) liegt in Robins Rd, nur wenige Gehminuten vom Stadtzentrum und dem Seeufer. Er bietet Stellplätze mit Strom, Duschen, Küche, Waschmaschinen und Trockner. Ideal für einen Wasch- und Versorgungstag. Preise liegen erfahrungsgemäß im höheren zweistelligen NZD-Bereich; in der Hochsaison früh buchen. Ob die Top-10-Mitgliedschaft noch besteht, vor der Buchung prüfen.
frankton-arm-freedom: |
  Freedom Camping in Queenstown ist stark eingeschränkt: Laut QLDC-Bylaw (seit Dezember 2025) sind nur ausgewiesene Plätze wie der Gray Street Carpark (4 Plätze, Frankton) und der Queenstown Events Centre Carpark (9 Plätze) erlaubt, nur für zertifiziert self-contained Fahrzeuge. Verstöße kosten laut Council 400 NZD. Der Platz ist einfach: Toiletten in der Nähe, keine Duschen, kein Strom. Aktuelle Regeln und Plätze vor Ort per Beschilderung und Council-Website prüfen. Als sichere Alternative bietet sich ein Holiday Park an.
arrowtown: |
  Arrowtown ist ein hübsches Goldgräberstädtchen in den Bergen nördlich von Queenstown, mit kleinen Holzhäusern, Cafés und Läden an der Buckingham St. Im Chinese Settlement am Arrow River sieht man restaurierte Hütten der chinesischen Goldsucher (frei zugänglich). Anfang bis Mitte April färben sich die Pappeln und Ahorne gelb und rot, das Highlight für Herbstlandschaft. Kurze Spaziergänge am Fluss dauern 30–60 Minuten und sind flach. Parken in der Nähe des Zentrums ist begrenzt; mit Camper lieber am Rand der Stadt parken.
tss-earnslaw-wharf: |
  Das historische Dampfschiff TSS Earnslaw (1912) fährt ab Steamer Wharf über den Lake Wakatipu zur Walter Peak Farm. Die Fahrt dauert etwa 1,5 Stunden, im Maschinenraum sieht man die Heizer Kohle schaufeln. Bei Sonne ist die Aussicht auf die Remarkables großartig. Optional gibt es Farmbesuch oder Abendessen an Land. Tickets vorab buchen, Preise laut Anbieter. Alternativ bietet sich eine Jetboat-Fahrt an (laut Plan). Parken in Queenstown für Camper ist begrenzt.
deer-park-heights: |
  Deer Park Heights ist eine private Farm mit Aussichtspunkt hoch über dem Kawarau River und dem Lake Wakatipu und Drehort für Filme wie Der Hobbit und Mission Impossible. Die Straße ist Schotter, für Camper meist nicht erlaubt; die Zufahrt erfolgt über eine Mautstraße und ist gebührenpflichtig. Alternativ kann man das Gelände im Rahmen einer geführten Tour besuchen. Die Aussicht ist besonders schön bei klarem Wetter am Morgen oder Abend. Die Zufahrt ist steil und eng, mit Camper nur nach Freigabe des Vermieters.
bennetts-bluff: |
  Bennetts Bluff Lookout an der Glenorchy-Queenstown Rd gibt den vielleicht schönsten Blick auf den Lake Wakatipu mit seinen Buchten und den Remarkables im Hintergrund. Vom Parkplatz sind es nur wenige Schritte zur Aussichtsplattform. Am besten morgens oder am späten Nachmittag, wenn das Licht den See färbt. Die Straße ist schmal und kurvenreich, Camper sollten langsam fahren. Es gibt einen kleinen Parkplatz und einen zweiten daneben; im Sommer schnell voll.
glenorchy-wharf: |
  Glenorchy liegt am Nordende des Lake Wakatipu, umgeben von Bergen und Flusstälern. Der alte rote Bootsschuppen am Wharf ist ein beliebtes Fotomotiv; der Lagoon Walk führt in rund 30–45 Minuten über Holzstege und durch Feuchtgebiet zur Lagune und ist flach (ca. 2–3 km). Der Abend am Seekopf ist ruhig, mit warmem Licht auf den Bergen. Parken am Wharf ist kostenlos, Toiletten sind vorhanden. Gute Cafés und ein kleiner Laden im Ort.
paradise-glenorchy: |
  Paradise liegt am Ende der Glenorchy-Paradise Rd im Dart-Tal, ein weites Tal mit Pappeln, Fluss und Bergen, das in Der Herr der Ringe als Lothlórien bzw. Isengard diente. Die Straße ist Schotter und führt über mehrere Furten; Britz erlaubt Schotter nur bis 12 km. Vor Ort prüfen, wie lang die Schotterstrecke ist und ob die Furten passierbar sind, bei Regen lieber verzichten. Wenn es machbar ist, lohnt sich ein kurzer Spaziergang am Fluss. Alternativ kann man das Tal im Rahmen einer geführten Tour ab Glenorchy erkunden.
glenorchy-campground: |
  Mrs Woolly's Campground im Ort Glenorchy ist ein einfacher Campingplatz mit Stellplätzen für Camper, Toiletten, Duschen und Küche. Er liegt in Gehweite zum Wharf und den Cafés, ruhig am Rand des Dorfes. Strom ist teilweise vorhanden; Preise liegen erfahrungsgemäß im niedrigen bis mittleren zweistelligen NZD-Bereich. Reservierung vorab prüfen, besonders in den Ferien. Die Aussicht auf die Berge ist ausgezeichnet.
twelve-mile-delta-doc: |
  Der DOC-Platz Twelve Mile Delta liegt zwischen Queenstown und Glenorchy an der Seeküste, mit Blick auf den Lake Wakatipu und die Berge. Es gibt Toiletten und Wasser, keinen Strom und keine Duschen. Der Platz ist beliebt und im Sommer schnell voll, deshalb früh kommen oder, falls möglich, online buchen. Die Gebühr liegt laut DOC im üblichen Bereich für Standard-Campsites; aktuell prüfen. Der See ist zum Baden kalt, aber das Ufer lädt zu einem Spaziergang ein.
kawarau-bridge: |
  Die Kawarau Bridge ist der Ort, an dem das kommerzielle Bungee-Springen erfunden wurde. Du kannst von einer Aussichtsplattform den Springern zusehen, wie sie 43 m in den türkisen Fluss fallen. Es gibt ein Café und einen Shop, Eintritt für Zuschauer ist laut Betreiber oft frei. Der Parkplatz ist für Camper geeignet. Zeit einplanen: etwa 30–45 Minuten. Für Mutige gibt es Buchungen vor Ort, bei Wetter wetterabhängig.
cromwell-heritage: |
  Der Old Cromwell Heritage Precinct ist ein rekonstruiertes Goldgräberdorf am Lake Dunstan, mit kleinen Läden, Cafés und Kunsthandwerk. Der Spaziergang durch die Gassen dauert 30–60 Minuten und ist flach; am Seeufer gibt es Aussichten. In der Region sind Obststände mit Aprikosen, Pfirsichen und Äpfeln saisonal geöffnet, im März/April ist Saison. Der Parkplatz am Melmore Tce ist für Camper geeignet. Parken meist gratis; Läden prüfen, einige Betriebe haben kurze Öffnungszeiten.
wanaka-tree: |
  Der „That Wanaka Tree“ ist eine einzelne Weide, die im flachen Wasser des Lake Wanaka steht, mit Bergen im Hintergrund, und gilt als meistfotografierter Baum Neuseelands. Vom Parkplatz Roys Bay geht man etwa 5 Minuten über den Lakeside Path. Am schönsten bei Sonnenaufgang oder Sonnenuntergang; im Herbst sind die Farben der Umgebung zusätzlich intensiv. Wasserstand schwankt, bei niedrigem Pegel steht der Baum auf trockenem Boden. Nicht auf den Baum klettern. Parken in der Nähe ist begrenzt.
albert-town-campground: |
  Der Albert Town Campground liegt am Clutha River, wenige Minuten von Wanaka entfernt, mit Wiesen und alten Bäumen. Es gibt einfache Toiletten und Wasser, keine oder nur wenige Duschen; Strom meist nicht vorhanden. Die Gebühr liegt erfahrungsgemäß im niedrigen zweistelligen NZD-Bereich pro Person, bezahlt wird per Honesty Box oder Online-System. Ein Fluss-Spaziergang (Clutha River Track) ist direkt ab Platz möglich. Aufenthalt ist auf wenige Nächte begrenzt; Regeln vor Ort prüfen.
wanaka-holiday-park: |
  Der Wanaka Holiday Park ist ein Campingplatz in Stadtnähe, eine Alternative zu den verbotenen Freedom-Plätzen am See. Er bietet Stellplätze mit Strom, Duschen, Küche und Waschmaschinen. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich. Früh buchen, besonders in den Ferien. Von hier erreicht man den See und das Zentrum in kurzer Zeit.
mt-iron-parkplatz: |
  Der Mt Iron Track ist ein Rundweg von etwa 4,5 km (ca. 1,5 Stunden) mit rund 240 Hm Anstieg auf einen Hügel nahe Wanaka. Oben hat man einen weiten Blick auf Lake Wanaka, Lake Hawea und die Berge. Der Weg ist teilweise steinig, aber gut markiert, mit festem Schuhwerk machbar. Am besten morgens oder abends, wenn es kühler ist. Der Parkplatz an der SH84 hat Platz für Camper. Hunde nur an der Leine.
lake-hawea-lookout: |
  Der Lookout am SH6 oberhalb von Lake Hawea gibt einen weiten Blick auf den türkisblauen See und die umgebenden Berge. Vom Parkplatz sind es nur wenige Schritte zum Aussichtspunkt, kein Wanderweg nötig. Der Halt dauert 10–15 Minuten. Am besten bei klarem Wetter, morgens oder am späten Nachmittag. Die Straße ist asphaltiert und für Camper geeignet.
blue-pools: |
  Die Blue Pools im Haast-Pass-Gebiet sind glasklare, blaugrüne Becken im Makarora River. Der Weg ist etwa 1,5 km hin und zurück (rund 30–45 Minuten), flach und führt durch Südbuchenwald über zwei Hängebrücken. Im Sommer springen Mutige vom Ufer ins eiskalte Wasser, bei Regen kann der Fluss trüb werden. Der Parkplatz ist für Camper geeignet. Am Morgen ist es ruhiger und das Licht besser. Sandflies sind möglich.
fantail-falls: |
  Der Fantail Falls ist ein Wasserfall am Haast Pass, nur wenige Minuten vom Parkplatz entfernt über einen kurzen, flachen Weg. Das Wasser fächert sich beim Fallen wie ein Pfauenschwanz. Ein schneller Fotostopp, besonders nach Regen eindrucksvoll. Der Parkplatz ist klein, die Straße asphaltiert. Sandflies möglich.
thunder-creek-falls: |
  Thunder Creek Falls stürzt rund 28 m in einen Pool am Haast Pass. Vom Parkplatz geht man nur wenige Minuten über einen kurzen Weg zur Aussichtsplattform. Bei viel Regen ist der Wasserfall besonders mächtig und der Weg kann nass sein. Ein kurzer Stopp auf der Fahrt zur Westküste, gut mit den Fantail Falls kombinierbar. Sandflies möglich.
lake-paringa-doc: |
  Der DOC-Platz am Lake Paringa liegt am See im regenreichen Südwesten der Westküste, mit Blick auf Wasser und bewaldete Berge. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Die Gebühr liegt laut DOC im üblichen Bereich für Standard-Campsites; aktuell prüfen. Meist first come, first served. Sandflies sind sehr aktiv, Repellent mitnehmen. Spiegelungen am See sind bei Windstille am Morgen besonders schön.
haast-marks-road: |
  Marks Road in Haast ist eine Ortsstraße, für die kein offizieller Freedom-Platz in OSM bestätigt ist. Vor Ort Schilder und Regeln des Westland District Council prüfen. Als sichere Alternative gibt es Haast Lodge & Motor Park mit Strom, Duschen und Küche. Falls Freedom Camping erlaubt ist, nur self-contained mit grüner Plakette; Einrichtungen sind begrenzt.
ship-creek: |
  Ship Creek (Tauparikākā) liegt an der wilden Westküste und bietet zwei kurze Wege: den Dünen-Weg mit Aussicht auf das Meer und den Sumpfwald-Weg durch Kahikatea-Wald. Jeder Weg dauert rund 30 Minuten und ist flach, überwiegend auf Holzstegen. An der Küste sieht man oft Treibholz und Wellen. Bei Ebbe ist der Strand weit; Seebären gelegentlich. Der Parkplatz ist für Camper geeignet. Sandflies sind sehr aktiv.
lake-matheson: |
  Der Lake Matheson ist bekannt für spiegelglatte Reflexionen von Mount Cook und Mount Tasman, die sich bei Windstille im Wasser zeigen. Der Rundweg ist etwa 4,4 km lang (ca. 1,5 Stunden), flach und gut ausgebaut mit Holzstegen. Am besten bei Sonnenaufgang oder Sonnenuntergang, wenn der Wind gering ist; Reflexion ist wetterabhängig. Der Parkplatz hat Toiletten, ein Café befindet sich in der Nähe. Sandflies sind aktiv.
fox-glacier-top10: |
  Der Fox Glacier Top 10 Holiday Park liegt in Fox Glacier, nahe dem Lake Matheson und dem Dorf. Es gibt Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Ideal für einen Versorgungstag auf der Westküste. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Der Lake Matheson ist in wenigen Minuten erreichbar, daher gut für den Morgen.
franz-josef-heli-hike: |
  Der Heli-Hike auf dem Franz Josef Glacier startet mit einem Helikopterflug zum Gletscher, dort geht man 2–3 Stunden mit Guide und Steigeisen über das Eis, vorbei an blauen Spalten und Eishöhlen. Die Wege sind langsam und wetterabhängig, Touren fallen bei schlechter Sicht häufig aus. Vorab buchen, am besten mit flexibler Umbuchung. Anbieter laut Plan unbekannt; Büros liegen im Ort Franz Josef. Warme Kleidung und feste Schuhe nötig, Ausrüstung wird gestellt.
otto-macdonalds-doc: |
  Der DOC-Platz am Lake Mapourika liegt am See mit Wald und Bergen, nahe Franz Josef. Es gibt Toiletten und Wasser, kein Strom und keine Duschen. Die Gebühr liegt laut DOC im üblichen Bereich für Standard-Campsites; aktuell prüfen. Meist first come, first served. Sandflies sind aktiv, Repellent einpacken. Der See lädt zu einem kurzen Spaziergang am Ufer ein.
franz-josef-glacier-valley: |
  Der Glacier Valley Walk führt vom Parkplatz in rund 1,5 Stunden hin und zurück (ca. 5 km, flach) durch das Tal zu einem Aussichtspunkt auf den Franz Josef Glacier. Der Weg verläuft über Geröll und Stufen; das Betreten des Gletschers ist ohne Guide nicht erlaubt. Der Gletscher ist in den letzten Jahren stark zurückgegangen. Wetter prüfen: bei Regen sind Wasserfälle stark, aber Wege können gesperrt sein. Parkplatz für Camper geeignet.
okarito: |
  Okarito ist ein kleines Dorf an einer großen Lagune, mit Blick auf die Südalpen. Der Trig Walk ist etwa 2 km hin und zurück (ca. 1 Stunde) mit rund 100 Hm Anstieg und führt über einen steilen Pfad zum Aussichtspunkt. Bei Ebbe liegt die Lagune als Watt, bei Flut ist sie voller Wasser. Optional kann man die Lagune per Kajak erkunden. Es gibt mehrere Parkplätze. Sandflies sind aktiv.
hokitika-gorge: |
  Die Hokitika Gorge ist eine Schlucht, in der der Fluss durch Gletschermehl intensiv türkis leuchtet. Der Weg dauert etwa 1 Stunde (ca. 2 km), flach, mit einer Hängebrücke und Aussichtsplattformen. Die Farbe ist am schönsten bei Sonne und niedrigem Wasserstand; bei Regen kann das Wasser trüb sein. Die Zufahrt über eine schmale Straße ist asphaltiert. Parkplatz mit Toiletten. Sandflies möglich.
hokitika-beach-sign: |
  Der Strand von Hokitika ist bekannt für Treibholz und das große „Hokitika“-Schild aus Treibholz. Zum Sonnenuntergang färbt sich das Meer orange, ein guter Ort für einen entspannten Abendspaziergang. Der Strand ist ein breiter, dunkler Kiesstrand; Wellen und Strömungen sind stark, nicht baden. Das Schild liegt gleich am Strand, Parkplätze befinden sich in der Nähe. Der Ort hat Cafés und Kunsthandwerk.
lake-mahinapua-doc: |
  Der DOC-Platz am Lake Māhinapua liegt am See in dichtem Wald zwischen Hokitika und Ross. Es gibt Toiletten und Wasser, kein Strom und keine Duschen. Die Gebühr liegt laut DOC im üblichen Bereich für Standard-Campsites; aktuell prüfen. Meist first come, first served. Sandflies sind aktiv. Der See ist zum Spazieren und Fotografieren schön, mit Spiegelungen bei Windstille.
pancake-rocks: |
  Die Pancake Rocks von Punakaiki sind geschichtete Kalksteinformationen, die wie Pfannkuchenstapel aussehen. Der Rundweg dauert etwa 20–30 Minuten, ist flach und gut ausgebaut mit Aussichtsplattformen. Bei Flut und Wind schießen Blowholes Wasserfontänen hoch, deshalb Gezeiten prüfen und möglichst bei Flut kommen. Eintritt frei; Toiletten am Parkplatz. Parken kann voll werden, früh am Tag besser.
truman-track: |
  Der Truman Track führt in etwa 15 Minuten pro Strecke (insgesamt ca. 30 Minuten) durch Küstenwald zu einem Aussichtspunkt mit Meerblick und einem kleinen Wasserfall. Der Weg ist gut ausgebaut mit einigen Stufen. Der Strand ist wild und dramatisch, die Wellen sind stark. Der Parkplatz liegt direkt an der SH6. Ideal für einen kurzen Stopp.
punakaiki-beach-camp: |
  Das Punakaiki Beach Camp ist ein privater Campingplatz am Strand von Punakaiki, in Laufnähe zu den Pancake Rocks. Es gibt Stellplätze, Toiletten, Duschen und Küche; Strom meist vorhanden. Preise liegen erfahrungsgemäß im niedrigen bis mittleren zweistelligen NZD-Bereich. Buchung ratsam, besonders in den Ferien. Ein DOC-Platz existiert in Punakaiki nicht. Das Rauschen der Wellen begleitet die Nacht.
mcmillan-rd-punakaiki: |
  Der McMillan Rd Platz ist ein Self-Contained-Freedom-Camp bei Punakaiki. Nur für zertifiziert self-contained Fahrzeuge (grüne Plakette); Toiletten und Wasser sind begrenzt. Kostenlos, ohne Reservierung, first come, first served. Die erlaubte Nächtezahl ist begrenzt; Beschilderung prüfen. Der Platz ist einfach, aber nah an den Pancake Rocks.
cape-foulwind-tauranga-bay: |
  Der Cape Foulwind Walkway führt entlang der Küste zwischen Tauranga Bay und dem Leuchtturm. Vom Tauranga Bay Parkplatz geht man ca. 20 Minuten zur Neuseeländischen Seebären-Kolonie, die auf den Felsen ruht, besonders schön, wenn Jungtiere zu sehen sind. Der gesamte Walkway ist etwa 3,5 km einfach (ca. 1–1,5 Stunden), leicht bis mäßig. Abstand von mindestens 20 m zu den Tieren halten. Windig, warm anziehen.
carters-beach: |
  Carters Beach ist ein kleiner Küstenort bei Westport, mit weitem Strand. Ein konkreter Campingplatz ist nicht eindeutig bestätigt; Alternativen sind Westport Kiwi Holiday Park und Seal Colony Top 10 in der Nähe. Vor Ort Regeln und Schilder prüfen. Wenn Camping erlaubt, nur self-contained; Einrichtungen sind begrenzt.
westport-hp: |
  Der Seal Colony Top 10 Holiday Park liegt in Carters Beach und bietet Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Ideal für einen Versorgungstag vor den Nelson Lakes. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Der Strand ist in der Nähe.
buller-gorge-swingbridge: |
  Die Buller Gorge Swingbridge ist mit 110 m eine der längsten Hängebrücken Neuseelands. Man kann sie zu Fuß überqueren (Eintritt) und bietet Ausblick auf den Buller River. Optional gibt es Zipline und Seilfahrt, die kostenpflichtig sind. Der Parkplatz ist für Camper geeignet. Zeit einplanen: 30–60 Minuten. Preise laut Betreiber.
kerr-bay-doc: |
  Der DOC-Platz Kerr Bay liegt am Lake Rotoiti im Nelson Lakes National Park, mit Blick auf See und Berge. Vom Platz erreicht man den Steg am Kerr Bay und den kurzen Honeydew Walk (ca. 1 Stunde). Es gibt Toiletten, Wasser, keine Duschen; Strom nicht vorhanden. Gebühr laut DOC im üblichen Bereich; Buchung online empfohlen, besonders ab Schulferien (10.4.). Sandflies sind aktiv. Der See ist kalt und klar.
kaiteriteri: |
  Kaiteriteri Beach ist ein goldener Sandstrand mit klarem Wasser, Ausgangspunkt für Wassertaxis in den Abel Tasman National Park. Der Strand ist flach und zum Baden geeignet, im April kühl. Parken kostet Gebühr; Camper können in einigen Bereichen parken. Freedom Camping ist verboten. Ein kleines Café und Läden sind in der Nähe.
marahau-beach-camp: |
  Das Marahau Beach Camp liegt am Strand von Marahau, dem Eingang zum Abel Tasman National Park. Es gibt Stellplätze mit Strom, Duschen, Küche und Waschmaschinen. Freedom Camping in Marahau und Kaiteriteri ist verboten. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen, besonders in den Schulferien. Der Wanderweg des Abel Tasman Coast Track beginnt in der Nähe.
marahau-water-taxi: |
  Von Marahau fahren Wassertaxis entlang der Küste des Abel Tasman National Park, z. B. nach Anchorage oder Bark Bay. Man kann eine Strecke per Boot fahren und zurück zu Fuß gehen (ca. 12 km oder weniger). Der Küstenweg ist gut ausgebaut mit moderaten Steigungen. Unterwegs gibt es Robben in Felsbuchten, oft Seebären. Bootsfahrten und Kajaktouren vorab buchen. Wetter und Gezeiten beachten; Preise laut Anbieter.
hawkes-lookout: |
  Hawkes Lookout am Takaka Hill Highway (SH60) bietet einen weiten Blick auf das Tal und die Berge. Es gibt keinen separaten Parkplatz, nur eine Ausbuchtung an der Straße. Der Halt dauert 5–10 Minuten. Die Straße über den Takaka Hill ist kurvig und steil, Camper sollten langsam fahren. Bei Nebel entfällt die Aussicht.
te-waikoropupu-springs: |
  Te Waikoropūpū Springs ist die größte Süßwasserquelle Neuseelands, das Wasser gehört zu den klarsten der Welt. Der Rundweg dauert etwa 30–45 Minuten, ist flach und gut ausgebaut mit Holzstegen. Die Quelle ist heilig für Māori; Betreten oder Baden ist verboten. Der Parkplatz ist für Camper geeignet. Eintritt frei.
wainui-falls: |
  Der Wainui Falls Track führt in etwa 40 Minuten pro Strecke (insgesamt ca. 1,5 Stunden) durch Wald zu einem 20 m hohen Wasserfall. Der Weg ist flach bis leicht ansteigend mit einer Hängebrücke. Nach Regen kann der Weg schlammig sein. Der Parkplatz ist für Camper geeignet. Sandflies möglich.
collingwood-camping-ground: |
  Der Collingwood Camping Ground ist ein Gemeinde-Campingplatz, nah an Farewell Spit und Wharariki Beach. Es gibt Stellplätze, Toiletten, Duschen und Küche. Preise liegen erfahrungsgemäß im niedrigen bis mittleren zweistelligen NZD-Bereich. Buchung vorab prüfen. Ruhig, ideal für die Erkundung der Golden Bay.
pohara-beach-top10: |
  Der Pōhara Beach Top 10 Holiday Park liegt am Strand von Pōhara in der Golden Bay. Es gibt Stellplätze mit Strom, Duschen, Küche und Waschmaschine. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Der Strand ist ruhig und lädt zum Spaziergang ein.
farewell-spit-eco-tours: |
  Farewell Spit ist eine lange Sandbank im Norden der Südinsel, deren Zugang nur mit Tour möglich ist. Die Eco-Tour dauert etwa 6 Stunden, gezeitenabhängig, mit Besuch von Dünen, Leuchtturm und Strand. Tourbeginn ab Collingwood. Vorab buchen, Preise laut Anbieter. Ein Teil des Gebiets ist Vogelschutzgebiet; die Tour bietet jedoch auch viel Küstenlandschaft. Warme Kleidung mitnehmen.
wharariki-beach: |
  Wharariki Beach ist ein wilder Strand mit Dünen, Felsbögen (Archway Islands) und Felspools. Der Weg vom Parkplatz dauert ca. 20 Minuten pro Strecke (insgesamt ca. 2–3 km), flach über Weideland. Bei Ebbe sind Felspools zugänglich, in denen Robbenjunge spielen. Abstand von mindestens 20 m zu den Tieren halten. Zum Schwimmen ungeeignet wegen Strömungen. Der Wind ist stark, warm anziehen.
pelorus-bridge: |
  Pelorus Bridge ist ein Naturschutzgebiet mit kristallklarem Fluss und Waldwegen. Die Badestelle ist bekannt aus der Fass-Szene im Hobbit. Kurze Wege (z. B. Circle Walk, ca. 30 Minuten) sind flach. Im Sommer ist das Wasser kalt und klar. Der Parkplatz ist für Camper geeignet. Café vor Ort.
pelorus-bridge-doc: |
  Der DOC-Campground Pelorus Bridge liegt am Fluss im Waldreservat. Es gibt Toiletten, Duschen (teils gegen Gebühr), Wasser; Strom nicht vorhanden. Buchung online empfohlen, besonders in den Schulferien. Gebühr laut DOC im üblichen Bereich; aktuell prüfen. Ruhig, mit Vogelgesang am Morgen.
omaka-aviation: |
  Das Omaka Aviation Heritage Centre in Blenheim zeigt Weltkriegsflugzeuge in lebensechten Dioramen, gestaltet von Weta Workshop. Der Besuch dauert etwa 1,5–2 Stunden. Eintritt wird pro Person erhoben; Preise laut Betreiber. Gut für Regentage. Parkplatz ist für Camper geeignet. Café vor Ort.
ohau-point-lookout: |
  Ohau Point Lookout an der SH1 nördlich von Kaikōura bietet Blick auf eine Seebärenkolonie direkt unterhalb der Straße. Vom Parkplatz geht ein kurzer Weg zum Aussichtspunkt. Seebären liegen oft auf Felsen, im Winter sieht man Jungtiere unter einem Wasserfall. Abstand von mindestens 20 m einhalten. Der Halt dauert 15–20 Minuten. Der Parkplatz ist klein, an der SH1.
puhi-puhi-doc: |
  Der DOC-Campsite Puhi Puhi liegt ca. 6 km von der SH1 entfernt, etwa 9 km nördlich von Kaikōura, mit schmaler Zufahrt und teils Schotter. Es gibt Toiletten, Wasser; keine Duschen, kein Strom. Laut DOC first come, first served mit Campsite Pass. Campertauglichkeit vorher prüfen. Ruhig, mit Blick auf Berge und Meer.
kaikoura-freedom: |
  Der West End Car Park in Kaikōura ist ein ausgewiesener Freedom-Camping-Platz am Meer für zertifiziert self-contained Fahrzeuge (grüne Plakette, ab 7.6.2026). Maximal ca. 10 Fahrzeuge, markierte Plätze, Toiletten in der Nähe, keine Duschen. Kostenlos, first come, first served. Die Nächtezahl ist begrenzt; Beschilderung prüfen. Nah an Läden und Cafés, aber nachts kann es laut sein.
kaikoura-top10: |
  Der Kaikōura Top 10 Holiday Park liegt in der Beach Rd und bietet Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Gut für einen Versorgungstag. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen, besonders in den Schulferien. Strand und Zentrum sind in wenigen Minuten erreichbar.
whale-watch-kaikoura: |
  Whale Watch Kaikōura bietet Bootstouren zu Pottwalen, die im Kaikōura Canyon leben. Die Tour dauert etwa 2,5–3 Stunden; oft sieht man auch Delfine und Seebären. Bei schlechtem Wetter fallen Touren aus; bei Ausfall Erstattung oder Umbuchung laut Anbieter. Frühtouren haben oft ruhigeres Wasser. Vorab buchen. Check-in an der Whaleway Station, Parkplatz vor Ort.
kaikoura-peninsula-point-kean: |
  Der Kaikōura Peninsula Walkway führt entlang der Küste, vorbei an Seebärenkolonie am Point Kean. Der gesamte Rundweg ist etwa 11,5 km (3,5 Stunden), kann aber gekürzt werden (z. B. Point Kean bis Whalers Bay, ca. 1–1,5 Stunden). Wege sind teils Treppen, moderat. Seebären nur aus mindestens 20 m Abstand betrachten. Parkplatz am Point Kean.
weingut-blenheim: |
  Allan Scott Family Winemakers in Marlborough bietet Weinprobe im Cellar Door und Mittagsmenü im Bistro. Der Fahrer sollte nicht trinken; Fahrer-Optionen wie Wasser. Cellar Door ist etwa 10–17 Uhr geöffnet, Bistro mittags. Winteröffnungszeiten sind reduziert, vorher prüfen. Reservierung empfohlen. Landschaft mit Weinbergen.
queen-charlotte-drive: |
  Der Queen Charlotte Drive zwischen Havelock und Picton windet sich entlang der Marlborough Sounds mit vielen Aussichtspunkten. Der Cullen Point Lookout bietet einen Blick auf den Hafen von Havelock. Die Straße ist kurvig und schmal, Camper sollten langsam fahren. Fahrzeit etwa 1,5 Stunden ohne Stopps. Mehrere Haltebuchten laden zu Fotos ein.
momorangi-doc: |
  Der DOC-Campsite Momorangi Bay liegt am Queen Charlotte Drive an einer ruhigen Bucht der Marlborough Sounds. Es gibt Toiletten, Wasser, Duschen (ggf. gegen Gebühr); Strom nicht vorhanden. Gebühr laut DOC im üblichen Bereich; Buchung empfohlen. Von hier sind es etwa 15 Minuten bis zur Fähre in Picton. Sandflies möglich.
picton-hp: |
  Der Picton Tasman Holiday Park (früher Top 10) liegt an der Waikawa Rd, nahe der Fähre. Es gibt Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Ideal für Wäsche vor der Überfahrt. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Alternative: Alexanders Holiday Park.
mt-victoria-lookout: |
  Mt Victoria Lookout bietet den besten Panoramablick auf Wellington, den Hafen und die umliegenden Hügel. Die Straße ist schmal und steil, für große Camper evtl. ungeeignet. Alternativ per Bus oder zu Fuß. Abends ist der Blick besonders schön. Der Halt dauert 15–30 Minuten. Parkplatz klein.
evans-bay-marina: |
  Evans Bay Marina ist ein Freedom-Camping-Parkplatz in Wellington (ca. 50 Plätze) am Cobham Drive, nur für zertifiziert self-contained Fahrzeuge. Direkt daneben gibt es eine kostenlose Dump Station. Toiletten in der Nähe, keine Duschen. Kostenlos, first come, first served; Nächtezahl begrenzt. Nicht bestätigt, ob aktuell geöffnet. Alternative Wellington Top 10.
wellington-top10: |
  Der Wellington Top 10 Holiday Park liegt im Hutt Park in Moera. Es gibt Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Zug oder Bus ins Zentrum möglich.
te-papa-parkplatz: |
  Te Papa ist Neuseelands Nationalmuseum mit Ausstellungen zu Natur, Kultur und Geschichte. Der Eintritt ist frei, einzelne Sonderausstellungen kosten. Die Tiefgarage hat Höhenlimit (~2,1 m), daher mit Camper den Barnett Street Car Park nutzen (offene Fläche, kostenpflichtig), ca. 150 m entfernt. Besuch dauert 2–3 Stunden.
wellington-cable-car: |
  Die Cable Car fährt von der Lambton Quay zum Botanischen Garten und bietet Blick auf die Stadt. Fahrt dauert etwa 5 Minuten. Im Botanischen Garten kann man bergab spazieren (ca. 30–60 Minuten). Kein Camper-Parkplatz in der Nähe; Camper bei Barnett St oder Evans Bay parken und Bus oder Fuß nutzen. Tickets vor Ort.
weta-cave: |
  Die Wētā Cave in Miramar zeigt Requisiten und Modelle aus Filmen wie Herr der Ringe. Touren dauern ca. 45–60 Minuten, vorab buchen. Fotografie ist teilweise eingeschränkt. Parken nur an der Straße (kostenlos, begrenzt). Preise laut Betreiber.
kaitoke-rivendell: |
  Der Kaitoke Regional Park nördlich von Upper Hutt war Drehort für Bruchtal (Rivendell) in Der Herr der Ringe. Vom Hauptparkplatz sind es nur wenige Minuten zum Pakuratahi-Fluss und zur Waldlichtung, die als Kulisse diente; Tafeln zeigen die Szenen. Ein kurzer Spaziergang am Fluss dauert 20–30 Minuten und ist flach. Der Eintritt ist frei, der Umweg über den SH2 beträgt nur wenige Kilometer. Im Sommer lädt der Fluss zum Baden ein. Der Parkplatz ist für Camper problemlos geeignet.
putangirua-pinnacles-carpark: |
  Die Pūtangirua Pinnacles sind hohe, zackige Erosionssäulen aus Kies und Lehm, die in Der Herr der Ringe als Pfad der Toten (Dimholt Road) auftauchen. Vom Parkplatz folgt man dem Flussbett etwa 1–1,5 Stunden zum Aussichtspunkt, den kurzen Rundweg zurück über einen Grat gibt es ebenfalls; zusammen je nach Variante 2–3 Stunden, ohne große Steigungen. Der Boden ist Kies und kann nach Regen matschig sein. Die Zufahrt über die Cape Palliser Rd ist teils Schotter. Wetter und Flusspegel prüfen.
cape-palliser-seals: |
  An der Cape Palliser Rd liegt eine der größten Seebärenkolonien der Nordinsel direkt am Straßenrand. Die Tiere ruhen auf den Felsen, Jungtiere tollen oft in Gezeitentümpeln, ein Erlebnis für Meeressäuger-Fans. Abstand von mindestens 20 m halten, Fluchtweg zum Meer nie versperren. Die Straße ist teils Schotter, aber relativ kurz. Eine Schotterstrecke und Wind erwarten. Ein Stück weiter beginnt die Treppe zum Leuchtturm mit rund 250 Stufen.
putangirua-doc-campsite: |
  Der DOC-Campsite beim Pūtangirua Pinnacles Parkplatz liegt in einer weiten, trockenen Landschaft an der Küste. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Die Zufahrt führt über die Cape Palliser Rd, teilweise Schotter, mit Furten bei Regen; Wetter prüfen. Gebühr laut DOC im üblichen Bereich; meist first come, first served. Sehr ruhig, mit Sternenhimmel.
castlepoint-lighthouse: |
  Castlepoint ist ein markanter Küstenort mit Leuchtturm auf einem Riff, Castle Rock und Deliverance Cove. Vom Strandparkplatz führt der Lighthouse Track in etwa 30–45 Minuten hin und zurück (ca. 2 km), flach bis mäßig, mit Aussicht auf Wellen und Küste. Bei Flut ist der Weg teilweise nass. Windig, warm anziehen. Der Parkplatz ist für Camper geeignet. Abends schöne Stimmung.
castlepoint-freedom: |
  Der Freedom-Camping-Parkplatz Castlepoint hat rund 34 Plätze für self-contained Fahrzeuge, direkt am Strand. Toiletten in der Nähe, keine Duschen. Kostenlos, first come, first served; Nächtezahl begrenzt, Beschilderung prüfen. Der Platz ist zugleich Parkplatz für den Lighthouse Track. Alternative ist der Castlepoint Campground (Council). Windig, aber mit Meerblick und Sternenhimmel.
te-mata-peak-summit: |
  Te Mata Peak bei Havelock North bietet einen Rundumblick über Hawke's Bay, die Küste und bei klarem Wetter bis zu den Bergen im Landesinneren. Die Gipfelstraße ist schmal und kurvig, für große Camper nicht ideal; langsam fahren, Ausweichstellen nutzen. Am Gipfel gibt es einen Parkplatz und kurze Wege zu Aussichtspunkten. Am schönsten am Abend oder Morgen. Windig, warm anziehen.
perfume-point-napier: |
  Perfume Point (Te Karaka) liegt am Hafen Ahuriri in Napier, mit Blick auf das Wasser. Es ist ein Freedom-Camping-Parkplatz für self-contained Fahrzeuge mit wenigen Plätzen. Die Regeln in Napier werden verschärft (laut Bylaw evtl. nur 1 Nacht); Schilder vor Ort prüfen. Toiletten in der Nähe, keine Duschen. Alternative Westshore Beach Reserve oder Napier Beach Top 10.
napier-beach-top10: |
  Der Napier Beach Top 10 Holiday Park liegt in der Gill Rd am Strand, mit Stellplätzen mit Strom, Duschen, Küche, Waschmaschine und Trockner. Ideal für einen Versorgungstag. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Das Zentrum ist in kurzer Fahrt erreichbar.
napier-art-deco-centre: |
  Napier wurde nach dem Erdbeben 1931 im Art-Deco-Stil wieder aufgebaut. Das Art Deco Centre in der Tennyson Street bietet Führungen (ca. 1,5 Stunden) durch die Altstadt mit bunten Fassaden. Alternativ lässt sich die Stadt auch allein mit Karte erkunden. Parken am Herschell St Public Car Park (offene Fläche) oder an der Marine Parade. Touren vorab buchen; Preise laut Anbieter.
gannet-safaris-te-awanga: |
  Gannet Safaris Overland bringt Besucher von Te Awanga zum Cape Kidnappers mit einer Tölpelkolonie auf den Klippen (Vögel; für euch ggf. optional). Die Tour dauert etwa 4–5 Stunden und führt über Strand und Privatland. Saison ist laut Anbieter September bis April. Vorab buchen, Preise laut Anbieter. Die Küstenlandschaft mit weißen Klippen ist auch ohne Vogelinteresse eindrucksvoll. Parkplatz am Startpunkt ist groß.
huka-falls-carpark: |
  Die Huka Falls sind ein Wasserfall, bei dem der Waikato River durch eine enge Schlucht schießt und mit enormer Wucht in einen türkisen Pool stürzt. Vom Parkplatz geht man in wenigen Minuten zur Brücke mit Aussichtsplattformen. Ein längerer Weg am Fluss ist möglich (ca. 1–2 Stunden), aber nicht nötig. Der Parkplatz ist für Camper geeignet; Eintritt frei. Am besten morgens oder abends, wenn weniger Reisende da sind.
spa-park-hot-pools: |
  Im Spa Thermal Park mündet ein natürlicher heißer Bach (Otumuheke) in den Waikato River. Man geht etwa 10 Minuten vom Parkplatz zu den Becken, Baden ist kostenlos. Die Temperatur des Wassers variiert je nach Flusspegel; bei Hochwasser kann es überspült sein. Besser abends bei Dämmerung oder morgens. Badekleidung und Handtuch mitnehmen. Auf Wertsachen achten.
reids-farm-taupo: |
  Reid's Farm ist ein kostenloser Campsite (Hipapatua Recreation Reserve) des Taupō District Council in der Nähe der Huka Falls. Laut Bylaw 2023 ist er der einzige Platz, auch für nicht-self-contained Fahrzeuge. Toiletten sind vorhanden, keine Duschen. Ein Blog meldet eine vorübergehende Schließung; aktuell beim Taupō DC prüfen. Der Platz ist einfach, ruhig, mit Zugang zum Fluss. Nächtezahl begrenzt.
taupo-top10: |
  Der Taupo Top 10 Holiday Park bietet Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner, ideal als Ausweichplatz. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Thermalbecken sind in manchen Parks vorhanden. Zentrum erreichbar.
craters-of-the-moon: |
  Craters of the Moon ist ein Thermalgebiet mit dampfenden Kratern und fauchenden Fumarolen auf einer Mondlandschaft. Ein Holzsteg-Rundweg dauert etwa 45 Minuten, flach, mit Aussichtsplattformen. Eintritt wird erhoben (Honesty Box bzw. Kasse), Preis laut Betreiber. Dampf und Schwefelgeruch sind normal; auf den Wegen bleiben. Parkplatz für Camper geeignet.
mine-bay-cruise-taupo: |
  Die Bootsfahrt zu den Mine-Bay-Felsschnitzereien dauert rund 1,5–2 Stunden und führt über den Lake Taupō zu einem 14 m hohen Maori-Gesicht, das in den Fels gehauen wurde, in den 1970ern. Vom Wasser aus sieht man auch die Berge Tongariro, Ngauruhoe und Ruapehu. Morgens ist es meist ruhiger. Vorab buchen, Preise laut Anbieter. Kostenloser Parkplatz am Hafen.
taupo-floatplane: |
  Ein Rundflug mit dem Wasserflugzeug über den Lake Taupō und die Vulkane Tongariro, Ngauruhoe und Ruapehu dauert 20–60 Minuten und zeigt die Landschaft von oben. Nur bei klarer Sicht und gutem Wetter; Absagen sind häufig. Vorab buchen mit flexibler Umbuchung. Start am Bootshafen; Alternative Rundflug ab Taupō Airport.
whakapapa-visitor-centre: |
  Das Whakapapa Visitor Centre im Tongariro National Park ist Startpunkt für den Taranaki Falls Loop: ca. 6 km, 2 Stunden, rund 150 Hm, mäßig. Er führt durch Tussock und Wald zu einem 20 m hohen Wasserfall mit Blick auf den Ruapehu. Bei Wind oder Regen kann das Wetter schnell wechseln. Parkplatz für Camper geeignet. Das Besucherzentrum bietet Infos zu Wetter und Wegen.
tawhai-falls-carpark: |
  Tawhai Falls (Gollum's Pool) ist ein Wasserfall am SH48, der im Film als Gollums Teich diente. Der Weg dauert etwa 20 Minuten hin und zurück, leicht durch Wald. Der Parkplatz ist für Camper geeignet. Bei Regen können Wege nass sein. Ein schneller Stopp.
mangahuia-doc: |
  Der DOC-Campsite Mangahuia liegt an der SH48 nahe Whakapapa bzw. National Park (ca. 35 km von Ohakune), nicht bei Ohakune. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Gebühr laut DOC im üblichen Bereich; meist first come, first served. Ruhig im Wald, mit Blick auf die Vulkane. Nachts kann es kalt werden.
whakapapa-holiday-park: |
  Der Whakapapa Holiday Park liegt in Whakapapa Village im Tongariro National Park. Es gibt Stellplätze mit Strom, Duschen, Küche und Waschmaschine. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen, besonders in Ferien. Wanderwege starten in der Nähe. Nachts kalt.
waitomo-glowworm-caves: |
  Die Waitomo Glowworm Caves sind Kalksteinhöhlen, in denen Tausende Glühwürmchen die Decke wie einen Sternenhimmel beleuchten. Die Tour dauert etwa 45–60 Minuten, mit einer Bootsfahrt durch die Grotte. Die Zeitslots sind begrenzt, daher vorab online buchen. Fotografieren ist verboten. Kundenparkplatz am Visitor Centre. Preise laut Betreiber.
ruakuri-bush-walk: |
  Der Ruakuri Bush Walk führt durch Wald und über Höhleneingänge, nach Einbruch der Dunkelheit sieht man wilde Glühwürmchen entlang des Weges, gratis. Der Rundweg ist etwa 2 km (ca. 45–60 Minuten), leicht bis mäßig mit Stufen. Taschenlampe mitnehmen, aber auf Glühwürmchen nicht leuchten. Parkplatz B für Camper geeignet. Rutschig bei Regen.
waitomo-top10: |
  Der Waitomo Top 10 Holiday Park liegt im Waitomo Caves Village, nahe den Höhlen. Es gibt Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Glühwürmchen sind teilweise im Park zu sehen.
waitomo-roselands: |
  Roselands Waitomo Caves ist ein privates Gelände mit Self-Contained-Freedom-Camping. Konditionen und Preise vor Ort prüfen. Alternative ist der Waitomo Top 10 Holiday Park. Einrichtungen sind begrenzt (Toiletten, evtl. Wasser). Ruhig, nahe den Höhlen.
mangapohue-natural-bridge: |
  Die Mangapohue Natural Bridge ist ein natürlicher Kalksteinbogen über einem Bach. Der Weg dauert etwa 20 Minuten hin und zurück, flach, mit Stufen. Die Te Anga Rd ist teilweise Schotter. Der Parkplatz ist für Camper geeignet. Bei Regen rutschig.
marokopa-falls: |
  Marokopa Falls ist ein 35 m hoher, breiter Wasserfall. Vom Parkplatz geht man etwa 10 Minuten pro Strecke durch Wald, mit Stufen. Die Te Anga Rd ist teilweise Schotter. Nur wenn Zeit bis zur Abfahrt am Nachmittag bleibt. Bei Regen rutschig.
hobbiton-shires-rest: |
  Die Hobbiton Evening Banquet Tour dauert etwa 4,5 Stunden: geführter Rundgang durch das Auenland mit Hobbit-Höhlen, abendliche Laternen, anschließend Bankett im Green Dragon Inn. Abfahrt der Busse am Shires Rest, 15 Minuten vor Tourbeginn da sein. Ein Getränk ist inklusive. Tickets früh buchen. Kostenloser Parkplatz für Kunden. Warme Kleidung mitnehmen.
opal-hot-springs-hp: |
  Der Opal Hot Springs Holiday Park liegt ca. 10 Minuten von Hobbiton entfernt, mit Thermalbecken, Stellplätzen mit Strom, Duschen, Küche und Waschmaschine. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Ruhig, ländlich, ideal nach dem Hobbiton-Abend.
pohlen-park-matamata: |
  Pohlen Park in Matamata ist ein ausgewiesener Freedom-Camping-Platz für self-contained Fahrzeuge. Laut MPDC-Bylaw gelten Nächtebegrenzungen; Beschilderung prüfen. Toiletten in der Nähe, keine Duschen. Kostenlos, first come, first served. Alternative Plätze sind Hetana St Reserve und Wairere Falls Carpark.
kuirau-park: |
  Kuirau Park in Rotorua ist ein Stadtpark mit brodelnden Schlammlöchern, dampfenden Teichen und einem kostenlosen Thermal-Fußbad. Spaziergang 30–60 Minuten, flach. Absperrungen beachten, nicht an Dampflöcher treten. Abends zeigt sich der Dampf besonders stimmungsvoll. Der Parkplatz bei den Footbaths ist kostenlos. Schwefelgeruch ist normal.
redwoods-whakarewarewa: |
  Der Redwoods Whakarewarewa Forest hat hohe kalifornische Mammutbäume, Rundwege und den Treewalk (Hängebrücken in den Baumkronen), abends beleuchtet. Kurze Wege dauern 30–60 Minuten, flach bis leicht hügelig. Treewalk kostet Eintritt, Tickets vorab prüfen. Der Wald ist auch bei Regen schön. Parkplatz am Visitor Centre, Camper geeignet.
lake-okareka-doc: |
  Der DOC-Campsite Lake Ōkāreka liegt am See im Wald bei Rotorua. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Gebühr laut DOC im üblichen Bereich; Buchung empfohlen. Ruhig, mit Seeblick. Sandflies selten. Der See lädt zu einem kurzen Spaziergang ein.
rotorua-government-gardens-cp: |
  Das Government Gardens Motorhome Parking in Rotorua bietet 17 Plätze für self-contained Fahrzeuge, kostenlos. Seit 7.6.2026 ist die grüne Plakette nötig. Maximal 2 Nächte laut Quelle (Beschilderung prüfen). Toiletten in der Nähe, keine Duschen. Zentral, nah an Parks und Sehenswürdigkeiten. Schwefelgeruch möglich.
wai-o-tapu-entrance: |
  Wai-O-Tapu Thermal Wonderland ist ein Thermalgebiet mit farbigen Pools, dem Champagne Pool und dem Lady Knox Geysir, der täglich gegen 10:15 Uhr ausbricht. Rundwege dauern 1,5–2 Stunden, flach. Eintritt wird erhoben, Preis laut Betreiber. Früh kommen, um den Geysir zu sehen. Schwefelgeruch ist normal. Parkplatz für Camper geeignet.
te-puia-entrance: |
  Te Puia in Rotorua zeigt den Pōhutu-Geysir und Māori-Kultur mit Schnitzschule und Kiwi-Haus. Rundgang dauert 2–3 Stunden. Der Geysir bricht mehrmals täglich aus. Eintritt wird erhoben; Preis laut Betreiber. Parkplatz 1 oder 2 für Camper geeignet.
mount-maunganui-base-track: |
  Der Base Track um Mauao (Mount Maunganui) ist etwa 3,5 km lang (ca. 1 Stunde), flach, an der Küste entlang. Bei Ebbe sieht man Felsen und Meer. Der Aufstieg zum Gipfel ist optional (ca. 3,5 km hin und zurück, ca. 200 Hm). Der Parkplatz am Fuß ist für Camper geeignet, kann voll sein. Hot Pools in der Nähe.
hahei-beach-resort: |
  Das Hahei Beach Resort ist ein Campingplatz direkt am Strand. Freedom Camping in Hahei ist verboten. Es gibt Stellplätze, Toiletten, Duschen, Küche und Waschmaschine. Preise liegen erfahrungsgemäß im höheren zweistelligen NZD-Bereich; früh buchen. Alternative Hot Water Beach Top 10.
hot-water-beach-carpark: |
  Am Hot Water Beach sprudelt heißes Wasser durch den Sand. Etwa 2 Stunden vor bis nach Niedrigwasser gräbt man sich seinen eigenen Pool; Schaufel kann man leihen. Gezeiten vorab prüfen. Parkplatz kostet Gebühr. Starke Strömungen, nicht schwimmen. Heißes Wasser stellenweise sehr heiß.
cathedral-cove-hahei: |
  Cathedral Cove (Mautohe) ist ein Strand mit großem Felsbogen. Der Hauptweg ist laut DOC geöffnet; Seitenwege wie Gemstone Bay sind teilweise geschlossen, daher aktuellen Status auf der DOC-Seite prüfen. Der Weg ist ca. 2,5 km einfach (45–60 Minuten) mit Stufen. Parkplatz am Hahei Visitor Car Park oder Gateway Trail Car Park. Bei Regen Erdrutschgefahr.
driving-creek-railway: |
  Die Driving Creek Railway in Coromandel Town ist eine Schmalspurbahn durch Wald, entstanden aus einer Töpferei. Fahrt dauert etwa 1 Stunde, mit Aussichtspunkt. Tickets vorab buchen, Preise laut Betreiber. Parkplatz an der Driving Creek Rd. Gut für Regentage.
kauaeranga-doc: |
  Der DOC-Campsite Kahikatea im Kauaeranga Valley liegt am Fluss im Wald. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Gebühr laut DOC im üblichen Bereich; Buchung empfohlen. Ruhig, mit Vogelgesang. Weitere DOC-Plätze im Tal: Shag Stream, Trestle View.
thames-danby-field: |
  Danby Field in Thames ist ein kostenloser Freedom-Camping-Platz des TCDC. Toiletten in der Nähe, keine Duschen. Kostenlos, first come, first served; Nächtezahl begrenzt. Alternative Thames Bowling Club (nur SC, max. 2 Nächte). Einfach, nah an Thames.
goat-island-marine-reserve: |
  Das Goat Island Marine Reserve bei Leigh war Neuseelands erstes Meeresschutzgebiet. Man kann schnorcheln oder mit dem Glasbodenboot Fische und Kelp-Wälder sehen. Bei klarem Wasser und ruhiger See am besten, morgens. Equipment vor Ort leihbar. Parkplatz für Camper geeignet. Wasser kalt.
te-arai-sc-campground: |
  Der Te Ārai SC-Campground von Auckland Council ist ausgewiesen, kostenpflichtig, mit Buchung. Nur für self-contained Fahrzeuge. Toiletten vorhanden, keine Duschen. Freedom Camping in Rodney ist stark eingeschränkt. Buchung vorab prüfen. Strandnähe.
uretiti-doc: |
  Der DOC-Campsite Uretiti Beach liegt an einem langen Sandstrand bei Ruakākā. Es gibt Toiletten und Wasser, Duschen teilweise, kein Strom. Gebühr laut DOC; Buchung empfohlen. Strand ideal für Spaziergänge. Sandflies möglich.
whangarei-falls: |
  Whangārei Falls ist ein 26 m hoher Wasserfall im Wald. Der Weg vom oberen Parkplatz ist kurz (ca. 10 Minuten), mit Stufen; der Rundweg um den Fall dauert ca. 30–40 Minuten. Der Fall ist nach Regen am besten. Parkplatz für Camper geeignet.
waitangi-treaty-grounds: |
  Waitangi Treaty Grounds ist der Ort, an dem 1840 der Vertrag von Waitangi unterzeichnet wurde. Besuch dauert 2–3 Stunden, mit Führungen, Māori-Kulturshow und Kriegskanu. Eintritt wird erhoben, Preise laut Betreiber. Parkplatz für Camper geeignet.
seaview-camper-park-paihia: |
  Der Seaview Camper Van Park in Paihia ist ein einfacher Platz für self-contained Camper, ca. 15 NZD pro Person. Toiletten, evtl. Duschen. Freedom Camping in Paihia ist verboten. Günstig, nah am Ort. Buchung prüfen.
paihia-top10: |
  Der Paihia Top 10 Holiday Park bietet Stellplätze mit Strom, Duschen, Küche, Waschmaschine und Trockner. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen. Nah am Zentrum.
russell-top10: |
  Der Russell Top 10 Holiday Park ist ruhiger, in Russell, erreichbar per Autofähre Opua–Okiato. Stellplätze mit Strom, Duschen, Küche. Preise liegen erfahrungsgemäß im mittleren zweistelligen NZD-Bereich; früh buchen.
paihia-wharf-hole-in-the-rock: |
  Vom Paihia Wharf starten Bootstouren zum Hole in the Rock, einem Felsbogen, durch den Boote fahren. Delfine können gesichtet werden. Tour dauert ca. 3–4 Stunden; vorab buchen, Preise laut Anbieter. Von hier fährt auch die Personenfähre nach Russell. Parkplatz kostenlos mit Zeitlimit.
rainbow-falls-kerikeri: |
  Rainbow Falls ist ein 27 m hoher Wasserfall bei Kerikeri. Der Aussichtspunkt ist nur wenige Minuten vom Parkplatz; der Kerikeri River Track bietet längere Wege (ca. 4,6 km einfach). Nach Regen am besten. Parkplatz für Camper geeignet.
maitai-bay-doc: |
  Der DOC-Campsite Maitai Bay liegt in einer Bucht auf der Karikari-Halbinsel. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Gebühr laut DOC; Buchung empfohlen. Strand für Baden und Schnorcheln. Die Zufahrt ist teils Schotter.
te-paki-sand-dunes: |
  Die Te Paki Giant Sand Dunes sind hohe Sanddünen, die man mit Bodyboard hinunterrutschen kann. Verleih vor Ort. Aufstieg ist anstrengend. Die Te Paki Stream Rd ist teils Schotter; auf den Ninety Mile Beach darf nicht gefahren werden. Windig, Sand überall.
cape-reinga-lighthouse: |
  Cape Reinga ist die Nordwestspitze, wo Tasmanische See und Pazifik aufeinandertreffen. Vom Parkplatz geht man ca. 20 Minuten (1 km) zum Leuchtturm, mit Treppen. Windig, warm anziehen. Heiliger Ort der Māori. Parkplatz für Camper geeignet. Sonnenuntergang schön.
tapotupotu-doc: |
  Der DOC-Campsite Tapotupotu liegt in einer Bucht nahe Cape Reinga. Es gibt Toiletten und Wasser, kein Strom, keine Duschen. Gebühr laut DOC; Buchung empfohlen. Die Zufahrt ist teils Schotter. Strand zum Spazieren.
tane-mahuta: |
  Tāne Mahuta ist der größte bekannte Kauri-Baum, über 2.000 Jahre alt. Vom Parkplatz sind es nur 2 Minuten zu Fuß. Der Weg ist flach und kurz. Kostenlos. Parkplatz für Camper geeignet. Bitte nicht Wurzeln betreten, Schuhe reinigen (Kauri-Dieback).
trounson-kauri-park: |
  Der Trounson Kauri Park hat einen kurzen Kauri Walk (ca. 40 Minuten), flach, im Urwald. Nachts sind Kiwi-Rufe möglich (Vögel; optional). Schuhe reinigen. Parkplatz am Campground.
trounson-doc: |
  Der DOC-Campground Trounson Kauri Park liegt im Urwald. Es gibt Toiletten, Wasser, Duschen; kein Strom. Gebühr laut DOC; Buchung empfohlen. Ruhig, mit Nachtgeräuschen. Sandflies möglich.
kai-iwi-taharoa: |
  Der Taharoa Domain Campsite am Kai Iwi Lakes ist ein Campingplatz an türkisen Süßwasserseen mit weißem Sand. Toiletten, Duschen teilweise. Kostenpflichtig, Buchung prüfen. Alternative Pine Beach Camp Ground. Baden im See möglich.
muriwai-gannet-colony: |
  Muriwai Beach ist ein schwarzer Surfstrand mit Klippen. Die Tölpelkolonie (Vögel; optional) liegt auf den Klippen, Aussichtsplattformen. Weg ca. 20 Minuten. Der Strand ist weit und windig. Parkplatz für Camper geeignet.
ambury-campground: |
  Der Ambury Regional Park Campground von Auckland Council ist ein Farm-Campingplatz mit ca. 60 Plätzen, ca. 15 Minuten vom Flughafen. Kostenpflichtig, vorab buchen. Toiletten, Duschen, Strom evtl. Tiere auf dem Gelände. Ideal für die letzte Nacht.
mt-eden: |
  Maungawhau / Mount Eden ist ein Vulkankegel in Auckland mit Krater und Blick auf die Stadt. Gipfelstraße für Autos gesperrt; mit Taxi oder Bus anfahren oder zu Fuß (ca. 20–30 Minuten, ca. 100 Hm). Sonnenuntergang schön. Am Rückgabetag ohne Camper erkunden.
