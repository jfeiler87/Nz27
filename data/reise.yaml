fixpunkte:
  - datum: "Di 16.03. 20:45"
    was: "Abflug Düsseldorf EK 58 → Dubai → EK 412 (via Sydney) → Christchurch; Ankunft voraussichtlich Do 18.03. ~14:00 (in Emirates-App prüfen)"
