<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITEL__</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2a2e;--muted:#5d6b70;--line:#e3ded3;--acc:#0f6d6a;--acc2:#c2571a;--warn:#a15c00;--sea:#dfecef;--land:#efe9da;--route:#c2571a;--opt:#6b5ca5}
@media (prefers-color-scheme:dark){:root{--bg:#141a1c;--card:#1d2528;--ink:#e8ecec;--muted:#9aa8ac;--line:#2e383b;--acc:#4fc1b9;--acc2:#f0965a;--warn:#e0a24a;--sea:#17262b;--land:#263235;--route:#f0965a;--opt:#a99be0}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
nav#side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:12px 0}
nav#side h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 16px 6px}
nav#side a{display:flex;gap:10px;padding:7px 16px;text-decoration:none;color:var(--ink);font-size:15px;align-items:baseline}
nav#side a .n{min-width:2.2em;color:var(--muted);font-variant-numeric:tabular-nums}
nav#side a .c{margin-left:auto;font-size:12px;color:var(--acc2)}
nav#side a.on{background:var(--sea);font-weight:600}
main{padding:28px clamp(16px,4vw,56px) 80px;max-width:1000px}
#topbar{display:none}
h1{font-size:30px;line-height:1.2;margin:4px 0 6px}
.kicker{color:var(--muted);font-size:15px;letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.card h3{margin:0 0 8px;font-size:18px}
.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 6px}
.ort{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.ort .name{font-weight:650;font-size:18px}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
@media (prefers-color-scheme:dark){.navbtn{color:#0c1517}}
.ziel{color:var(--muted);font-size:14px}
.badge{font-size:12px;border-radius:6px;padding:1px 7px;border:1px solid currentColor}
.b-opt{color:var(--opt)}.b-warn{color:var(--warn)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
figure{margin:0}
figure img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.timeline li:last-child{border:0}
.timeline .z{font-variant-numeric:tabular-nums;color:var(--acc2);font-weight:600}
.hint{border-left:4px solid var(--warn);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
.vorschlag{border:2px dashed var(--opt)}
.vorschlag .tag{color:var(--opt);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.votes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.votes button,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.votes button.on{background:var(--opt);color:#fff;border-color:var(--opt)}
.btn.prim{background:var(--acc);border-color:var(--acc);color:#fff}
textarea{width:100%;min-height:110px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.saved{font-size:12px;color:var(--muted);height:16px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pager a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink)}
.pager a.r{text-align:right}
svg.map{width:100%;height:auto;background:var(--sea);border-radius:14px;border:1px solid var(--line)}
.map .land{fill:var(--land);stroke:none}
.map .all{fill:none;stroke:var(--muted);stroke-width:.06;opacity:.45}
.map .leg{fill:none;stroke:var(--route);stroke-width:.14;stroke-linecap:round}
.map .pt{fill:var(--acc)}
.map .ptc{fill:var(--route)}
.map text{font-size:.42px;fill:var(--ink)}
.lead{font-size:19px;font-weight:550}
.fliess p{margin:0 0 12px}
.otext{margin:8px 0 4px}.otext p{margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
#warn{display:none;background:var(--warn);color:#fff;padding:8px 14px;font-size:14px}
@media (max-width:820px){
 #app{grid-template-columns:1fr}
 nav#side{position:fixed;inset:0 25% 0 0;z-index:9;transform:translateX(-105%);transition:transform .2s;height:100%}
 nav#side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
 #topbar{display:flex;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;gap:10px;align-items:center}
 .two{grid-template-columns:1fr}
 main{padding:18px 16px 70px}
 h1{font-size:25px}
}
</style>
</head>
<body>
<div id="warn">Speicher nicht verfügbar – Kommentare gehen beim Schließen verloren. Bitte vorher exportieren.</div>
<div id="topbar"><button class="btn" id="menu">☰ Tage</button><strong id="tbt"></strong></div>
<div id="app"><nav id="side"></nav><main id="main"></main></div>
<script>
const D=/*__DATEN__*/null;
const KEY="nz27-notizen-v1";
let S={seiten:{},votes:{}};
let speicherOk=true;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){speicherOk=false}
if(!speicherOk)document.getElementById("warn").style.display="block";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){speicherOk=false;document.getElementById("warn").style.display="block"}}
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const absaetze=s=>String(s||"").trim().split(/\n\s*\n/).map(x=>`<p>${md(x)}</p>`).join("");
const hatKommentar=id=>(S.seiten[id]&&S.seiten[id].text.trim())?1:0;

/* ---------- Karte ---------- */
const K=Math.cos(41*Math.PI/180);
const P=([la,lo])=>[(lo-166)*K,(-34-la)];
const pathOf=pts=>pts.map((p,i)=>(i?"L":"M")+P(p).map(v=>v.toFixed(3)).join(",")).join("")
const LAND=D.kueste.map(r=>pathOf(r)+"Z").join("");
const ALL=D.tage.filter(t=>t.geom.length).map(t=>pathOf(t.geom)).join("");
function karte(t){
  let vb="0 0 10.2 14.2", pts="";
  if(t){
    const g=t.geom.length?t.geom:[];
    const ps=[...g];
    if(t.nacht&&!t.nacht.ort.fehlt)ps.push([t.nacht.ort.lat,t.nacht.ort.lon]);
    t.programm.forEach(p=>{if(p.ort&&!p.ort.fehlt)ps.push([p.ort.lat,p.ort.lon])});
    if(ps.length){
      const xy=ps.map(P);let x0=Math.min(...xy.map(a=>a[0])),x1=Math.max(...xy.map(a=>a[0])),y0=Math.min(...xy.map(a=>a[1])),y1=Math.max(...xy.map(a=>a[1]));
      const pad=Math.max(.6,(x1-x0)*.25,(y1-y0)*.25);x0-=pad;y0-=pad;x1+=pad;y1+=pad;
      const w=Math.max(x1-x0,(y1-y0)*.75),h=Math.max(y1-y0,w/1.4);vb=`${((x0+x1)-w)/2} ${((y0+y1)-h)/2} ${w} ${h}`;
      const s=w/10;
      t.programm.forEach(p=>{if(p.ort&&!p.ort.fehlt){const[x,y]=P([p.ort.lat,p.ort.lon]);pts+=`<circle class="ptc" cx="${x}" cy="${y}" r="${.09*s}"/>`}});
      if(t.nacht&&!t.nacht.ort.fehlt){const[x,y]=P([t.nacht.ort.lat,t.nacht.ort.lon]);pts+=`<circle class="pt" cx="${x}" cy="${y}" r="${.14*s}"/>`}
      return `<svg class="map" viewBox="${vb}" style="--s:${s}"><path class="land" d="${LAND}"/><path class="all" d="${ALL}" style="stroke-width:${.05*s}"/>${g.length?`<path class="leg" d="${pathOf(g)}" style="stroke-width:${.12*s}"/>`:""}${pts}</svg>`;
    }
  }
  D.tage.forEach(t=>{if(t.nacht&&!t.nacht.ort.fehlt&&t.tag%3==1){const[x,y]=P([t.nacht.ort.lat,t.nacht.ort.lon]);pts+=`<circle class="pt" cx="${x}" cy="${y}" r=".09"/><text x="${x+.13}" y="${y+.13}">${t.tag}</text>`}});
  return `<svg class="map" viewBox="${vb}"><path class="land" d="${LAND}"/><path class="leg" d="${ALL}" style="stroke-width:.05"/>${pts}</svg>`;
}

/* ---------- Bausteine ---------- */
function bilder(o){return o&&o.bilder&&o.bilder.length?`<div class="imgs">${o.bilder.map(b=>`<figure><img loading="lazy" src="${b.src}" alt="${esc(b.motiv)}"><figcaption>${esc(b.motiv)}${b.credit?" · "+esc(b.credit):""}</figcaption></figure>`).join("")}</div>`:""}
function ortZeile(o,extra=""){
  if(!o)return"";
  if(o.fehlt)return `<div class="ort"><span class="name">${esc(o.name)}</span><span class="badge b-warn">Koordinate fehlt</span></div>`;
  return `<div class="ort"><span class="name">${esc(o.name)}</span>${extra}${o.unsicher?'<span class="badge b-warn">⚠ Ort unsicher</span>':""}<a class="navbtn" href="${o.nav}" target="_blank" rel="noopener">🧭 ${o.start?"Route ab "+esc(o.start.split(" (")[0].slice(0,28)):"Navigation"}</a>${o.start?`<a class="ziel" href="${o.navhier}" target="_blank" rel="noopener">📍 ab Standort</a>`:""}</div>${o.text?`<div class="otext">${absaetze(o.text)}</div>`:""}${o.ziel?`<div class="ziel">Ziel: ${esc(o.ziel)}</div>`:""}${o.hinweis?`<div class="ziel">${esc(o.hinweis)}</div>`:""}`;
}
function kommentar(id,label){
  const v=(S.seiten[id]||{}).text||"";
  return `<div class="card"><h3>💬 ${esc(label)}</h3><textarea data-k="${id}" placeholder="Gedanken, Änderungswünsche, Fragen …">${esc(v)}</textarea><div class="saved" id="sv-${id}">${S.seiten[id]?"gespeichert "+new Date(S.seiten[id].ts).toLocaleString("de-DE"):""}</div></div>`;
}
function vorschlag(v){
  const st=S.votes[v.id]||"";
  const b=(k,l)=>`<button data-v="${v.id}" data-w="${k}" class="${st==k?"on":""}">${l}</button>`;
  return `<div class="card vorschlag"><div class="tag">Vorschlag – noch nicht im Plan</div><h3>${esc(v.titel)}</h3>${ortZeile(v.ort)}<p>${md(v.text)}</p>${v.aufwand?`<div class="ziel">Aufwand: ${esc(v.aufwand)}</div>`:""}${bilder(v.ort)}<div class="votes">${b("ja","👍 Übernehmen")}${b("vielleicht","🤔 Vielleicht")}${b("nein","👎 Nein")}</div>${kommentar(v.id,"Kommentar zum Vorschlag")}</div>`;
}

/* ---------- Seiten ---------- */
function seiteStart(){
  return `<div class="kicker">Reisebroschüre · Stand ${esc(D.gebaut)}</div><h1>${esc(D.titel)}</h1>
  <div class="chips"><span class="chip">19.03.–18.05.2027</span><span class="chip">61 Tage</span><span class="chip">Christchurch → Auckland</span><span class="chip">${D.tage.reduce((a,t)=>a+(t.km||0),0).toLocaleString("de-DE")} km Hauptstrecke</span></div>
  <div class="two"><div>
  <div class="sec">Fixpunkte</div><div class="card"><table>${D.fixpunkte.map(f=>`<tr><td style="white-space:nowrap"><strong>${esc(f.datum)}</strong></td><td>${esc(f.was)}${f.ort&&!f.ort.fehlt?` · <a href="${f.ort.nav}" target="_blank">Navigation</a>`:""}</td></tr>`).join("")}</table></div>
  <div class="sec">Grundsätze</div><div class="card"><ul>${D.grundsaetze.map(g=>`<li>${md(g)}</li>`).join("")}</ul></div>
  </div><div>${karte(null)}<p class="ziel">Zahlen = Tag der Übernachtung (jeder 3. Tag).</p>
  <p><a class="btn prim" href="#kommentare">💬 Kommentare & Export</a></p><p><a class="btn" href="#vorschlaege">💡 Alle Vorschläge</a></p></div></div>
  ${kommentar("gesamt","Kommentar zur ganzen Broschüre")}
  <div class="pager"><span></span><a class="r" href="#tag-1">Tag 1 →</a></div>`;
}
function seiteTag(t){
  const i=D.tage.indexOf(t),pv=D.tage[i-1],nx=D.tage[i+1];
  const a=t.ablauf||{};
  let h=`<div class="kicker">Tag ${t.tag} · ${esc(t.datum)} · ${t.insel=="sued"?"Südinsel":"Nordinsel"}</div><h1>${esc(t.titel)}</h1>
  <div class="chips">${t.km!=null?`<span class="chip">🚐 ${t.km} km · ${Math.floor(t.min/60)}:${String(t.min%60).padStart(2,"0")} h</span>`:""}<span class="chip">🌅 ${t.sonne[0]} · 🌇 ${t.sonne[1]}</span>${t.vorschlaege.length?`<span class="chip">💡 ${t.vorschlaege.length} Vorschlag</span>`:""}</div>
  <div class="two"><div>${a.intro?`<p class="lead">${md(a.intro)}</p>`:""}${a.text?`<div class="fliess">${absaetze(a.text)}</div>`:""}${t.fahrt?`<p class="ziel">${md(t.fahrt)}</p>`:""}</div>
  <div>${karte(t)}<p class="ziel">${t.von?`Start: ${esc(t.von)}`:""}${t.nacht?`<br>Ziel: ${esc(t.nacht.ort.name)}`:""}</p></div></div>
  ${(a.schritte||[]).length?`<div class="sec">So könnte der Tag laufen</div><div class="card"><ul class="timeline">${a.schritte.map(s=>`<li><span class="z">${esc(s.zeit)}</span><span>${md(s.text)}</span></li>`).join("")}</ul></div>`:""}`;
  t.hinweise.forEach(x=>h+=`<div class="hint">⚠️ ${md(x)}</div>`);
  if(t.programm.length){h+=`<div class="sec">Programm</div>`;t.programm.forEach(p=>{h+=`<div class="card">${ortZeile(p.ort,p.optional?'<span class="badge b-opt">optional</span>':"")}${p.text?`<p>${md(p.text)}</p>`:""}${bilder(p.ort)}</div>`})}
  if(t.nacht){const n=t.nacht;h+=`<div class="sec">Übernachtung</div><div class="card">${ortZeile(n.ort,`<span class="badge">${esc(n.typ)}</span>`)}${n.hinweis?`<p>${md(n.hinweis)}</p>`:""}${bilder(n.ort)}${n.alternativen.map(x=>`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div class="ziel">Alternative</div>${ortZeile(x.ort,`<span class="badge">${esc(x.typ)}</span>`)}${x.hinweis?`<div class="ziel">${md(x.hinweis)}</div>`:""}</div>`).join("")}</div>`}
  if(t.versorgung.length){h+=`<div class="sec">Versorgung</div><div class="card">${t.versorgung.map(v=>`<div style="margin:6px 0"><strong>${esc(v.typ)}</strong> ${v.ort?ortZeile(v.ort):esc(v.text)}</div>`).join("")}</div>`}
  if(t.buchung.length)h+=`<div class="sec">Buchen</div><div class="card"><ul>${t.buchung.map(b=>`<li>${md(b)}</li>`).join("")}</ul></div>`;
  if(t.vorschlaege.length){h+=`<div class="sec">Vorschläge</div>`;t.vorschlaege.forEach(v=>h+=vorschlag(v))}
  h+=kommentar("tag-"+t.tag,`Kommentar zu Tag ${t.tag}`);
  h+=`<div class="pager">${pv?`<a href="#tag-${pv.tag}">← Tag ${pv.tag}<br><small>${esc(pv.titel)}</small></a>`:`<a href="#start">← Start</a>`}${nx?`<a class="r" href="#tag-${nx.tag}">Tag ${nx.tag} →<br><small>${esc(nx.titel)}</small></a>`:`<a class="r" href="#kommentare">Kommentare →</a>`}</div>`;
  return h;
}
function seiteVorschlaege(){
  const all=D.tage.flatMap(t=>t.vorschlaege.map(v=>({...v,tag:t.tag,datum:t.datum})));
  return `<h1>Vorschläge</h1><p>Stopps, die noch nicht im Plan sind, aber zu euch passen könnten. Abstimmen + kommentieren, dann exportieren.</p>`+
   all.map(v=>`<div class="kicker"><a href="#tag-${v.tag}">Tag ${v.tag} · ${esc(v.datum)}</a></div>`+vorschlag(v)).join("")||"<p>Noch keine Vorschläge.</p>";
}
function exportMd(){
  const L=[`# NZ27 Broschüre – Kommentare`,``,`Export: ${new Date().toLocaleString("de-DE")} · Broschüre gebaut: ${D.gebaut}`,``];
  const c=id=>((S.seiten[id]||{}).text||"").trim();
  if(c("gesamt"))L.push(`## Gesamt`,``,c("gesamt"),``);
  D.tage.forEach(t=>{
    const parts=[];
    if(c("tag-"+t.tag))parts.push(c("tag-"+t.tag));
    t.vorschlaege.forEach(v=>{const vt=S.votes[v.id],k=c(v.id);if(vt||k)parts.push(`- Vorschlag „${v.titel}“ (${v.ort.id}): **${vt||"keine Wertung"}**${k?" – "+k.replace(/\n/g," "):""}`)});
    if(parts.length)L.push(`## Tag ${t.tag} · ${t.datum} · ${t.titel}`,``,...parts,``);
  });
  L.push("---","Rohdaten (für Import):","```json",JSON.stringify(S),"```");
  return L.join("\n");
}
function seiteKommentare(){
  const n=Object.values(S.seiten).filter(x=>x.text.trim()).length,v=Object.keys(S.votes).length;
  return `<h1>Kommentare & Export</h1><p>${n} Kommentare · ${v} Vorschlags-Wertungen gespeichert ${speicherOk?"(im Browser dieses Geräts)":"<strong>(NICHT dauerhaft gespeichert!)</strong>"}.</p>
  <div class="card"><h3>Exportieren</h3><p>Erzeugt eine Markdown-Datei mit allen Kommentaren und Wertungen – die kannst du Claude geben.</p>
  <button class="btn prim" id="dl">⬇ Als Datei herunterladen</button> <button class="btn" id="cp">📋 In Zwischenablage</button><div class="saved" id="exmsg"></div></div>
  <div class="card"><h3>Importieren</h3><p>Nach dem Austausch der Broschüren-Datei: vorher exportierte Datei wählen, um Kommentare wiederherzustellen.</p><input type="file" id="imp" accept=".md,.txt,.json"></div>
  <div class="card"><h3>Vorschau</h3><pre style="white-space:pre-wrap;font-size:13px">${esc(exportMd().split("---\nRohdaten")[0])}</pre></div>`;
}

/* ---------- Router ---------- */
function side(cur){
  const items=[`<a href="#start" class="${cur=="start"?"on":""}"><span class="n">★</span>Start${hatKommentar("gesamt")?'<span class="c">💬</span>':""}</a>`,`<a href="#vorschlaege" class="${cur=="vorschlaege"?"on":""}"><span class="n">💡</span>Vorschläge</a>`,`<a href="#kommentare" class="${cur=="kommentare"?"on":""}"><span class="n">💬</span>Kommentare & Export</a>`];
  let ins="";
  D.tage.forEach(t=>{if(t.insel!=ins){ins=t.insel;items.push(`<h2>${ins=="sued"?"Südinsel":"Nordinsel"}</h2>`)}
    items.push(`<a href="#tag-${t.tag}" class="${cur=="tag-"+t.tag?"on":""}"><span class="n">${t.tag}</span><span>${esc(t.titel)}<br><small style="color:var(--muted)">${esc(t.datum)}</small></span>${hatKommentar("tag-"+t.tag)?'<span class="c">💬</span>':""}</a>`)});
  $("#side").innerHTML=items.join("");
}
let CUR="start";
function go(h){CUR=h||"start";try{history.replaceState(null,"","#"+CUR)}catch(e){}route()}
function route(){
  const h=CUR;
  let html,titel;
  const m=h.match(/^tag-(\d+)$/);
  if(m){const t=D.tage.find(x=>x.tag==+m[1]);html=seiteTag(t);titel=`Tag ${t.tag}`}
  else if(h=="vorschlaege"){html=seiteVorschlaege();titel="Vorschläge"}
  else if(h=="kommentare"){html=seiteKommentare();titel="Kommentare"}
  else{html=seiteStart();titel="Start"}
  $("#main").innerHTML=html;$("#tbt").textContent=titel;side(h);$("#side").classList.remove("open");window.scrollTo(0,0);
  const on=$("#side a.on");if(on)on.scrollIntoView({block:"nearest"});
  try{localStorage.setItem(KEY+"-seite",h)}catch(e){}
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1))},true);
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;S.seiten[k]={text:e.target.value,ts:Date.now()};save();const s=document.getElementById("sv-"+k);if(s)s.textContent="gespeichert "+new Date().toLocaleTimeString("de-DE")});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v){S.votes[b.dataset.v]=S.votes[b.dataset.v]==b.dataset.w?undefined:b.dataset.w;if(!S.votes[b.dataset.v])delete S.votes[b.dataset.v];save();b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",S.votes[x.dataset.v]==x.dataset.w))}
  if(b.id=="menu")$("#side").classList.toggle("open");
  if(b.id=="dl"){const blob=new Blob([exportMd()],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`nz27-kommentare-${new Date().toISOString().slice(0,10)}.md`;document.body.appendChild(a);a.click();a.remove();$("#exmsg").textContent="Download gestartet (Ordner „Downloads“)."}
  if(b.id=="cp"){const t=exportMd();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$("#exmsg").textContent="Kopiert.").catch(()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("#exmsg").textContent="Kopiert."})}
});
document.addEventListener("change",e=>{if(e.target.id!="imp")return;const f=e.target.files[0];if(!f)return;f.text().then(txt=>{const m=txt.match(/```json\n([\s\S]*?)\n```/);try{const o=JSON.parse(m?m[1]:txt);S.seiten=Object.assign({},o.seiten||{},S.seiten);S.votes=Object.assign({},o.votes||{},S.votes);save();alert("Importiert.");route()}catch(err){alert("Datei nicht erkannt.")}})});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!=CUR){CUR=h;route()}});
(function(){let h=location.hash.slice(1);if(!h){try{h=localStorage.getItem(KEY+"-seite")||""}catch(e){}}go(h||"start")})();
</script>
</body>
</html>
